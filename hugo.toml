baseURL = "https://www.misericordia-ariccia.it/"
languageCode = "it-IT"
defaultContentLanguage = "it"
timeZone = "Europe/Rome"
title = "Misericordia di Ariccia ODV"
# URL relativi: il sito funziona identico in /anteprima/ e nella radice
relativeURLs = true
disableKinds = ["taxonomy", "term"]
# Data di ultima modifica delle pagine presa dalla cronologia git
# (richiede il checkout completo nel workflow di deploy: fetch-depth 0)
enableGitInfo = true

# Indice JSON per la ricerca interna al sito (generato in /index.json)
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Sitemap: frequenza indicativa; le date di modifica vengono da git (enableGitInfo)
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  # Titolo della home per i motori di ricerca (l'H1 in pagina resta quello del layout)
  titoloHome = "Misericordia di Ariccia ODV — Trasporto infermi, volontariato e servizi ai Castelli Romani"
  descrizione = "Confraternita di Misericordia di Ariccia ODV — volontariato, servizi alla persona, Centro di Ascolto e Banco Alimentare, formazione e Servizio Civile Universale ai Castelli Romani dal 1994."
  telefono = "348 4068657"
  telefonoFisso = "06 933 3717"
  telefonoInfo = "328 8105399"
  email = "sede@misericordia-ariccia.it"
  pec = "misericordia-ariccia@pec.misericordia-ariccia.it"
  indirizzo = "Via Beata Rosa Venerini, 6 — 00072 Ariccia (RM)"
  sedeLegale = "Via Beata Rosa Venerini, 6 — 00072 Ariccia (RM)"
  sedeOperativa = "Piazzale Aldo Moro, 6 — 00072 Ariccia (RM)"
  sedeAmministrativa = "Viale Antonietta Chigi, 46 — 00072 Ariccia (RM)"
  codiceFiscale = "90031910582"
  facebook = "https://www.facebook.com/MiseAriccia"
  instagram = "https://www.instagram.com/confraternitamisericordia"


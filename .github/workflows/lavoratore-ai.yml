name: "🤝 AI automatiche: richieste della bacheca"

# Le AI automatiche della squadra prendono da sole le richieste della bacheca (COORDINAMENTO.md, «Richieste»)
# indirizzate a loro: ChatGPT automatico (Codex con l'accesso ChatGPT di Alessandro), Gemini automatico (chiave
# gratuita della Gemini API), DeepSeek, GLM, Kimi e Qwen automatici (Ollama Cloud), Claude automatico (Agent SDK con i
# crediti API del piano Ultra, dall'11/11/2026: i crediti coprono l'Agent SDK, non il programma Claude Code). Lavorano su
# un ramo auto/… e consegnano una PR in bozza; unire resta a chi controlla (protocollo comune, § «AI automatiche»).
# Se il servizio è occupato lo script prova fino a tre modelli, in due giri (se la quota gratuita di un modello è finita,
# il successivo); se nessuno lavora toglie il ramo e la richiesta riparte al giro dopo. Se GitHub Actions non può aprire
# la PR (impostazione di base dei repository personali) il lavoro resta sul ramo, il run è verde e la PR la apre chi
# controlla, anche dal cellulare (passa-a.py chiudi --ramo).
#
# Segreti del repository, messi dal PC con scripts/collega-ai-automatiche.sh: CHATGPT_ACCESSO, GEMINI_API_KEY,
# OLLAMA_API_KEY, CLAUDE_CREDITI_API_KEY (solo nei passi di Claude automatico: il motore la passa all'agente come
# ANTHROPIC_API_KEY nel solo processo dell'agente, mai nell'ambiente del job; «raccogli» e «consegna» la ricevono per
# controllare che non finisca nel lavoro). Senza il segreto che serve, la richiesta resta aperta e il run è rosso (lo
# vede la sorveglianza dei guasti). Il programma dell'AI lavora in un job che può solo leggere il repository (lavora, lavora-chatgpt):
# commit, push, bacheca e PR li fanno «prendi» e «consegna», job senza l'AI, e .github/, .githooks/ e COORDINAMENTO.md
# li cura solo lo script. L'accesso ChatGPT lo riceve solo il job di ChatGPT; si rinnova a ogni uso: la copia
# rinnovata si salva cifrata nella cache (scripts/riserva-credenziale.sh, come la riserva), e ogni 6 giorni il giro
# del mattino lo tiene vivo anche senza lavori. Correzione del 06/11/2026: prima l'AI lavorava nel job che scriveva.
#
# Riserva (dall'11/11/2026, decisione di Alessandro): quando le routine quotidiane di Claude sono ferme, il giro
# programmato scrive da sé, al massimo una volta al giorno, la richiesta «Routine di oggi del … (riserva automatica)»
# per Claude automatico (passo «Routine ferme?» di «trova», `lavoratore-ai.py riserva`); in assistente-personale la
# scrive la riserva automatica (riserva-automatica.yml), che poi avvia questo workflow con workflow_dispatch.
#
# Nasce il 05/11/2026 (Alessandro: «Fai in modo che tra AI si parlino in autonomia», «Parlino e aiutino»,
# «Non riesci a forzare l'avvio di codex di chatgpt?»).

on:
  push:
    branches: [main]
    paths: [COORDINAMENTO.md]
  schedule:
    # Rete di sicurezza: richieste rimaste indietro, chiavi collegate dopo, accesso da tenere vivo. Alle 08:23 UTC (09:23
    # italiane d'inverno, 10:23 d'estate) le quote giornaliere gratuite di Gemini, che si azzerano a mezzanotte del
    # Pacifico, sono già nuove: una richiesta fermata dalla quota il giorno prima riparte con la quota piena.
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lavoratore-ai   # un lavoro per volta: l'accesso ChatGPT si rinnova e va salvato in fila
  cancel-in-progress: false

jobs:
  trova:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # solo per la richiesta di riserva del giro programmato (passo «Routine ferme?»)
      issues: read
    outputs:
      trovata: ${{ steps.trova.outputs.trovata }}
      motore: ${{ steps.trova.outputs.motore }}
      accesso: ${{ steps.trova.outputs.accesso }}
    steps:
      - name: "📥 Bacheca e script dal ramo principale"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            COORDINAMENTO.md
            scripts/lavoratore-ai.py
            scripts/imposta-identita-git.sh
            scripts/riserva-automatica.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Solo nel giro programmato: se le routine quotidiane sono ferme (due giri di fila della rassegna di
      # sito-pc-genzano senza il segno dell'account di Alessandro, lo stesso segnale della riserva automatica di
      # assistente-personale) e c'è la chiave dei crediti, scrive sul ramo principale, al massimo una volta al giorno,
      # la richiesta delle routine di oggi per Claude automatico (solo ciò che si fa con i file del repository: niente
      # connettori, niente social, niente routine segnate 🔴); il passo dopo la prende nello stesso giro. In
      # assistente-personale la scrive la riserva automatica e qui non si fa nulla. Decisione di Alessandro
      # dell'11/11/2026. È un passo di «trova» e non un job a parte: un job saltato prima di «trova» farebbe saltare
      # anche i job dopo. Se non riesce, il run continua (le altre richieste non si fermano) e lo dice l'avviso.
      - name: "🛟 Routine ferme? Richiesta delle routine di oggi"
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
          HA_CLAUDE_CREDITI_API_KEY: ${{ secrets.CLAUDE_CREDITI_API_KEY != '' }}
        run: |
          bash scripts/imposta-identita-git.sh
          python3 scripts/lavoratore-ai.py riserva

      - name: "🔎 Richieste per le AI automatiche"
        id: trova
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
          HA_CHATGPT_ACCESSO: ${{ secrets.CHATGPT_ACCESSO != '' }}
          HA_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
          HA_OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY != '' }}
          HA_CLAUDE_CREDITI_API_KEY: ${{ secrets.CLAUDE_CREDITI_API_KEY != '' }}
        run: |
          echo "accesso=$HA_CHATGPT_ACCESSO" >> "$GITHUB_OUTPUT"
          python3 scripts/lavoratore-ai.py trova

  prendi:
    # Job che scrive, senza l'AI: prende la richiesta (ramo, voce di bacheca, PR in bozza) e passa ai job dopo lo stato
    # in un output, che nessun job dopo può cambiare.
    needs: trova
    if: needs.trova.outputs.trovata == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      preso: ${{ steps.prendi.outputs.preso }}
      motore: ${{ steps.prendi.outputs.motore }}
      ramo: ${{ steps.prendi.outputs.ramo }}
      sha: ${{ steps.prendi.outputs.sha }}
      stato: ${{ steps.prendi.outputs.stato }}
    steps:
      - name: "📥 Checkout del ramo principale"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: "🪪 Identità dei commit (Alessandro Cuollo)"
        run: bash scripts/imposta-identita-git.sh

      - name: "📌 Prende la richiesta: ramo, voce di bacheca, PR in bozza (se il repository lo permette)"
        id: prendi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
          HA_CHATGPT_ACCESSO: ${{ secrets.CHATGPT_ACCESSO != '' }}
          HA_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
          HA_OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY != '' }}
          HA_CLAUDE_CREDITI_API_KEY: ${{ secrets.CLAUDE_CREDITI_API_KEY != '' }}
        run: python3 scripts/lavoratore-ai.py prendi

  lavora:
    # Il lavoro di Gemini, DeepSeek, GLM, Kimi, Qwen o Claude automatico. Il job può solo leggere il repository e non
    # riceve l'accesso ChatGPT: il programma dell'AI non ha nulla con cui scrivere su GitHub. Consegna un pacchetto (artefatto del run)
    # che il job «consegna» ricontrolla. Gli script girano da una copia presa prima dell'AI.
    needs: prendi
    if: needs.prendi.outputs.preso == 'true' && needs.prendi.outputs.motore != 'codex'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: "📥 Checkout del ramo di lavoro (senza credenziali salvate)"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prendi.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: "🪪 Identità e copia degli script"
        run: |
          bash scripts/imposta-identita-git.sh
          mkdir -p "$RUNNER_TEMP/fidati"
          cp scripts/lavoratore-ai.py scripts/consulto-ai.py scripts/motore-agentsdk.py "$RUNNER_TEMP/fidati/"

      - name: "🧩 Agent SDK (solo Claude automatico), alla versione fissata nello script"
        if: needs.prendi.outputs.motore == 'agentsdk'
        run: |
          python3 -m venv "$RUNNER_TEMP/agentsdk"
          "$RUNNER_TEMP/agentsdk/bin/pip" install --quiet --disable-pip-version-check \
            "$(python3 "$RUNNER_TEMP/fidati/lavoratore-ai.py" programma agentsdk)"
          echo "AGENTSDK_PYTHON=$RUNNER_TEMP/agentsdk/bin/python" >> "$GITHUB_ENV"

      - name: "🤖 Lavoro dell'AI"
        env:
          LAVORATORE_STATO: ${{ needs.prendi.outputs.stato }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          CLAUDE_CREDITI_API_KEY: ${{ needs.prendi.outputs.motore == 'agentsdk' && secrets.CLAUDE_CREDITI_API_KEY || '' }}
          CLAUDE_AUTOMATICO_MODELLO: ${{ vars.CLAUDE_AUTOMATICO_MODELLO || 'sonnet' }}
          CLAUDE_AUTOMATICO_BUDGET_USD: ${{ vars.CLAUDE_AUTOMATICO_BUDGET_USD || '10' }}
        run: |
          node --version
          python3 "$RUNNER_TEMP/fidati/lavoratore-ai.py" motore

      - name: "📦 Pacchetto del lavoro"
        if: always()
        env:
          LAVORATORE_STATO: ${{ needs.prendi.outputs.stato }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          CLAUDE_CREDITI_API_KEY: ${{ needs.prendi.outputs.motore == 'agentsdk' && secrets.CLAUDE_CREDITI_API_KEY || '' }}
        run: python3 "$RUNNER_TEMP/fidati/lavoratore-ai.py" raccogli

      - name: "📤 Pacchetto al job che consegna"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lavoro
          path: ${{ runner.temp }}/lavoro
          retention-days: 1
          overwrite: true
          if-no-files-found: warn

      - name: "🧽 Pulizia"
        if: always()
        run: rm -rf "$HOME/.gemini" "$HOME/.claude" "$RUNNER_TEMP/agentsdk"

  lavora-chatgpt:
    # Il lavoro di ChatGPT automatico: come «lavora», con in più l'accesso ChatGPT (copia cifrata in cache).
    needs: prendi
    if: needs.prendi.outputs.preso == 'true' && needs.prendi.outputs.motore == 'codex'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      cambiato: ${{ steps.salva.outputs.cambiato }}
    steps:
      - name: "📥 Checkout del ramo di lavoro (senza credenziali salvate)"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prendi.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: "🪪 Identità e copia degli script"
        run: |
          bash scripts/imposta-identita-git.sh
          mkdir -p "$RUNNER_TEMP/fidati"
          cp scripts/lavoratore-ai.py scripts/consulto-ai.py scripts/riserva-credenziale.sh "$RUNNER_TEMP/fidati/"

      - name: "🔐 Accesso ChatGPT: copia cifrata in cache"
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/chatgpt-cache
          key: chatgpt-${{ github.run_id }}
          restore-keys: chatgpt-

      - name: "🔐 Accesso ChatGPT"
        env:
          SEME: ${{ secrets.CHATGPT_ACCESSO }}
          CODEX_HOME: ${{ runner.temp }}/casa-codex
          RISERVA_CACHE: ${{ runner.temp }}/chatgpt-cache
          NOME_SEGRETO: CHATGPT_ACCESSO
        run: bash "$RUNNER_TEMP/fidati/riserva-credenziale.sh" ripristina

      - name: "🤖 Lavoro dell'AI"
        env:
          LAVORATORE_STATO: ${{ needs.prendi.outputs.stato }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          CODEX_HOME: ${{ runner.temp }}/casa-codex
        run: |
          node --version
          python3 "$RUNNER_TEMP/fidati/lavoratore-ai.py" motore

      - name: "🔐 Accesso ChatGPT aggiornato, salvato cifrato"
        id: salva
        if: always()
        env:
          SEME: ${{ secrets.CHATGPT_ACCESSO }}
          CODEX_HOME: ${{ runner.temp }}/casa-codex
          RISERVA_CACHE: ${{ runner.temp }}/chatgpt-cache
          NOME_SEGRETO: CHATGPT_ACCESSO
        run: bash "$RUNNER_TEMP/fidati/riserva-credenziale.sh" salva

      - name: "🔐 Accesso ChatGPT in cache"
        if: always() && steps.salva.outputs.cambiato == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/chatgpt-cache
          key: chatgpt-${{ github.run_id }}-${{ github.run_attempt }}

      - name: "📦 Pacchetto del lavoro"
        if: always()
        env:
          LAVORATORE_STATO: ${{ needs.prendi.outputs.stato }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          SEME: ${{ secrets.CHATGPT_ACCESSO }}
          CODEX_HOME: ${{ runner.temp }}/casa-codex
        run: python3 "$RUNNER_TEMP/fidati/lavoratore-ai.py" raccogli

      - name: "📤 Pacchetto al job che consegna"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lavoro
          path: ${{ runner.temp }}/lavoro
          retention-days: 1
          overwrite: true
          if-no-files-found: warn

      - name: "🧽 Pulizia"
        if: always()
        env:
          CODEX_HOME: ${{ runner.temp }}/casa-codex
        run: bash "$RUNNER_TEMP/fidati/riserva-credenziale.sh" pulisci

  consegna:
    # Job che scrive, senza l'AI: parte dal ramo com'era alla presa in carico, ricontrolla il pacchetto (chiavi, file
    # che cura il sistema, collegamenti, dimensione), lo applica, fa commit, scrive l'esito in bacheca e aggiorna la PR.
    # Se il pacchetto manca (giro interrotto o scaduto) il ramo si toglie e la richiesta riparte.
    needs: [prendi, lavora, lavora-chatgpt]
    if: always() && needs.prendi.outputs.preso == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write   # per togliere dalla cache le copie vecchie dell'accesso ChatGPT
    steps:
      - name: "📥 Checkout del ramo di lavoro (senza credenziali salvate)"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prendi.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: "🪪 Identità e copia degli script"
        run: |
          bash scripts/imposta-identita-git.sh
          mkdir -p "$RUNNER_TEMP/fidati"
          cp scripts/lavoratore-ai.py scripts/riserva-credenziale.sh "$RUNNER_TEMP/fidati/"

      - name: "📥 Pacchetto del lavoro"
        continue-on-error: true   # se manca, la consegna lo dice e la richiesta riparte
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lavoro
          path: ${{ runner.temp }}/lavoro

      - name: "📦 Consegna: commit, esito in bacheca, PR aggiornata"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAVORATORE_STATO: ${{ needs.prendi.outputs.stato }}
          LAVORO_DIR: ${{ runner.temp }}/lavoro
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          CLAUDE_CREDITI_API_KEY: ${{ needs.prendi.outputs.motore == 'agentsdk' && secrets.CLAUDE_CREDITI_API_KEY || '' }}
        run: python3 "$RUNNER_TEMP/fidati/lavoratore-ai.py" consegna

      - name: "🔐 Copie vecchie dell'accesso ChatGPT"
        if: always() && needs.lavora-chatgpt.outputs.cambiato == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CACHE_PREFISSO: chatgpt-
        run: bash "$RUNNER_TEMP/fidati/riserva-credenziale.sh" sfoltisci

  mantieni:
    # Ogni 6 giorni una domanda minima tiene vivo l'accesso ChatGPT anche senza lavori (senza rinnovo scade).
    needs: trova
    if: github.event_name == 'schedule' && needs.trova.outputs.accesso == 'true' && needs.trova.outputs.trovata != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: "📥 Script dell'accesso"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/riserva-credenziale.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: "🔐 Accesso ChatGPT: copia cifrata in cache"
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/chatgpt-cache
          key: chatgpt-${{ github.run_id }}
          restore-keys: chatgpt-

      - name: "🗓️ Serve un rinnovo?"
        id: serve
        env:
          CACHE: ${{ runner.temp }}/chatgpt-cache
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, pathlib
          f = pathlib.Path(os.environ["CACHE"]) / "stato.json"
          try:
              ultimo = dt.date.fromisoformat(json.loads(f.read_text())["rinnovato"])
              giorni = (dt.date.today() - ultimo).days
          except Exception:
              giorni = 999
          print(f"Ultimo rinnovo: {giorni} giorni fa")
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write(f"rinnova={'true' if giorni >= 6 else 'false'}\n")
          PY

      - name: "🔐 Accesso ChatGPT"
        if: steps.serve.outputs.rinnova == 'true'
        env:
          SEME: ${{ secrets.CHATGPT_ACCESSO }}
          CODEX_HOME: ${{ runner.temp }}/casa-codex
          RISERVA_CACHE: ${{ runner.temp }}/chatgpt-cache
          NOME_SEGRETO: CHATGPT_ACCESSO
        run: bash scripts/riserva-credenziale.sh ripristina

      - name: "💬 Domanda minima"
        if: steps.serve.outputs.rinnova == 'true'
        env:
          CODEX_HOME: ${{ runner.temp }}/casa-codex
          CACHE: ${{ runner.temp }}/chatgpt-cache
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          npx --yes @openai/codex@0.166.0 exec --skip-git-repo-check --ephemeral "Rispondi solo: OK" > /dev/null
          mkdir -p "$CACHE"
          printf '{"rinnovato": "%s"}\n' "$(date -u +%F)" > "$CACHE/stato.json"
          echo "Accesso ChatGPT rinnovato."

      - name: "🔐 Accesso ChatGPT aggiornato, salvato cifrato"
        id: salva
        if: always() && steps.serve.outputs.rinnova == 'true'
        env:
          SEME: ${{ secrets.CHATGPT_ACCESSO }}
          CODEX_HOME: ${{ runner.temp }}/casa-codex
          RISERVA_CACHE: ${{ runner.temp }}/chatgpt-cache
          NOME_SEGRETO: CHATGPT_ACCESSO
        run: bash scripts/riserva-credenziale.sh salva

      - name: "🔐 Accesso ChatGPT in cache"
        if: always() && steps.salva.outputs.cambiato == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/chatgpt-cache
          key: chatgpt-${{ github.run_id }}-${{ github.run_attempt }}

      - name: "🔐 Copie vecchie dell'accesso"
        if: always() && steps.salva.outputs.cambiato == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CACHE_PREFISSO: chatgpt-
        run: bash scripts/riserva-credenziale.sh sfoltisci

      - name: "🧽 Pulizia"
        if: always()
        env:
          CODEX_HOME: ${{ runner.temp }}/casa-codex
        run: bash scripts/riserva-credenziale.sh pulisci

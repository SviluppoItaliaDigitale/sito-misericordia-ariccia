name: "Podcast: ricodifica le puntate (AAC 64 kbps mono)"

# Manutenzione a mano (dal 18/11/2026, adattata dal sito della Protezione Civile di
# Genzano): ricodifica le puntate .m4a di static/podcast/episodi/ in AAC 64 kbps mono
# e toglie ogni metadato (titolo, encoder, programma che ha fatto l'audio). Di norma
# non serve: pubblica-puntata.py le salva già così. Sostituisce un file solo se la
# nuova versione è valida, più piccola e della stessa durata (entro 2 secondi).
# Fa il commit su main, che ripubblica il sito.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comprimi-podcast
  cancel-in-progress: false

jobs:
  comprimi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installa ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Ricodifica a 64 kbps mono, senza metadati
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in static/podcast/episodi/*.m4a; do
            tmp="${f%.m4a}.tmp.m4a"
            ffmpeg -y -loglevel error -i "$f" -vn -c:a aac -b:a 64k -ac 1 \
              -map_metadata -1 -map_metadata:s:a -1 -fflags +bitexact -flags:a +bitexact \
              -movflags +faststart "$tmp"
            orig=$(stat -c%s "$f"); new=$(stat -c%s "$tmp")
            d1=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" | cut -d. -f1)
            d2=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$tmp" | cut -d. -f1)
            diff=$(( d1 > d2 ? d1 - d2 : d2 - d1 ))
            if [ "$new" -gt 1000 ] && [ "$new" -lt "$orig" ] && [ "$diff" -le 2 ]; then
              mv "$tmp" "$f"
              echo "Ricodificata $(basename "$f"): $(( orig / 1024 )) kB -> $(( new / 1024 )) kB"
            else
              rm -f "$tmp"
              echo "Lasciata com'era $(basename "$f") (nessun guadagno o durata diversa)"
            fi
          done

      - name: Commit su main
        run: |
          set -euo pipefail
          if git diff --quiet -- static/podcast/episodi/; then
            echo "Nessuna puntata cambiata."
            exit 0
          fi
          git config user.name "Alessandro Cuollo"
          git config user.email "65465537+SviluppoItaliaDigitale@users.noreply.github.com"
          git add static/podcast/episodi/*.m4a
          git commit -m "Podcast: puntate ricodificate a 64 kbps mono, senza metadati"
          for t in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          echo "Push non riuscito"; exit 1

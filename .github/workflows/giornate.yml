name: Giornate e ricorrenze (social)

# Post delle ricorrenze e delle giornate (Defunti, Tutti i Santi, giornate internazionali), come quelli
# della Confederazione: richiesta di Alessandro del 2/11/2026. La scheda del giorno è in
# .github/social/giornate/AAAA-MM-GG.json (testo, immagine, alt, hashtag) e la grafica, fatta con il
# modello nazionale post-giornata, in static/img/giornate/ (già online col deploy).
# Pubblica la scheda di oggi, se c'è e non è nel registro, al primo giro utile dalle 8:00 alle 21:59
# italiane: un giro ogni ora (GitHub non garantisce gli orari) e uno alla fine di una pubblicazione del
# sito partita da un'unione o avviata a mano, quando la grafica è appena andata online. I giri dopo quello
# riuscito non fanno nulla.
# In questo repository GitHub avvia i giri a orario molto meno spesso di quanto è scritto: «Sito
# raggiungibile», che ha un giro ogni ora, è partito 69 volte in venti giorni (5-25/11/2026), tre o quattro
# al giorno. Dal 15 al 24/11 almeno uno al giorno è caduto fra le 8:00 e le 21:59; in otto giorni su dieci
# il primo è partito fra le 12:40 e le 16:15. Senza una pubblicazione del sito al mattino, quindi, il post
# esce di solito nel primo pomeriggio.
# Fino al 25/11/2026 la finestra era 8:00-11:59 con quattro giri: GitHub ne avviava uno solo al giorno,
# nel pomeriggio, che finiva in verde senza pubblicare. Così i post del 15/11 e del 20/11 non sono mai
# usciti. Ora un giro in ritardo pubblica lo stesso, e controllo-giornate.yml apre una issue se a
# mezzogiorno il post di oggi manca ancora.
# Dal 25/11/2026 un giro parte anche da fuori ogni mattina alle 8:35 italiane, con esterno=true (chi lo
# fa: docs/giornate.md): si comporta come un giro a orario, quindi pubblica solo se oggi c'è una scheda
# e si è nella finestra, e negli altri casi finisce subito in verde.
# Sempre dal 25/11/2026 (Alessandro: «Se hai programmato deve uscire! Riprova finché non lo vedi online»):
# dopo la pubblicazione lo script chiede a Meta la conferma che il post è online e ne scrive l'indirizzo nel
# registro; se la pubblicazione o la conferma non riescono, riprova nello stesso giro fino a 6 volte, ogni 5
# minuti, senza pubblicare due volte ciò che è già nel registro. Gli avvii da fuori sono tre al giorno
# (8:35, 12:35 e 17:35). Se dopo i tentativi qualcosa manca il giro finisce in rosso.
# Procedura: docs/giornate.md
on:
  schedule:
    - cron: "31 6-20 * * *"
  workflow_run:
    workflows: ["Pubblica su Aruba (LIVE)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      data:
        description: "Giorno da pubblicare (AAAA-MM-GG, vuoto = oggi)"
        type: string
        default: ""
      prova:
        description: "Solo prova (mostra cosa pubblicherebbe)"
        type: boolean
        default: true
      esterno:
        description: "Avvio programmato da fuori (si comporta come i giri a orario: pubblica solo la scheda di oggi, fra le 8:00 e le 21:59)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: giornate
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    # 6 tentativi con 5 minuti di pausa stanno in meno di 50 minuti: il giro non deve essere interrotto prima
    # di salvare il registro, altrimenti il giro dopo pubblicherebbe una seconda volta.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Bastano le schede, il registro e lo script: il sito intero pesa più di un gigabyte
          # e ogni giro passava più di un minuto a scaricarlo.
          sparse-checkout: |
            .github/social
            scripts/pubblica_social.py
          sparse-checkout-cone-mode: false

      - name: Orario
        id: ora
        env:
          EVENTO: ${{ github.event_name }}
          ESTERNO: ${{ inputs.esterno }}
        run: |
          # L'avvio esterno (esterno=true) vale come un giro a orario.
          if [ "$ESTERNO" = "true" ]; then EVENTO=schedule; fi
          H=$((10#$(TZ=Europe/Rome date +%H)))
          OGGI=$(TZ=Europe/Rome date +%F)
          echo "Ora italiana: $(TZ=Europe/Rome date '+%A %d/%m %H:%M')"
          # Solo l'avvio a mano (Run workflow) pubblica fuori orario o un altro giorno.
          if [ "$EVENTO" != "workflow_dispatch" ] && { [ "$H" -lt 8 ] || [ "$H" -ge 22 ]; }; then
            echo "Fuori dalla finestra 8:00-21:59: niente da fare."; echo "salta=1" >> "$GITHUB_OUTPUT"
          elif [ "$EVENTO" != "workflow_dispatch" ] && [ ! -f ".github/social/giornate/$OGGI.json" ]; then
            echo "Oggi nessuna giornata in calendario."; echo "salta=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Pubblica sui social
        if: steps.ora.outputs.salta != '1'
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          DRY_RUN: ${{ (inputs.prova && !inputs.esterno) && '1' || '' }}
          # con l'avvio esterno il giorno è sempre oggi
          DATA: ${{ !inputs.esterno && inputs.data || '' }}
          GIORNATA_TENTATIVI: "6"
          GIORNATA_PAUSA: "300"
        run: python3 scripts/pubblica_social.py --giornata $DATA

      - name: Salva il registro dei post social
        if: always() && steps.ora.outputs.salta != '1'
        run: |
          git diff --quiet -- .github/social/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add .github/social/
          git commit -m "Social: registro giornate [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

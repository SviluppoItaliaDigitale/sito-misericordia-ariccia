name: Pubblica su Aruba (LIVE)

# Pubblicazione LIVE del sito alla radice di www.misericordia-ariccia.it
# (decisione utente del 2026-07-06, dopo l'OK sull'anteprima):
#  - push su main: ad ogni modifica dei contenuti su GitHub il sito viene
#    ricompilato e pubblicato alla radice del dominio;
#  - cron giornaliero: rebuild notturno per aggiornare la Parola/Liturgia
#    del giorno, il santo del giorno, le letture e gli annunci scaduti;
#  - workflow_dispatch: avvio manuale on-demand.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      social_prova:
        description: "Social: solo prova (mostra cosa pubblicherebbe, senza pubblicare)"
        type: boolean
        default: false
  schedule:
    # Ricostruzione giornaliera APPENA DOPO la mezzanotte italiana, così il
    # santo del giorno, le letture e gli annunci scaduti sono aggiornati fin
    # dai primi minuti del nuovo giorno. Il cron di GitHub è in UTC e l'ora
    # legale sposta l'offset dell'Italia: due pianificazioni si coprono a
    # vicenda tutto l'anno.
    #  - 22:05 UTC = 00:05 in ESTATE (ora legale, UTC+2); in inverno è solo
    #    una ricostruzione in più alle 23:05 del giorno prima (innocua).
    #  - 23:05 UTC = 00:05 in INVERNO (ora solare, UTC+1); in estate è una
    #    ricostruzione in più alle 01:05 (innocua).
    # Nota: GitHub può ritardare i cron di alcuni minuti nei momenti di
    # punta; il minuto 5 evita la congestione dell'ora esatta.
    - cron: "5 22 * * *"
    - cron: "5 23 * * *"

# contents: write serve per salvare il registro dei post social nel repo
permissions:
  contents: write

concurrency:
  group: deploy-aruba
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # storia completa: serve a Hugo (enableGitInfo) per mostrare
          # la data di ultimo aggiornamento reale di ogni pagina,
          # e al rebase quando si salva il registro dei post social
          fetch-depth: 0

      - name: Installa Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.154.5"
          extended: true

      - name: Compila il sito
        run: hugo --minify

      - name: Pubblica via FTPS su Aruba
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # il certificato del server Aruba è intestato al nome macchina:
          # la verifica stretta del nome host fallirebbe
          security: loose
          local-dir: public/
          server-dir: www.misericordia-ariccia.it/

      # ------------------------------------------------------------------
      # Pubblicazione automatica delle NUOVE news su Facebook e Instagram
      # (docs/pubblicazione-social.md). Gira dopo il deploy, così link e
      # immagini sono già online. Senza i secrets META_* resta in prova.
      # Un errore sui social non blocca né annulla il deploy del sito.
      - name: Pubblica le nuove news sui social
        id: social
        continue-on-error: true
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          DRY_RUN: ${{ inputs.social_prova && '1' || '' }}
        run: python3 scripts/pubblica_social.py

      - name: Salva il registro dei post social
        if: always()
        run: |
          git diff --quiet -- .github/social/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add .github/social/
          git commit -m "Social: registro post pubblicati [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Segnala errori social
        if: steps.social.outcome == 'failure'
        run: |
          echo "::warning::Pubblicazione social non riuscita: vedi il log dello step 'Pubblica le nuove news sui social'. Il sito è stato comunque pubblicato."

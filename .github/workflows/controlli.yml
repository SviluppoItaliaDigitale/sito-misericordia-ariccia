name: Controlli del sito

# Rete di sicurezza dopo ogni pubblicazione (audit del 9/10/2026):
#  - dopo il deploy «Pubblica su Aruba (LIVE)» e a mano (Run workflow): ricompila
#    il sito, cerca link/immagini/video mancanti, controlla la CSP, il registro dei
#    dati e le news in uscita, apre le pagine principali online e verifica il
#    certificato FTPS; il rapporto aggiorna la issue «Stato del sito»;
#  - su ogni pull request verso main: gli stessi controlli sulla build, senza issue.
# Script: scripts/controlli/controlla_sito.py (solo libreria standard Python).
on:
  workflow_run:
    workflows: ["Pubblica su Aruba (LIVE)"]
    types: [completed]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Le PR non devono annullare il controllo dopo un deploy (e viceversa): gruppi
# separati; si annulla solo un controllo vecchio della stessa PR.
concurrency:
  group: controlli-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  controlli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # come il deploy: Hugo usa la data dell'ultimo commit di ogni pagina

      - name: Installa Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.154.5"
          extended: true

      - name: Compila il sito (come il deploy)
        run: hugo --minify

      - name: Controlli
        id: controlli
        run: |
          LIVE=""
          [ "${{ github.event_name }}" != "pull_request" ] && LIVE="--live"
          python3 scripts/controlli/controlla_sito.py public $LIVE --report rapporto.md && echo "esito=ok" >> "$GITHUB_OUTPUT" || echo "esito=problemi" >> "$GITHUB_OUTPUT"

      # Certificato del server FTPS di Aruba: dal 9/10/2026 il deploy usa
      # «security: strict». Qui si verifica senza pubblicare nulla, così un
      # certificato scaduto o cambiato si vede prima che il deploy fallisca.
      # Il nome del server è un secret: nel rapporto va solo l'esito.
      - name: Certificato FTPS
        if: github.event_name != 'pull_request'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          if [ -z "$FTP_HOST" ]; then echo "- FTPS: secret FTP_HOST non disponibile" >> rapporto.md; exit 0; fi
          OUT=$(echo | timeout 30 openssl s_client -starttls ftp -connect "$FTP_HOST:21" -servername "$FTP_HOST" -verify_hostname "$FTP_HOST" 2>&1 || true)
          echo "$OUT" | grep -E "subject=|issuer=|Verify return code" || true
          echo | timeout 30 openssl s_client -starttls ftp -connect "$FTP_HOST:21" -servername "$FTP_HOST" 2>/dev/null | openssl x509 -noout -ext subjectAltName 2>/dev/null || true
          CODICE=$(echo "$OUT" | grep -o "Verify return code: [0-9]*" | tail -1 | grep -o "[0-9]*$")
          echo "" >> rapporto.md
          echo "### 🔐 Pubblicazione FTPS" >> rapporto.md
          if [ "$CODICE" = "0" ]; then
            echo "- ✅ Certificato valido e corrispondente al nome del server (il deploy usa la verifica stretta)." >> rapporto.md
          else
            echo "- ❌ Il certificato del server **non** è valido per il nome usato dal deploy (codice ${CODICE:-?}): il prossimo deploy con verifica stretta fallirà. Nel log di questo passaggio ci sono i nomi validi del certificato; se Aruba lo ha cambiato, aggiornare FTP_HOST (o, solo temporaneamente, \`security: loose\` in deploy.yml)." >> rapporto.md
          fi

      - name: Aggiorna la issue «Stato del sito»
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY: ${{ github.event.workflow_run.conclusion || 'avvio manuale' }}
          DEPLOY_URL: ${{ github.event.workflow_run.html_url || '' }}
        run: |
          {
            echo "Rapporto automatico del workflow **Controlli del sito**, aggiornato dopo ogni pubblicazione. Non chiudere questa issue."
            echo ""
            if [ "$DEPLOY" = "success" ]; then echo "### 🚀 Ultimo deploy: ✅ riuscito ([dettagli]($DEPLOY_URL))";
            elif [ "$DEPLOY" = "avvio manuale" ]; then echo "### 🚀 Controllo avviato a mano";
            else echo "### 🚀 Ultimo deploy: ❌ $DEPLOY ([dettagli]($DEPLOY_URL))"; fi
            echo ""
            cat rapporto.md
            echo ""
            echo "[Esecuzione di questo controllo](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > corpo.md
          N=$(gh issue list --state open --search 'in:title "Stato del sito"' --json number,title --jq '.[] | select(.title=="Stato del sito") | .number' | head -1)
          if [ -n "$N" ]; then gh issue edit "$N" --body-file corpo.md; else gh issue create --title "Stato del sito" --body-file corpo.md; fi

      # Tentativi sulle fonti delle letture (scarica() in scripts/liturgia_cei.py): un server locale
      # risponde con gli errori passeggeri visti il 21/10/2026. Se un caso non passa, il job fallisce.
      - name: Prova dei tentativi delle letture
        run: python3 scripts/controlli/prova_letture.py

      # Forme da non usare (FORME_SBAGLIATE in controlla_sito.py): esempi che il controllo deve
      # segnalare e forme giuste che deve lasciar passare. Se un caso non va, il job fallisce.
      - name: Prova delle forme da non usare
        run: python3 scripts/controlli/prova_forme.py

      # Firma «Misericordia di Ariccia» e cornice di microtesto (regola del 21/10/2026): il controllo deve
      # riconoscere il segno del motore solo nel posto giusto, e le grafiche in uscita devono averlo.
      - name: Prova di firma e cornice delle grafiche
        run: python3 scripts/controlli/prova_cornice.py

      # Testo alternativo dei post automatici (dal 21/10/2026): dove Meta lo accetta e dove no, ripresa senza
      # il parametro se Meta lo rifiuta, testi della Parola, alt di ogni news nel feed compilato qui sopra.
      - name: Prova del testo alternativo dei post
        run: python3 scripts/controlli/prova_testo_alternativo.py public/news/index.json

      - name: Esito
        if: steps.controlli.outputs.esito != 'ok'
        run: |
          echo "::error::Controlli non superati: vedi il rapporto (issue «Stato del sito» o log del passaggio Controlli)."
          exit 1

  # Cornice di microtesto nei PDF (rendi.py --cornice FILE.pdf, dal 21/10/2026) e modelli della skill: sulle PR che
  # toccano motore, modelli, skill o prova gira la prova dei PDF (rotazioni, campi del modulo, scansioni, margini
  # occupati, pezzi della cornice che escono dalla striscia) e l'autotest di rendi.py. Serve Chromium: sulle altre
  # PR il job lo dice e finisce subito.
  grafiche-pdf:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # HEAD è l'unione della PR con main: HEAD^1 è main

      - name: La PR tocca la grafica?
        id: tocca
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(scripts/grafica-brand/|\.claude/skills/grafiche-modelli-nazionali/|scripts/controlli/prova_cornice_pdf\.py$|\.github/workflows/controlli\.yml$)'; then
            echo "si=1" >> "$GITHUB_OUTPUT"
          else
            echo "La PR non tocca motore, modelli, skill o prova della cornice: prova dei PDF e autotest non servono."
          fi

      - name: Installa Python
        if: steps.tocca.outputs.si == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installa le librerie e Chromium
        if: steps.tocca.outputs.si == '1'
        run: |
          pip install -q playwright==1.56.0 pypdf==5.9.0 pypdfium2==5.13.0 numpy==2.5.3 pillow==12.3.0
          python -m playwright install --with-deps chromium

      - name: Prova della cornice nei PDF
        if: steps.tocca.outputs.si == '1'
        run: python3 scripts/controlli/prova_cornice_pdf.py

      - name: Autotest dei modelli
        if: steps.tocca.outputs.si == '1'
        run: python3 .claude/skills/grafiche-modelli-nazionali/rendi.py --autotest

name: Parola della domenica e delle feste (social)

# Ogni domenica e in ogni festa del calendario (scripts/parola-domenica/calendario.json:
# feste di precetto, Settimana santa, Defunti, Santo Stefano e solennità, scelta di
# Alessandro del 31/10/2026) pubblica su Facebook e Instagram la «Parola» preparata
# nei giorni prima dalla routine (.github/social/parola/AAAA-MM-GG.json + grafica in
# static/img/parola/, già online col deploy).
# Orari (regola di Alessandro del 18/10/2026: la Parola esce entro le 7:00, poi
# iniziano le Messe e non ha più senso; i controlli partono dalla mezzanotte):
#  - ogni mezz'ora da mezzanotte alle 4:47 italiane: VERIFICA che scheda e
#    pagine siano online; dalle 4:00 una mancanza rende rosso il giro (email);
#  - dalle 4:47 alle 7:00: PUBBLICA ciò che manca nel registro (i giri dopo il
#    primo riuscito trovano il registro e non fanno nulla);
#  - dopo le 6:50 non parte più nessuna pubblicazione, nemmeno a mano, e lo
#    script ricontrolla l'ora prima di ogni social: nulla esce dopo le 7:00.
# GitHub non garantisce gli avvii a orario (il 18/10/2026 ha saltato i giri
# delle 4:47): per questo i giri sono tanti, in minuti meno affollati. I cron
# girano ogni notte e coprono ora legale e ora solare; il passo «Orario» tiene
# solo quelli che cadono tra le 0:00 e le 7:00 italiane di un giorno della Parola
# (negli altri giorni il giro finisce subito).
# Procedura completa: docs/parola-della-domenica.md
on:
  schedule:
    - cron: "7,37 22,23 * * *"
    - cron: "7,37 0-5 * * *"
    - cron: "47 2 * * *"
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      data:
        description: "Giorno da pubblicare (AAAA-MM-GG, vuoto = oggi)"
        type: string
        default: ""
      prova:
        description: "Solo prova (mostra cosa pubblicherebbe)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: parola-domenica
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Orario
        id: ora
        env:
          EVENTO: ${{ github.event_name }}
          PROVA: ${{ inputs.prova }}
          DATA: ${{ inputs.data }}
        run: |
          HM=$((10#$(TZ=Europe/Rome date +%H%M)))    # es. 447 = 4:47
          OGGI=$(TZ=Europe/Rome date +%F)
          echo "Ora italiana: $(TZ=Europe/Rome date '+%A %d/%m %H:%M')"
          echo "hm=$HM" >> "$GITHUB_OUTPUT"
          # giorno della Parola? 0 = sì, 1 = no, 2 = calendario da aggiornare (si va avanti:
          # se la scheda di oggi c'è si pubblica, e la prova dei controlli segnala il calendario)
          RC=0; GIORNO=$(python3 scripts/parola-domenica/calendario.py oggi "$OGGI") || RC=$?
          echo "$GIORNO"
          if [ "$RC" -eq 2 ]; then
            echo "::warning::calendario.json non copre oggi: lanciare «calendario.py aggiorna»"
            [ -f ".github/social/parola/$OGGI.json" ] && RC=0
          fi
          if [ "$EVENTO" = "schedule" ]; then
            if [ "$RC" -ne 0 ] || [ "$HM" -ge 650 ]; then
              echo "salta=1" >> "$GITHUB_OUTPUT"; echo "Oggi niente Parola, o fuori dalla finestra 0:00-6:50 (entro le 7:00 la Parola deve essere uscita): niente da fare."
            elif [ "$HM" -lt 447 ]; then
              echo "modo=verifica" >> "$GITHUB_OUTPUT"
            else
              echo "modo=pubblica" >> "$GITHUB_OUTPUT"
            fi
          else
            # Avvio manuale: la prova va sempre; la pubblicazione vera solo per il giorno
            # della Parola di oggi e prima delle 7:00 (dopo iniziano le Messe).
            if [ "$PROVA" != "true" ]; then
              if [ "$RC" -ne 0 ] || [ "$HM" -ge 650 ] || { [ -n "$DATA" ] && [ "$DATA" != "$OGGI" ]; }; then
                echo "::error::La Parola si pubblica solo nel suo giorno (domenica o festa del calendario) entro le 7:00: l'ultimo avvio utile è alle 6:50 (regola del 18/10/2026). Ora: $(TZ=Europe/Rome date '+%A %H:%M')."
                exit 1
              fi
            fi
            echo "modo=pubblica" >> "$GITHUB_OUTPUT"
          fi

      - name: Verifica (da mezzanotte alle 4:47)
        if: steps.ora.outputs.modo == 'verifica'
        env:
          HM: ${{ steps.ora.outputs.hm }}
        run: |
          RC=0; OUT=$(DRY_RUN=1 python3 scripts/pubblica_social.py --parola 2>&1) || RC=$?
          echo "$OUT"
          if [ "$RC" -ne 0 ] || echo "$OUT" | grep -q "non ancora online"; then
            MSG="La Parola di oggi non è pronta: manca la scheda o le pagine non sono online (la routine «recupero notturno» delle 1:55 deve prepararla)."
            if [ "$HM" -ge 400 ]; then echo "::error::$MSG"; exit 1; fi
            echo "::warning::$MSG"
          else
            echo "Scheda e pagine pronte: si pubblica dalle 4:47."
          fi

      - name: Pubblica sui social
        if: steps.ora.outputs.modo == 'pubblica'
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          DRY_RUN: ${{ inputs.prova && '1' || '' }}
          DATA: ${{ inputs.data }}
          PAROLA_ENTRO: "07:00"   # lo script ricontrolla l'ora prima di ogni social
        run: python3 scripts/pubblica_social.py --parola $DATA

      - name: Salva il registro dei post social
        if: always() && steps.ora.outputs.modo == 'pubblica'
        run: |
          git diff --quiet -- .github/social/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add .github/social/
          git commit -m "Social: registro Parola [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

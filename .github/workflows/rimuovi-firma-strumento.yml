name: "🧹 Togli la firma dello strumento dai testi su GitHub"

# Il canale delle sessioni aggiunge da solo, a ogni testo pubblicato su GitHub,
# una riga di firma («Generated by [Claude Code](…)», il link alla sessione).
# CLAUDE.md vieta ogni riferimento allo strumento nei testi pubblicati, ma dalla
# sessione la riga non si toglie: anche una modifica la rimette. Questo workflow
# scrive con il GITHUB_TOKEN, che non passa da quel canale, e la toglie da
# commenti, commenti nelle revisioni, revisioni e descrizioni di PR e issue.
#
# Tocca solo i testi dell'account proprietario e solo le righe di firma in coda
# (scripts/rimuovi-firma-strumento.py). Le modifiche fatte dal GITHUB_TOKEN non
# fanno ripartire il workflow, quindi non ci sono cicli.
#
# Tre modi:
#   - evento: appena un testo con la firma viene pubblicato o modificato;
#   - ogni giorno: rete di sicurezza sugli ultimi 3 giorni (eventi persi);
#   - a mano: pulizia di un periodo intero (input «dal»), a giri di 400 testi
#     con un'ora di pausa, perché GitHub limita le scritture.
#
# Nasce il 06/10/2026, su richiesta dell'utente.

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request:
    types: [opened, edited]
  issues:
    types: [opened, edited]
  schedule:
    - cron: "17 3 * * *"   # 05:17 italiane (ora legale)
  workflow_dispatch:
    inputs:
      dal:
        description: "Pulisci i testi dal giorno (AAAA-MM-GG); vuoto = ultimi 3 giorni"
        required: false
        default: ""
      giri:
        description: "Giri al massimo (400 testi a giro, un'ora fra un giro e l'altro)"
        required: false
        default: "3"
      prova:
        description: "Solo elenco, senza modificare"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  evento:
    if: >-
      github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      contains(github.event.comment.body || github.event.review.body || github.event.pull_request.body || github.event.issue.body || '', 'claude.ai/code')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "📥 Checkout dello script"
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/rimuovi-firma-strumento.py
          sparse-checkout-cone-mode: false

      - name: "🧹 Togli la firma dal testo appena pubblicato"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/rimuovi-firma-strumento.py --evento

  giro:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: rimuovi-firma-giro
      cancel-in-progress: false
    steps:
      - name: "📥 Checkout dello script"
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/rimuovi-firma-strumento.py
          sparse-checkout-cone-mode: false

      - name: "🧹 Togli la firma dai testi del periodo"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAL: ${{ github.event.inputs.dal }}
          GIRI: ${{ github.event.inputs.giri || '1' }}
          PROVA: ${{ github.event.inputs.prova == 'true' && '--prova' || '' }}
        run: |
          set -euo pipefail
          case "$GIRI" in ''|*[!0-9]*) GIRI=1 ;; esac
          ARGS=(--tutti --giri "$GIRI" --pausa 3700)
          if [ -n "${DAL:-}" ]; then
            [[ "$DAL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "data non valida: $DAL"; exit 1; }
            ARGS+=(--dal "$DAL")
          else
            ARGS+=(--giorni 3)
          fi
          [ -n "$PROVA" ] && ARGS+=("$PROVA")
          python3 scripts/rimuovi-firma-strumento.py "${ARGS[@]}"

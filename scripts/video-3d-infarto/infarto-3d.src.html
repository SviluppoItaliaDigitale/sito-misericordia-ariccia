<script>/*CORNICE*/</script>
<script>
(function () {
  'use strict';
  const M3 = window.Motore3D, IMP = window.IMP, THREE = window.THREE;
  const dato = n => { const e = document.getElementById('dato-' + n), s = e ? e.textContent.trim() : '';
                      return !s || s.startsWith('/*DATO:') ? null : JSON.parse(s); };
  const A = dato('anatomia'), FRASI = dato('sottotitoli') || [];
  const P = A.punti;
  const { clamp, mix } = M3;
  const morb = u => 0.5 - 0.5 * Math.cos(Math.PI * clamp(u));
  const liscia = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
  const fin = (t, a, b, e = 0.4, u = 0.4) => clamp(Math.min((t - a) / e, (b - t) / u));   // finestra 0..1
  const KIT = { blu: '#003F85', giallo: '#FCEB0C', azzurro: '#009FE3', notte: '#061633' };
  const v3 = a => new THREE.Vector3(a[0], a[1], a[2]);

  /* ============================================================ tempi: tutto è legato alle 16 frasi della voce */
  // F(i, u): punto u (0..1) della frase i (1..16), dall'inizio della frase all'inizio della successiva. Senza voce
  // (anteprima) ogni frase dura 7,5 s. I ritmi (battito, globuli) vanno in tempo reale.
  const DEBUG_ZONA = new URLSearchParams(location.search).get('zona') === '1';
  const N_FRASI = 16;
  const RIGHE = []; FRASI.forEach((f, i) => { const r = f.riga || i + 1; if (!RIGHE[r - 1]) RIGHE[r - 1] = { inizio: f.inizio, fine: f.fine }; else RIGHE[r - 1].fine = f.fine; });
  const VOCE = RIGHE.length === N_FRASI;
  const S = VOCE ? RIGHE.map(r => r.inizio) : Array.from({ length: N_FRASI }, (_, i) => 1 + i * 7.5);
  const FINE_VOCE = VOCE ? RIGHE[N_FRASI - 1].fine : S[N_FRASI - 1] + 9;
  const TOTAL = FINE_VOCE + 2.8;
  S.push(FINE_VOCE + 0.6);
  const F = (i, u = 0) => (i <= 1 && u <= 0 ? 0 : S[i - 1] + u * (S[i] - S[i - 1]));
  window.TOTAL = TOTAL;
  // inizio di una parola detta dalla voce nella frase «riga» (le schede compaiono quando la parola si sente)
  function TP(riga, parola, riserva) {
    for (const f of FRASI) if ((f.riga || 0) === riga && Array.isArray(f.parole))
      for (const p of f.parole) if (p.w.toLowerCase().replace(/[^a-zàèéìòù0-9]/g, '') === parola) return p.t0;
    return F(riga, riserva);
  }
  const SCENE = [
    { nome: 'Il cuore è un muscolo', inizio: 0 }, { nome: 'Le coronarie', inizio: F(2, -0.02) },
    { nome: 'La placca', inizio: F(3, -0.05) }, { nome: 'Il coagulo', inizio: F(4) },
    { nome: 'L\'infarto', inizio: F(5) }, { nome: 'Come si riconosce', inizio: F(7) },
    { nome: 'Che cosa fare', inizio: F(10) }, { nome: 'In ospedale', inizio: F(14) },
    { nome: 'Se il cuore si ferma', inizio: F(15) }, { nome: 'Ricorda', inizio: F(16) }
  ];
  const FORMATO = new URLSearchParams(location.search).get('formato') === 'verticale' ? 'verticale' : 'orizzontale';
  const VERT = FORMATO === 'verticale';
  const L = IMP.layout(FORMATO), W = L.W, H = L.H;
  window.STAGE_W = W; window.STAGE_H = H;
  for (const id of ['fondo', 'sopra', 'cornice']) { const e = document.getElementById(id); e.width = W; e.height = H; }
  const stage = document.getElementById('stage');
  const stato = IMP.monta(stage, { ente: 'misericordia', formato: FORMATO, hud: null, nota: null });
  IMP.anteprima(stage);
  if (new URLSearchParams(location.search).get('pulito') === '1') {
    const st = document.createElement('style'); st.textContent = '#sopra,#cornice,#fonte,#imp-radice{display:none!important}'; document.head.appendChild(st);
  }

  /* ============================================================ stati nel tempo */
  const PERIODO_CUORE = 60 / 72;
  const T_FIB = F(15, 0.08);                          // il cuore si ferma e trema (richiamo all'arresto)
  function contrazione(t) {
    if (t >= T_FIB) return { v: 0, a: 0 };
    const ph = (t / PERIODO_CUORE) % 1;
    return { v: Math.exp(-Math.pow((ph - 0.3) / 0.09, 2)), a: Math.exp(-Math.pow((ph - 0.08) / 0.05, 2)) };
  }
  const fibrillazione = t => (t >= T_FIB ? 0.0011 * liscia(T_FIB, T_FIB + 0.6, t) : 0);
  // placca che cresce (frase 3), rottura e coagulo (frase 4), riapertura (frase 14)
  const T_ROTTURA = F(4, 0.06), T_CHIUSO = F(4, 0.5), T_RIAPRE = F(14, 0.12), T_RIAPERTO = F(14, 0.62);
  const placcaK = t => liscia(F(3, 0.05), F(3, 0.85), t);
  const coagulo = t => (t < T_ROTTURA ? 0 : t < T_RIAPRE ? liscia(T_ROTTURA + 0.2, T_CHIUSO, t) : 1 - liscia(T_RIAPRE, T_RIAPERTO, t));
  // zona del muscolo senza sangue: si scurisce dalla frase 5, di più con il tempo (frase 6), torna rossa in ospedale
  const zonaK = t => (t < T_RIAPRE ? 0.65 * liscia(F(5, 0.15), F(5, 0.8), t) + 0.35 * liscia(F(6, 0.05), F(6, 0.9), t) : 0.95 * (1 - liscia(T_RIAPRE + 0.4, T_RIAPERTO + 1.2, t)));
  // velocità del sangue nelle coronarie (lungo i percorsi): col battito; ferma oltre il coagulo
  const PASSO = 1 / 120, flussi = [0];
  for (let k = 1; k * PASSO <= TOTAL + 0.1; k++) { const t = (k - 0.5) * PASSO, c = contrazione(t).v;
    flussi.push(flussi[k - 1] + (t < T_FIB ? 0.012 + 0.03 * (1 - c) : 0.012 * (1 - liscia(T_FIB, T_FIB + 1, t))) * PASSO); }
  const flusso = t => { const x = clamp(t, 0, TOTAL) / PASSO, k = Math.floor(x), u = x - k; return mix(flussi[k], flussi[Math.min(k + 1, flussi.length - 1)], u); };

  /* ============================================================ fondo e scena */
  const fondo = document.getElementById('fondo'), fctx = fondo.getContext('2d');
  (function () {
    const g = fctx.createRadialGradient(W * 0.5, VERT ? 820 : 470, 60, W * 0.5, VERT ? 820 : 470, VERT ? 1500 : 1250);
    g.addColorStop(0, '#0B3D7E'); g.addColorStop(0.5, '#082B5E'); g.addColorStop(1, KIT.notte);
    fctx.fillStyle = g; fctx.fillRect(0, 0, W, H);
  })();
  const vicino = M3.creaRenderer(document.getElementById('livello-scena'), W, H, { scala: 0.8 });
  const scena = new THREE.Scene();
  const camera = M3.creaCamera(W, H, { fov: VERT ? 42 : 30, zona: L.zona });
  scena.add(new THREE.HemisphereLight(0xdfe8ff, 0x1a2a4a, 1.25));
  const luce = new THREE.DirectionalLight(0xffffff, 1.5); scena.add(luce); scena.add(luce.target);
  const luce2 = new THREE.DirectionalLight(0x9fc4ff, 0.55); scena.add(luce2); scena.add(luce2.target);

  /* ============================================================ anatomia */
  function b64(s, T) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new T(u.buffer); }
  function geometria(g) {
    const q = b64(g.pos, Uint16Array), n = b64(g.nor, Int8Array), p = new Float32Array(q.length), nn = new Float32Array(q.length);
    for (let i = 0; i < q.length; i++) { const k = i % 3; p[i] = g.lo[k] + q[i] / 65535 * g.sc[k]; nn[i] = n[i] / 127; }
    const G = new THREE.BufferGeometry();
    G.setAttribute('position', new THREE.BufferAttribute(p, 3));
    G.setAttribute('normal', new THREE.BufferAttribute(nn, 3));
    G.setIndex(new THREE.BufferAttribute(b64(g.idx, g.i32 ? Uint32Array : Uint16Array), 1));
    if (g.zona) { const z = b64(g.zona, Uint8Array), d = new Float32Array(z.length); for (let i = 0; i < z.length; i++) d[i] = z[i] / 255;
                  G.setAttribute('zona', new THREE.BufferAttribute(d, 1)); }
    G.computeBoundingSphere();
    return G;
  }
  const U = { uFib: { value: 0 }, uT: { value: 0 }, uZona: { value: 0 } };
  const CENTRO_CUORE = v3(P.cuore);
  function prepara(mat, o = {}) {
    mat.onBeforeCompile = sh => {
      Object.assign(sh.uniforms, U);
      sh.uniforms.uContr = o.contr || { value: 0 }; sh.uniforms.uCentro = { value: CENTRO_CUORE };
      sh.uniforms.uAlfa = o.alfa || { value: 1 }; sh.uniforms.uAcceso = o.acceso || { value: 0 };
      let v = sh.vertexShader, f = sh.fragmentShader;
      v = v.replace('#include <common>', `#include <common>
        uniform float uFib, uT, uContr; uniform vec3 uCentro;
        ${o.zona ? 'attribute float zona; varying float vZona;' : ''}`);
      v = v.replace('#include <begin_vertex>', `#include <begin_vertex>
        ${o.cuore ? `transformed = uCentro + (transformed - uCentro) * (1.0 - uContr);
          transformed += normal * uFib * (sin(transformed.y * 230.0 + uT * 47.0) * sin(transformed.x * 190.0 - uT * 39.0)
                                         + 0.6 * sin(transformed.z * 260.0 + uT * 61.0));` : ''}
        ${o.zona ? 'vZona = zona;' : ''}`);
      f = f.replace('#include <common>', `#include <common>
        uniform float uAlfa, uZona, uAcceso, uT;
        ${o.zona ? 'varying float vZona;' : ''}`);
      let extra = '';
      if (o.zona) extra += `
        float zk = smoothstep(0.04, 0.4, vZona) * uZona;
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.10, 0.07, 0.14), zk);
        roughnessFactor = mix(roughnessFactor, 0.9, zk);
        totalEmissiveRadiance += vec3(0.16, 0.03, 0.08) * zk * (0.5 + 0.5 * sin(uT * 3.0));`;
      if (o.olo) extra += `
        float rim = pow(1.0 - abs(dot(normalize(normal), normalize(vViewPosition))), 2.4);
        diffuseColor.a = clamp((0.035 + 0.75 * rim) * uAlfa, 0.0, 1.0);
        totalEmissiveRadiance += vec3(0.45, 0.78, 1.0) * rim * 0.9;`;
      if (o.acceso) extra += `
        totalEmissiveRadiance += vec3(1.0, 0.45, 0.35) * uAcceso;`;
      f = f.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>' + extra);
      sh.vertexShader = v; sh.fragmentShader = f;
    };
    mat.customProgramCacheKey = () => JSON.stringify(o, (k, x) => (x && x.value !== undefined ? 'u' : x));
    return mat;
  }
  const dentro = new THREE.Group(); scena.add(dentro);
  const PARTI = {};
  function parte(nome, mat, gruppo = dentro) {
    const g = A.gruppi[nome]; if (!g) { console.warn('manca', nome); return null; }
    const me = new THREE.Mesh(geometria(g), mat); gruppo.add(me); PARTI[nome] = me; return me;
  }
  const std = (colore, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: colore, roughness: 0.55, metalness: 0.0, side: THREE.DoubleSide }, o));
  const alfaPelle = { value: 1 };
  parte('pelle', prepara(std(0x6fa8e8, { transparent: true, depthWrite: false, roughness: 0.4 }), { olo: true, alfa: alfaPelle })).renderOrder = 5;
  const OSSA = 0xeee6d2;
  parte('costole', prepara(std(OSSA, { transparent: true })));
  parte('colonna', prepara(std(OSSA, { transparent: true })));
  parte('polmoni', prepara(std(0xe7a3a6, { transparent: true, opacity: 0.3, depthWrite: false })));
  parte('trachea', prepara(std(0xd9e1e8, { transparent: true })));
  parte('cervello', prepara(std(0xf0c0c4, { transparent: true })));
  const ROSSO = 0xd32f2f, BLU = 0x4f7fe8;
  parte('arterie', prepara(std(ROSSO, { transparent: true })));
  parte('vene', prepara(std(BLU, { transparent: true })));
  parte('arterie_polm', prepara(std(BLU, { transparent: true })));
  parte('vene_polm', prepara(std(ROSSO, { transparent: true })));
  // cuore: pareti con la zona a valle del blocco, coronarie che si accendono
  const contrV = { value: 0 }, contrA = { value: 0 }, accCor = { value: 0 };
  const PARETE = 0xb34a42;
  const PEZZI = {
    atrio_dx: { col: PARETE, contr: contrA }, atrio_sx: { col: PARETE, contr: contrA },
    ventricolo_dx: { col: PARETE, contr: contrV, zona: true }, ventricolo_sx: { col: PARETE, contr: contrV, zona: true },
    papillari: { col: 0x9c3a33, contr: contrV, zona: true }, valvole: { col: 0xf2e3c4, contr: contrV },
    coronarie: { col: 0xe23b30, contr: contrV, acceso: accCor }, vene_cuore: { col: 0x4f7fe8, contr: contrV }
  };
  for (const [nome, c] of Object.entries(PEZZI))
  { const me = parte(nome, prepara(std(c.col, { transparent: true, roughness: 0.5 }), { cuore: true, contr: c.contr, zona: !!c.zona, acceso: c.acceso }));
      if (me && nome === 'coronarie') me.renderOrder = 3; }   // dopo le pareti: trasparenti, non scritte nella profondità

  /* ---------- globuli nelle coronarie vere (linee centrali da anatomia_infarto.py) */
  const RAMI = (A.percorsi_cor || []).map(p => {
    const curva = new THREE.CatmullRomCurve3(p.punti.map(v3), false, 'centripetal');
    return { nome: p.nome, lung: p.lung, punti: curva.getSpacedPoints(Math.max(80, Math.round(p.lung / 0.0008))), n: Math.max(6, Math.round(p.lung / 0.0055)) };
  });
  const IVA = RAMI.find(r => r.nome === 'iva');
  const BLOCCO_U = 0.30;
  const nGlob = RAMI.reduce((x, r) => x + r.n, 0);
  const matGlob = new THREE.MeshStandardMaterial({ color: 0xff5a4e, emissive: 0xff5a4e, emissiveIntensity: 0.8, transparent: true, depthWrite: false });
  const globCor = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 12, 9), matGlob, Math.max(1, nGlob));
  globCor.frustumCulled = false; globCor.renderOrder = 7; dentro.add(globCor);
  const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _v = new THREE.Vector3();
  function aggiornaGlobCor(t, vis, raggio, occ) {
    globCor.visible = vis > 0.01; matGlob.opacity = vis; if (vis <= 0.01) return;
    const f = flusso(t), cv = contrV.value; let k = 0;
    for (const r of RAMI) {
      const m = r.punti.length - 1;
      for (let i = 0; i < r.n; i++) {
        const u0 = (i + 0.5) / r.n;
        let u = (u0 + f / r.lung) % 1, sc = raggio;
        if (r === IVA && occ > 0.02) {
          // oltre il coagulo il sangue non arriva: i globuli si fermano davanti al blocco e oltre spariscono
          const uOcc = (u0 + flusso(T_CHIUSO) / r.lung) % 1;
          u = mix(u, uOcc, liscia(0.02, 0.6, occ));
          if (u > BLOCCO_U) sc = raggio * (1 - liscia(0.3, 0.95, occ));
          else if (u > BLOCCO_U - 0.12) u = mix(u, BLOCCO_U - 0.012 - (BLOCCO_U - u) * 0.35, liscia(0.3, 1, occ));
        }
        const q = r.punti[Math.min(m, Math.round(u * m))];
        _v.copy(q).sub(CENTRO_CUORE).multiplyScalar(1 - cv).add(CENTRO_CUORE);
        _s.setScalar(Math.max(1e-6, sc)); _m.compose(_v, _q, _s); globCor.setMatrixAt(k++, _m);
      }
    }
    globCor.instanceMatrix.needsUpdate = true;
  }
  // segno del coagulo sulla coronaria vista da fuori (frasi 5-13): un nodo rosso scuro sul punto del blocco
  const B = v3(P.blocco), TB = v3(P.blocco_tan).normalize();
  const nodo = new THREE.Mesh(new THREE.SphereGeometry(0.0034, 24, 16), new THREE.MeshStandardMaterial({ color: 0x5a0d12, emissive: 0x7a1016, emissiveIntensity: 0.5, roughness: 0.8, transparent: true }));
  nodo.position.copy(B); nodo.renderOrder = 8; dentro.add(nodo);
  const aloneNodo = new THREE.Mesh(new THREE.SphereGeometry(0.0075, 24, 16), new THREE.MeshBasicMaterial({ color: 0xFCEB0C, transparent: true, opacity: 0, depthTest: false }));
  aloneNodo.position.copy(B); aloneNodo.renderOrder = 9; aloneNodo.visible = false;

  /* ---------- dentro la coronaria: tubo in scala vera sul punto del blocco, tagliato a metà per vedere dentro */
  // direzione da cui si guarda: fuori dal cuore, perpendicolare al vaso
  const O = B.clone().sub(CENTRO_CUORE); O.addScaledVector(TB, -O.dot(TB)).normalize();
  const SU = new THREE.Vector3().crossVectors(O, TB).normalize();       // terzo asse: (TB, SU, O) è una terna destra
  const R_EST = 0.0021, R_LUME = 0.00145, LUNG = 0.03;
  const macro = new THREE.Group(); dentro.add(macro);
  const TAGLIO = new THREE.Plane(O.clone().negate(), O.dot(B) + 0.00005);   // tiene la metà lontana dalla telecamera
  // asse locale del tubo: x = lungo il vaso, y = SU, z = O (verso chi guarda)
  macro.position.copy(B); macro.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(TB, SU, O));
  const SEG_X = 160, SEG_A = 72;
  // la placca: un rigonfiamento nella parete di fondo (lontana da chi guarda), centrato a x = 0
  const placcaProfilo = (x, ang) => { const ax = Math.exp(-Math.pow(x / 0.0048, 2)), lato = Math.max(0, -Math.cos(ang)); return ax * Math.pow(lato, 1.6); };
  function tubo(r0, interno) {
    const pos = new Float32Array((SEG_X + 1) * (SEG_A + 1) * 3), col = new Float32Array(pos.length), idx = [];
    for (let i = 0; i <= SEG_X; i++) for (let j = 0; j <= SEG_A; j++) {
      const k = i * (SEG_A + 1) + j; pos[k * 3] = -LUNG / 2 + LUNG * i / SEG_X;
      if (i < SEG_X && j < SEG_A) { const a = k, b = k + SEG_A + 1; idx.push(a, b, a + 1, a + 1, b, b + 1); }
    }
    const G = new THREE.BufferGeometry(); G.setAttribute('position', new THREE.BufferAttribute(pos, 3)); G.setAttribute('color', new THREE.BufferAttribute(col, 3));
    G.setIndex(idx); G.userData = { r0, interno }; return G;
  }
  const C_PARETE = new THREE.Color(0xd5574f), C_PLACCA = new THREE.Color(0xf4dc8c), C_CORE = new THREE.Color(0xd99a2b), C_LUME = new THREE.Color(0xa83a36);
  function aggiornaTubo(G, kp, rott) {
    const pos = G.attributes.position.array, col = G.attributes.color.array, { r0, interno } = G.userData, c = new THREE.Color();
    for (let i = 0; i <= SEG_X; i++) for (let j = 0; j <= SEG_A; j++) {
      const k = i * (SEG_A + 1) + j, x = pos[k * 3], ang = 2 * Math.PI * j / SEG_A, pr = placcaProfilo(x, ang) * kp;
      // la placca stringe il lume (interno) e gonfia appena la parete esterna
      const r = interno ? r0 - pr * 0.00095 : r0 + pr * 0.00022;
      pos[k * 3 + 1] = r * Math.sin(ang); pos[k * 3 + 2] = r * Math.cos(ang);
      if (interno) { c.copy(C_LUME).lerp(C_PLACCA, clamp(pr * 2.2)); if (rott > 0 && pr > 0.55) c.lerp(C_CORE, rott * 0.6); }
      else c.copy(C_PARETE);
      col[k * 3] = c.r; col[k * 3 + 1] = c.g; col[k * 3 + 2] = c.b;
    }
    G.attributes.position.needsUpdate = true; G.attributes.color.needsUpdate = true; G.computeVertexNormals();
  }
  const gEst = tubo(R_EST, false), gInt = tubo(R_LUME, true);

  if (!VOCE && FRASI.length) problemi.push({ tipo: 'voce', dettagli: 'i sottotitoli non hanno 16 frasi' });
  window.__controlli = () => IMP.controlli(stato).concat(problemi);
  Promise.all([IMP.caricaFont(), new Promise(r => { if (stemma.complete) r(); else stemma.onload = r; })]).then(() => {
    render(0);
    window.CORNICE_ESITO = window.corniceSovrapposta(telaCornice, fondo);
    window.__ready = true;
  });
})();
</script>

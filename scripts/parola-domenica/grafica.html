<!doctype html>
<!-- Carosello «La Parola della domenica», pagine 1080×1350. Le riempie rendi.js:
     copertina (opera intera + quale lettura illustra) e una pagina per versetto. -->
<html lang="it"><head><meta charset="utf-8">
<style>
@font-face{font-family:Playfair;src:url(../../static/fonts/playfair-600-latin.woff2);font-weight:600}
@font-face{font-family:Jost;src:url(../../static/fonts/jost-latin.woff2);font-weight:300 700}
:root{--navy:#1b223f;--ciano:#00a5dc;--giallo:#f2e433;--chiaro:#dfe6f5}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;background:var(--navy);color:#fff;font-family:Jost;overflow:hidden;position:relative}
.pagina{position:absolute;inset:0 0 106px 0;padding:116px 96px 0}
[hidden]{display:none!important}
/* testata comune */
.testa{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--giallo);padding-bottom:14px}
.rubrica{font-family:Playfair;font-weight:600;font-size:36px;color:var(--giallo)}
.giorno{font-size:21px;text-align:right;line-height:1.25;color:var(--chiaro)}
.numero{position:absolute;right:120px;bottom:44px;font-size:22px;color:var(--chiaro);letter-spacing:.04em}
/* copertina */
#copertina{padding-top:128px}
#copertina .titolo{font-family:Playfair;font-weight:600;font-size:68px;line-height:1.05;color:var(--giallo)}
#copertina .sotto{margin-top:12px;font-size:28px;color:var(--chiaro)}
.cornice{margin:18px auto 0;border:6px solid var(--ciano);border-radius:18px;overflow:hidden;background:#f4efe4;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.cornice img{display:block;width:100%;height:100%;object-fit:contain}
.illustra{margin-top:20px;font-size:25px;line-height:1.35}
.illustra b{color:var(--ciano);font-weight:600}
.credito{margin-top:8px;font-size:19px;color:#b9c3dc;line-height:1.35}
.credito i{font-style:italic}
.scorri{position:absolute;left:120px;bottom:40px;font-size:25px;font-weight:600;color:var(--giallo)}
/* pagina del versetto */
.lettura{margin-top:52px;margin-right:150px;border-left:6px solid var(--giallo);padding-left:24px}
.lettura .nome{font-size:40px;font-weight:600;color:var(--ciano);line-height:1.1}
.lettura .libro{margin-top:6px;font-size:28px;color:var(--chiaro)}
.parola{position:absolute;left:104px;right:104px;top:400px;bottom:120px;display:flex;flex-direction:column;justify-content:center}
.virgolette{font-family:Playfair;font-size:150px;line-height:.62;color:var(--ciano);height:66px;margin-bottom:22px;overflow:hidden}
.versetto{font-family:Playfair;font-weight:600;font-size:72px;line-height:1.18}
.versetto em{font-style:normal;color:var(--giallo)}
.rif{margin-top:26px;font-size:32px;font-weight:600;color:var(--ciano)}
/* ornamenti rinascimentali: doppia cornice con angoli a voluta, filetto con la croce dello stemma */
.ornato{position:absolute;left:18px;right:18px;top:18px;bottom:124px;border:2px solid var(--giallo);pointer-events:none}
.ornato::after{content:"";position:absolute;inset:7px;border:1px solid rgba(242,228,51,.55)}
.angolo{position:absolute;width:86px;height:86px}
.angolo.a1{left:-2px;top:-2px}.angolo.a2{right:-2px;top:-2px;transform:scaleX(-1)}
.angolo.a3{left:-2px;bottom:-2px;transform:scaleY(-1)}.angolo.a4{right:-2px;bottom:-2px;transform:scale(-1,-1)}
.filetto{display:block;width:560px;height:40px;margin:0 auto}
.stemma{position:absolute;right:96px;top:236px;width:118px;height:118px}
.sigillo{position:absolute;right:104px;top:104px;width:140px;height:140px}
/* piede bianco del brand */
.piede{position:absolute;left:0;right:0;bottom:0;height:106px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 56px}
.marchio{display:flex;align-items:center;gap:18px;color:var(--navy);font-weight:600;font-size:25px;line-height:1.15}
.marchio img{height:66px}
.sito{color:#0a7fb0;font-weight:600;font-size:25px}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- angolo: rosetta a quattro petali e due volute con foglioline, come nei fregi a stampa del Cinquecento -->
    <symbol id="angolo" viewBox="0 0 86 86">
      <g fill="none" stroke="#f2e433" stroke-width="2.2" stroke-linecap="round">
        <path d="M20 46 C20 66 38 70 44 60 C49 52 41 45 35 50 C31 54 35 59 39 57"/>
        <path d="M46 20 C66 20 70 38 60 44 C52 49 45 41 50 35 C54 31 59 35 57 39"/>
        <path d="M20 46 L20 76 M46 20 L76 20"/>
      </g>
      <g fill="#f2e433">
        <circle cx="20" cy="20" r="5"/>
        <ellipse cx="20" cy="9" rx="3.4" ry="6"/><ellipse cx="20" cy="31" rx="3.4" ry="6"/>
        <ellipse cx="9" cy="20" rx="6" ry="3.4"/><ellipse cx="31" cy="20" rx="6" ry="3.4"/>
        <path d="M27 58 q-7 -4 -6 -12 q6 4 6 12z"/><path d="M58 27 q-4 -7 -12 -6 q4 6 12 6z"/>
      </g>
      <circle cx="20" cy="20" r="2" fill="#1b223f"/>
    </symbol>
    <!-- filetto: due linee con losanghe e, al centro, la croce dello stemma FM in un tondo -->
    <symbol id="filetto" viewBox="0 0 560 40">
      <g stroke="#f2e433" stroke-width="2" fill="none">
        <path d="M20 20 H232 M328 20 H540"/>
        <circle cx="280" cy="20" r="17"/>
      </g>
      <g fill="#f2e433">
        <path d="M232 20 l9 -6 l9 6 l-9 6z"/><path d="M310 20 l9 -6 l9 6 l-9 6z"/>
        <circle cx="14" cy="20" r="3"/><circle cx="546" cy="20" r="3"/>
      </g>
      <path d="M277 8 h6 v8 h8 v6 h-8 v12 h-6 v-12 h-8 v-6 h8z" fill="#e2231a"/>
    </symbol>
  </defs>
</svg>
<div class="ornato">
  <svg class="angolo a1"><use href="#angolo"/></svg><svg class="angolo a2"><use href="#angolo"/></svg>
  <svg class="angolo a3"><use href="#angolo"/></svg><svg class="angolo a4"><use href="#angolo"/></svg>
</div>
<section class="pagina" id="copertina" hidden>
  <img class="sigillo" src="../../static/img/loghi/mise-fregio.png" alt="">
  <div class="titolo">La Parola<br>della domenica</div>
  <div class="sotto" id="c-giorno"></div>
  <svg class="filetto" style="margin-top:12px;width:760px;height:54px"><use href="#filetto"/></svg>
  <div class="cornice" id="c-cornice"><img id="c-img" alt=""></div>
  <div class="illustra" id="c-illustra"></div>
  <div class="credito" id="c-credito"></div>
  <div class="scorri" id="c-scorri"></div>
  <div class="numero" id="c-numero"></div>
</section>
<section class="pagina" id="pagina" hidden>
  <img class="stemma" src="../../static/img/loghi/mise-fregio.png" alt="">
  <div class="testa"><div class="rubrica">La Parola della domenica</div><div class="giorno" id="p-giorno"></div></div>
  <div class="lettura"><div class="nome" id="p-nome"></div><div class="libro" id="p-libro"></div></div>
  <div class="parola">
    <svg class="filetto" style="margin:0 auto 26px;width:760px;height:54px;align-self:center"><use href="#filetto"/></svg>
    <div class="virgolette">“</div>
    <div class="versetto" id="p-versetto"></div>
    <div class="rif" id="p-rif"></div>
  </div>
  <div class="numero" id="p-numero"></div>
</section>
<div class="piede">
  <div class="marchio"><img src="../../static/img/loghi/mise-triangolo.png" alt="">Misericordia<br>di Ariccia</div>
  <div class="sito">www.misericordia-ariccia.it</div>
</div>
<script>
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const data = s => { const [a, m, g] = s.data.split('-').map(Number); return `${g} ${MESI[m - 1]} ${a}`; };
const $ = id => document.getElementById(id);
const stringi = (box, el, minimo) => {  // il testo si rimpicciolisce finché sta nel suo spazio
  let px = parseFloat(getComputedStyle(el).fontSize);
  while (box.scrollHeight > box.clientHeight + 1 && px > minimo) { px -= 2; el.style.fontSize = px + 'px'; }
  return { corpo: px, trabocca: box.scrollHeight > box.clientHeight + 1 };
};

// Nessuna scritta deve toccare la grafica: rettangoli delle righe di testo contro ornamenti, stemma, filetti e opera.
const sovrapposizioni = () => {
  const testi = [], grafica = [];
  const vis = el => el.offsetParent !== null || getComputedStyle(el).position === 'fixed';
  document.querySelectorAll('.titolo,.sotto,.illustra,.credito,.scorri,.numero,.rubrica,.giorno,.lettura,.versetto,.rif,.sito,.marchio').forEach(el => {
    if (!vis(el)) return;
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    while (w.nextNode()) { if (!w.currentNode.textContent.trim()) continue;
      const r = document.createRange(); r.selectNodeContents(w.currentNode);
      for (const q of r.getClientRects()) testi.push({ q, nome: w.currentNode.textContent.trim().slice(0, 30) }); }
  });
  document.querySelectorAll('.angolo,.stemma,.sigillo,.filetto,.cornice,.virgolette').forEach(el => {
    if (vis(el) || el.classList.contains('angolo')) grafica.push({ q: el.getBoundingClientRect(), nome: el.className.baseVal || el.className });
  });
  const tocca = (a, b, m = 4) => a.left < b.right + m && b.left < a.right + m && a.top < b.bottom + m && b.top < a.bottom + m;
  const trovate = [];
  for (const t of testi) for (const g of grafica) if (tocca(t.q, g.q)) trovate.push(`«${t.nome}» tocca ${g.nome}`);
  return [...new Set(trovate)];
};

// Copertina: l'opera INTERA (mai ritagliata), la cornice prende le sue proporzioni.
window.copertina = async (s, immagine, n) => {
  $('copertina').hidden = false;
  $('c-giorno').textContent = `${s.giorno_liturgico} · ${data(s)}`;
  const img = $('c-img'); img.src = immagine; await img.decode();
  const o = s.opera, maxL = 888, maxA = 520, r = img.naturalWidth / img.naturalHeight;
  const l = Math.min(maxL, maxA * r);
  $('c-cornice').style.width = l + 'px'; $('c-cornice').style.height = (l / r) + 'px';
  $('c-illustra').innerHTML = `<b>${esc(o.illustra)}</b> · ${esc(o.scena)}`;
  $('c-credito').innerHTML = `${esc(o.autore)}, <i>${esc(o.titolo)}</i>${o.anno ? ', ' + esc(o.anno) : ''}${o.luogo ? ' · ' + esc(o.luogo) : ''} · pubblico dominio`;
  $('c-scorri').textContent = `Scorri: ${s.pagine.length === 1 ? 'il versetto' : s.pagine.length + ' versetti'} della domenica →`;
  $('c-numero').textContent = `1 / ${n}`;
  await document.fonts.ready;
  const p = $('copertina');
  return { corpo: 0, trabocca: p.scrollHeight > p.clientHeight + 1, sovrapposizioni: sovrapposizioni() };
};

// Pagina del versetto: si capisce subito da quale lettura viene.
window.versetto = async (s, i, n, primo) => {
  $('pagina').hidden = false;
  const v = s.pagine[i];
  $('p-giorno').innerHTML = `${data(s)}<br>${esc(s.giorno_liturgico)}`;
  $('p-nome').textContent = v.lettura;
  $('p-libro').textContent = v.fonte_lettura;
  let t = esc(v.versetto);
  if (v.evidenza) t = t.replace(esc(v.evidenza), `<em>${esc(v.evidenza)}</em>`);
  $('p-versetto').innerHTML = t;
  $('p-rif').textContent = v.riferimento;
  $('p-numero').textContent = `${primo + i} / ${n}`;
  await document.fonts.ready;
  const esito = stringi(document.querySelector('.parola'), $('p-versetto'), 40);
  return { ...esito, sovrapposizioni: sovrapposizioni() };
};
</script>
</body></html>

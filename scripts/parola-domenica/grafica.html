<!doctype html>
<!-- Grafica «La Parola della domenica» 1080×1350. La riempie rendi.js con i dati della scheda. -->
<html lang="it"><head><meta charset="utf-8">
<style>
@font-face{font-family:Playfair;src:url(../../static/fonts/playfair-600-latin.woff2);font-weight:600}
@font-face{font-family:Jost;src:url(../../static/fonts/jost-latin.woff2);font-weight:300 700}
:root{--navy:#1b223f;--ciano:#00a5dc;--giallo:#f2e433}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;background:var(--navy);color:#fff;font-family:Jost;overflow:hidden;position:relative}
/* testata: nome della rubrica e giorno liturgico */
.testa{position:absolute;left:56px;right:56px;top:40px;display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:2px solid var(--giallo);padding-bottom:14px}
.rubrica{font-family:Playfair;font-weight:600;font-size:40px;color:var(--giallo)}
.giorno{font-size:23px;font-weight:400;text-align:right;line-height:1.25;color:#dfe6f5}
/* opera d'arte nella cornice ciano, come le foto delle grafiche brand */
.opera{position:absolute;left:56px;right:56px;top:156px;height:650px;border:6px solid var(--ciano);border-radius:22px;overflow:hidden;
  box-shadow:0 14px 40px rgba(0,0,0,.35)}
.opera img{width:100%;height:100%;object-fit:cover}
.credito{position:absolute;left:0;right:0;bottom:0;padding:44px 24px 14px;font-size:19px;color:#f3f3f3;
  background:linear-gradient(transparent,rgba(10,14,32,.88))}
.credito i{font-style:italic}
/* versetto */
.parola{position:absolute;left:72px;right:72px;top:830px;bottom:130px;display:flex;flex-direction:column;justify-content:center}
.virgolette{font-family:Playfair;font-size:120px;line-height:.6;color:var(--ciano);height:44px}
.versetto{font-family:Playfair;font-weight:600;font-size:54px;line-height:1.22}
.versetto em{font-style:normal;color:var(--giallo)}
.rif{margin-top:20px;font-size:30px;font-weight:600;color:var(--ciano)}
.rif span{font-weight:400;color:#dfe6f5}
/* senza opera: solo tipografica, il versetto prende tutto lo spazio */
body.solo-testo .opera{display:none}
body.solo-testo .parola{top:150px}
body.solo-testo .versetto{font-size:84px}
body.solo-testo .virgolette{font-size:200px;height:80px}
/* piede bianco del brand */
.piede{position:absolute;left:0;right:0;bottom:0;height:106px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 56px}
.marchio{display:flex;align-items:center;gap:18px;color:var(--navy);font-weight:600;font-size:25px;line-height:1.15}
.marchio img{height:66px}
.sito{color:#0a7fb0;font-weight:600;font-size:25px}
</style></head>
<body>
<div class="testa"><div class="rubrica">La Parola della domenica</div><div class="giorno" id="giorno"></div></div>
<div class="opera"><img id="img" alt=""><div class="credito" id="credito"></div></div>
<div class="parola">
  <div class="virgolette">“</div>
  <div class="versetto" id="versetto"></div>
  <div class="rif" id="rif"></div>
</div>
<div class="piede">
  <div class="marchio"><img src="../../static/img/loghi/mise-triangolo.png" alt="">Misericordia<br>di Ariccia</div>
  <div class="sito">www.misericordia-ariccia.it</div>
</div>
<script>
window.riempi = async (s, immagine) => {
  const esc = t => t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const mesi = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  const [a, m, g] = s.data.split('-').map(Number);
  document.getElementById('giorno').innerHTML = `${g} ${mesi[m - 1]} ${a}<br>${esc(s.giorno_liturgico)}`;
  let v = esc(s.versetto);
  if (s.evidenza) v = v.replace(esc(s.evidenza), `<em>${esc(s.evidenza)}</em>`);
  document.getElementById('versetto').innerHTML = v;
  document.getElementById('rif').innerHTML = `${esc(s.riferimento)} <span>· ${esc(s.lettura)}</span>`;
  if (s.opera && immagine) {
    const img = document.getElementById('img');
    img.src = immagine;
    img.style.objectPosition = s.opera.inquadratura || 'center';
    if (s.opera.zoom) { img.style.transform = `scale(${s.opera.zoom})`; img.style.transformOrigin = s.opera.inquadratura || 'center'; }
    const o = s.opera;
    document.getElementById('credito').innerHTML = `${esc(o.autore)}, <i>${esc(o.titolo)}</i>${o.anno ? ' (' + esc(o.anno) + ')' : ''}${o.luogo ? ', ' + esc(o.luogo) : ''}`;
    await img.decode();
  } else {
    document.body.classList.add('solo-testo');
  }
  // il versetto deve stare nel suo spazio: si rimpicciolisce finché non trabocca
  const box = document.querySelector('.parola'), el = document.getElementById('versetto');
  let px = parseFloat(getComputedStyle(el).fontSize);
  while (box.scrollHeight > box.clientHeight + 1 && px > 30) { px -= 2; el.style.fontSize = px + 'px'; }
  await document.fonts.ready;
  return { corpo: px, trabocca: box.scrollHeight > box.clientHeight + 1 };
};
</script>
</body></html>

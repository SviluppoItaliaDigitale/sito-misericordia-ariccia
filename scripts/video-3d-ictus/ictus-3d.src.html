<script>/*CORNICE*/</script>
<script>
(function () {
  'use strict';
  const M3 = window.Motore3D, IMP = window.IMP, THREE = window.THREE;
  const dato = n => { const e = document.getElementById('dato-' + n), s = e ? e.textContent.trim() : '';
                      return !s || s.startsWith('/*DATO:') ? null : JSON.parse(s); };
  const A = dato('anatomia'), FRASI = dato('sottotitoli') || [];
  const P = A.punti;
  const { clamp, mix, prog } = M3;
  const morb = u => 0.5 - 0.5 * Math.cos(Math.PI * clamp(u));
  const liscia = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
  const fin = (t, a, b, e = 0.4, u = 0.4) => clamp(Math.min((t - a) / e, (b - t) / u));   // finestra 0..1
  const KIT = { blu: '#003F85', giallo: '#FCEB0C', azzurro: '#009FE3', notte: '#061633' };

  /* ============================================================ tempi: tutto è legato alle frasi della voce */
  // 16 frasi; senza i sottotitoli (anteprima) si usano durate stimate.
  const STIMA = [6.5, 6.0, 8.5, 10.5, 7.5, 2.4, 5.0, 5.0, 6.0, 4.0, 8.0, 4.0, 13.0, 5.0, 3.0, 8.5];
  const PAUSA = [0, 0.9, 1.0, 1.0, 1.0, 1.4, 0.8, 1.6, 1.6, 1.3, 1.2, 1.0, 1.0, 1.2, 1.3, 0.7];
  const RIGHE = [];
  FRASI.forEach((f, i) => { const r = f.riga || i + 1; if (!RIGHE[r - 1]) RIGHE[r - 1] = { inizio: f.inizio, fine: f.fine, parole: (f.parole || []).slice() };
                            else { RIGHE[r - 1].fine = f.fine; RIGHE[r - 1].parole.push(...(f.parole || [])); } });
  if (RIGHE.length !== 16) { RIGHE.length = 0; let s = 1.0; for (let i = 0; i < 16; i++) { s += PAUSA[i]; RIGHE.push({ inizio: s, fine: s + STIMA[i], parole: [] }); s += STIMA[i]; } }
  const T = i => RIGHE[i - 1].inizio, F = i => RIGHE[i - 1].fine;
  // momento di una parola della frase i (prima che combacia), altrimenti una frazione stimata della frase
  const W_ = (i, re, frazione) => { const p = RIGHE[i - 1].parole.find(x => re.test(x.w.toLowerCase()));
                                     return p ? p.t0 : T(i) + (F(i) - T(i)) * frazione; };
  const TOTAL = F(16) + 2.8;
  window.TOTAL = TOTAL;
  const tm = {
    arterieTesta: W_(2, /collo/, 0.45), rami: W_(2, /rami/, 0.8), coagulo: W_(3, /coagulo/, 0.12), rompe: W_(3, /rompe/, 0.42),
    senza: W_(3, /^senza/, 0.75), ictus: W_(3, /ictus/, 0.95), parola: W_(4, /parola/, 0.4), braccio: W_(4, /^braccio,?$/, 0.75),
    opposto: W_(5, /opposto/, 0.35), sinistra: W_(5, /sinistra/, 0.6), destro: W_(5, /destro/, 0.9),
    sorridere: W_(7, /sorridere/, 0.3), bocca: W_(7, /bocca/, 0.75), alzarle: W_(8, /alzarle/, 0.35), scende: W_(8, /scende/, 0.7),
    ripetere: W_(9, /ripetere/, 0.3), male: W_(9, /male/, 0.6), coagEmo: W_(13, /coagulo/, 0.45), tac: W_(13, /tac/, 0.65),
    medicine: W_(13, /medicine/, 0.8), salva: W_(14, /salva/, 0.45), tempo: W_(14, /tempo/, 0.7)
  };
  const SCENE = [
    { nome: 'Il cervello e il sangue', inizio: 0 }, { nome: 'Che cos\'è l\'ictus', inizio: T(3) - 0.3 },
    { nome: 'Il cervello comanda il corpo', inizio: T(4) - 0.3 }, { nome: 'Riconoscilo: viso, braccia, parola', inizio: T(6) - 0.3 },
    { nome: 'Chiama subito il 112', inizio: T(10) - 0.3 }, { nome: 'Segna l\'ora', inizio: T(11) - 0.3 },
    { nome: 'Che cosa non fare', inizio: T(12) - 0.3 }, { nome: 'Il tempo è cervello', inizio: T(14) - 0.3 },
    { nome: 'In ogni emergenza', inizio: T(15) - 0.3 }
  ];
  const FORMATO = new URLSearchParams(location.search).get('formato') === 'verticale' ? 'verticale' : 'orizzontale';
  const VERT = FORMATO === 'verticale';
  const L = IMP.layout(FORMATO), W = L.W, H = L.H;
  window.STAGE_W = W; window.STAGE_H = H;
  for (const id of ['fondo', 'sopra', 'cornice']) { const e = document.getElementById(id); e.width = W; e.height = H; }
  const stage = document.getElementById('stage');
  const stato = IMP.monta(stage, { ente: 'misericordia', formato: FORMATO, hud: null, nota: null });
  IMP.anteprima(stage);
  if (new URLSearchParams(location.search).get('pulito') === '1') {
    const st = document.createElement('style'); st.textContent = '#sopra,#cornice,#fonte,#imp-radice{display:none!important}'; document.head.appendChild(st);
  }

  // Battito e sangue: il cuore batte sempre (70 al minuto); il sangue scorre con il battito.
  const PERIODO_CUORE = 60 / 70;
  function contrazione(t) { const ph = (t / PERIODO_CUORE) % 1; return { v: Math.exp(-Math.pow((ph - 0.3) / 0.09, 2)), a: Math.exp(-Math.pow((ph - 0.08) / 0.05, 2)) }; }
  const PASSO = 1 / 120, flussi = [0];
  for (let k = 1; k * PASSO <= TOTAL + 0.1; k++) flussi.push(flussi[k - 1] + (0.10 + 0.55 * contrazione((k - 0.5) * PASSO).v) * PASSO);
  const flusso = t => { const x = clamp(t, 0, TOTAL) / PASSO, k = Math.floor(x), u = x - k; return mix(flussi[k], flussi[Math.min(k + 1, flussi.length - 1)], u); };
  // il coagulo: si forma con «coagulo» (frase 3), resta fino a «salva» (frase 14), poi si scioglie
  const blocco = t => liscia(tm.coagulo, tm.coagulo + 1.2, t) * (1 - liscia(tm.salva - 0.4, tm.salva + 1.6, t));
  const scurito = t => liscia(tm.senza + 0.7, tm.senza + 1.9, t) * (1 - liscia(tm.salva + 0.4, tm.salva + 3.0, t));

  /* ============================================================ fondo, livello 3D */
  const fondo = document.getElementById('fondo'), fctx = fondo.getContext('2d');
  (function () {
    const g = fctx.createRadialGradient(W * 0.5, VERT ? 820 : 470, 60, W * 0.5, VERT ? 820 : 470, VERT ? 1500 : 1250);
    g.addColorStop(0, '#0B3D7E'); g.addColorStop(0.5, '#082B5E'); g.addColorStop(1, KIT.notte);
    fctx.fillStyle = g; fctx.fillRect(0, 0, W, H);
  })();
  const vicino = M3.creaRenderer(document.getElementById('livello-scena'), W, H, { scala: 0.8 });
  const scena = new THREE.Scene();
  const camera = M3.creaCamera(W, H, { fov: VERT ? 42 : 30, zona: L.zona });
  scena.add(new THREE.HemisphereLight(0xdfe8ff, 0x1a2a4a, 1.25));
  const luce = new THREE.DirectionalLight(0xffffff, 1.5); scena.add(luce); scena.add(luce.target);
  const luce2 = new THREE.DirectionalLight(0x9fc4ff, 0.55); scena.add(luce2); scena.add(luce2.target);

  /* ============================================================ anatomia */
  function b64(s, T_) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new T_(u.buffer); }
  function geometria(g) {
    const q = b64(g.pos, Uint16Array), n = b64(g.nor, Int8Array), p = new Float32Array(q.length), nn = new Float32Array(q.length);
    for (let i = 0; i < q.length; i++) { const k = i % 3; p[i] = g.lo[k] + q[i] / 65535 * g.sc[k]; nn[i] = n[i] / 127; }
    const G = new THREE.BufferGeometry();
    G.setAttribute('position', new THREE.BufferAttribute(p, 3));
    G.setAttribute('normal', new THREE.BufferAttribute(nn, 3));
    G.setIndex(new THREE.BufferAttribute(b64(g.idx, g.i32 ? Uint32Array : Uint16Array), 1));
    if (g.flusso) { const f = b64(g.flusso, Uint16Array), d = new Float32Array(f.length);
                    for (let i = 0; i < f.length; i++) d[i] = f[i] / 65535 * g.flussoMax; G.setAttribute('flusso', new THREE.BufferAttribute(d, 1)); }
    for (const k of ['parola', 'braccio', 'zona']) if (g[k]) { const z = b64(g[k], Uint8Array), d = new Float32Array(z.length);
      for (let i = 0; i < z.length; i++) d[i] = z[i] / 255; G.setAttribute(k, new THREE.BufferAttribute(d, 1)); }
    G.computeBoundingSphere();
    return G;
  }
  const C = P.coagulo;
  const U = { uT: { value: 0 }, uFA: { value: 0 }, uVis: { value: 1 }, uBlocco: { value: 0 }, uScuro: { value: 0 }, uParola: { value: 0 },
              uBraccio: { value: 0 }, uLatoSx: { value: 0 }, uLatoDx: { value: 0 }, uScan: { value: -1 } };
  function prepara(mat, o = {}) {
    mat.onBeforeCompile = sh => {
      Object.assign(sh.uniforms, U);
      sh.uniforms.uContr = o.contr || { value: 0 }; sh.uniforms.uCentro = { value: new THREE.Vector3(P.cuore[0], P.cuore[1], P.cuore[2]) };
      sh.uniforms.uAlfa = o.alfa || { value: 1 };
      let v = sh.vertexShader, f = sh.fragmentShader;
      v = v.replace('#include <common>', `#include <common>
        uniform float uT; uniform float uContr; uniform vec3 uCentro; varying vec3 vPosC;
        ${o.flusso ? 'attribute float flusso; varying float vFlusso;' : ''}
        ${o.zone ? 'attribute float parola; attribute float braccio; attribute float zona; varying vec3 vZone;' : ''}`);
      v = v.replace('#include <begin_vertex>', `#include <begin_vertex>
        ${o.cuore ? 'transformed = uCentro + (transformed - uCentro) * (1.0 - uContr);' : ''}
        vPosC = transformed;
        ${o.flusso ? 'vFlusso = flusso;' : ''}
        ${o.zone ? 'vZone = vec3(parola, braccio, zona);' : ''}`);
      f = f.replace('#include <common>', `#include <common>
        uniform float uFA, uVis, uAlfa, uBlocco, uScuro, uParola, uBraccio, uLatoSx, uLatoDx, uScan; varying vec3 vPosC;
        ${o.flusso ? 'varying float vFlusso;' : ''}
        ${o.zone ? 'varying vec3 vZone;' : ''}`);
      let extra = '';
      if (o.flusso) extra += `
        float fr = fract((vFlusso - uFA) / 0.11);
        float banda = smoothstep(0.0, 0.18, fr) * smoothstep(0.62, 0.18, fr);
        ${o.cervello ? `// oltre il coagulo, nell'arteria cerebrale media sinistra, il sangue non passa
        float valle = step(${(C[0] + 0.0015).toFixed(4)}, vPosC.x) * step(1.525, vPosC.y) * step(0.088, vPosC.z) * step(vPosC.y, 1.585);
        banda *= 1.0 - uBlocco * valle;
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.38, 0.12, 0.14), uBlocco * valle * 0.7);` : ''}
        totalEmissiveRadiance += vec3(${o.bagliore}) * banda * uVis * 0.9;`;
      if (o.cervelloCol) extra += `
        totalEmissiveRadiance += vec3(0.30, 0.10, 0.12) * 0.45;`;
      if (o.zone) extra += `
        // territorio senza sangue (si scurisce), zone della parola e del braccio, lato sinistro acceso
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.24, 0.24, 0.31), uScuro * vZone.z * 0.92);
        totalEmissiveRadiance *= 1.0 - 0.8 * uScuro * vZone.z;
        totalEmissiveRadiance += vec3(0.99, 0.92, 0.05) * vZone.x * uParola * 0.85;
        totalEmissiveRadiance += vec3(0.0, 0.62, 0.89) * vZone.y * uBraccio * 1.1;
        totalEmissiveRadiance += vec3(0.0, 0.50, 0.80) * uLatoSx * 0.45;`;
      if (o.olo) extra += `
        float rim = pow(1.0 - abs(dot(normalize(normal), normalize(vViewPosition))), 2.4);
        diffuseColor.a = clamp((0.035 + 0.75 * rim) * uAlfa, 0.0, 1.0);
        float dx = smoothstep(-0.005, -0.03, vPosC.x) * uLatoDx;
        totalEmissiveRadiance += mix(vec3(0.45, 0.78, 1.0), vec3(0.99, 0.92, 0.05), dx) * rim * (0.9 + 0.4 * dx);
        diffuseColor.a = clamp(diffuseColor.a + dx * 0.10, 0.0, 1.0);`;
      if (o.scan) extra += `
        float sc = exp(-pow((vPosC.y - uScan) / 0.004, 2.0)) * step(-0.5, uScan);
        totalEmissiveRadiance += vec3(0.6, 0.9, 1.0) * sc * 1.4;`;
      f = f.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>' + extra);
      sh.vertexShader = v; sh.fragmentShader = f;
    };
    mat.customProgramCacheKey = () => JSON.stringify(o, (k, x) => (x && x.value !== undefined ? 'u' : x));
    return mat;
  }
  const dentro = new THREE.Group(); scena.add(dentro);
  const PARTI = {}, MATERIALI = [];
  function parte(nome, mat, gruppo = dentro) {
    const g = A.gruppi[nome]; if (!g) { console.warn('manca', nome); return null; }
    const me = new THREE.Mesh(geometria(g), mat); gruppo.add(me); PARTI[nome] = me; MATERIALI.push(mat); return me;
  }
  const std = (colore, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: colore, roughness: 0.55, metalness: 0.0, side: THREE.DoubleSide }, o));
  const alfaPelle = { value: 1 };
  parte('pelle', prepara(std(0x6fa8e8, { transparent: true, depthWrite: false, roughness: 0.4 }), { olo: true, alfa: alfaPelle })).renderOrder = 5;
  parte('colonna', prepara(std(0xeee6d2, { transparent: true, opacity: 0.35, depthWrite: false })));
  const ROSSO = 0xd32f2f, BLU = 0x4f7fe8;
  parte('arterie', prepara(std(ROSSO, { transparent: true }), { flusso: true, bagliore: '1.0, 0.62, 0.55' }));
  parte('vene', prepara(std(BLU, { transparent: true, opacity: 0.3, depthWrite: false })));
  parte('arterie_cervello', prepara(std(ROSSO, { transparent: true }), { flusso: true, cervello: true, bagliore: '1.0, 0.62, 0.55' }));
  const BRAIN = 0xf0c0c4;
  parte('emisfero_sx', prepara(std(BRAIN, { transparent: true }), { zone: true, cervelloCol: true, scan: true })).renderOrder = 4;
  parte('emisfero_dx', prepara(std(BRAIN, { transparent: true }), { cervelloCol: true, scan: true })).renderOrder = 4;
  parte('encefalo_resto', prepara(std(0xe7b2b8, { transparent: true }), { cervelloCol: true, scan: true })).renderOrder = 4;
  const cuore = new THREE.Group(); dentro.add(cuore);
  const contrV = { value: 0 }, contrA = { value: 0 };
  for (const [nome, col, contr] of [['atrio_dx', 0xb34a42, contrA], ['atrio_sx', 0xb34a42, contrA], ['ventricolo_dx', 0xb34a42, contrV], ['ventricolo_sx', 0xb34a42, contrV],
                                    ['papillari', 0x9c3a33, contrV], ['valvole', 0xf2e3c4, contrV], ['coronarie', 0xe23b30, contrV], ['vene_cuore', 0x4f7fe8, contrV]])
    parte(nome, prepara(std(col, { transparent: true, roughness: 0.5 }), { cuore: true, contr }), cuore);

  // globuli: dal cuore su per il collo fino alla testa (percorsi del video sulla rianimazione) e nelle arterie del
  // cervello (carotidi interne → arterie cerebrali anteriori e medie; basilare → cerebrali posteriori)
  const v3 = a => new THREE.Vector3(a[0], a[1], a[2]);
  const sferaG = new THREE.SphereGeometry(1, 12, 9);
  const GLOBULI = (A.percorsi || []).map(p => {
    const curva = new THREE.CatmullRomCurve3(p.punti.map(v3), false, 'centripetal');
    const passo = p.tipo === 'arterie_cervello' ? 0.006 : 0.028;
    const punti = curva.getSpacedPoints(Math.max(60, Math.round(p.lung / 0.001)));
    const g = { p, cervello: p.tipo === 'arterie_cervello', n: Math.max(5, Math.round(p.lung / passo)), punti, lung: p.lung, uC: 2 };
    if (p.nome === 'media_sx') {                     // dove sta il coagulo lungo il percorso
      let bd = 1e9; punti.forEach((q, i) => { const d = q.distanceToSquared(v3(C)); if (d < bd) { bd = d; g.uC = i / (punti.length - 1); g.kC = i; } });
    }
    return g;
  });
  const MEDIA = GLOBULI.find(g => g.p.nome === 'media_sx');
  const PUNTO_COAG = MEDIA ? MEDIA.punti[MEDIA.kC].clone() : v3(C);
  const DIR_COAG = MEDIA ? MEDIA.punti[Math.min(MEDIA.punti.length - 1, MEDIA.kC + 4)].clone().sub(MEDIA.punti[Math.max(0, MEDIA.kC - 4)]).normalize() : new THREE.Vector3(1, 0, 0);
  const matGlob = col => { const m = prepara(new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.75, transparent: true, depthWrite: false })); MATERIALI.push(m); return m; };
  const nCorpo = GLOBULI.filter(g => !g.cervello).reduce((x, g) => x + g.n, 0), nCerv = GLOBULI.filter(g => g.cervello).reduce((x, g) => x + g.n, 0);
  const globCorpo = new THREE.InstancedMesh(sferaG, matGlob(0xff5a4e), Math.max(1, nCorpo)), globCerv = new THREE.InstancedMesh(sferaG, matGlob(0xff5a4e), Math.max(1, nCerv));
  for (const im of [globCorpo, globCerv]) { im.frustumCulled = false; im.renderOrder = 7; dentro.add(im); }
  const _gm = new THREE.Matrix4(), _gq = new THREE.Quaternion(), _gs = new THREE.Vector3();
  let flussoFermo = null;                            // flusso al momento del blocco: i globuli prima del coagulo si fermano lì
  function aggiornaGlobuli(t, f, vCorpo, vCerv, rCorpo, rCerv) {
    const b = blocco(t);
    if (b > 0.5 && flussoFermo === null) flussoFermo = f;
    if (b <= 0.5) flussoFermo = null;
    let kc = 0, kv = 0;
    globCorpo.visible = vCorpo > 0.01; globCorpo.material.opacity = vCorpo;
    globCerv.visible = vCerv > 0.01; globCerv.material.opacity = vCerv;
    for (const g of GLOBULI) {
      const m = g.punti.length - 1, media = g === MEDIA;
      const avanti = (media && b > 0.5 ? flussoFermo : f) * (g.cervello ? 0.45 : 0.9);
      for (let i = 0; i < g.n; i++) {
        let u = ((i + 0.5) / g.n + avanti / g.lung) % 1; if (u < 0) u += 1;
        let s = g.cervello ? rCerv : rCorpo;
        if (media && b > 0) {
          if (u > g.uC) s *= 1 - b;                               // a valle del coagulo il sangue non arriva
          else if (u > g.uC - 0.05) u = mix(u, g.uC - 0.012 - (g.uC - u) * 0.3, b);   // a monte si accalcano contro il coagulo
        }
        const q = g.punti[Math.min(m, Math.round(u * m))];
        _gs.setScalar(Math.max(1e-6, s)); _gm.compose(q, _gq, _gs);
        if (g.cervello) globCerv.setMatrixAt(kv++, _gm); else globCorpo.setMatrixAt(kc++, _gm);
      }
    }
    globCorpo.instanceMatrix.needsUpdate = true; globCerv.instanceMatrix.needsUpdate = true;
  }

  // coagulo: grumo rosso scuro, irregolare, allungato lungo l'arteria (disegno schematico)
  const coagulo = (function () {
    const geo = new THREE.IcosahedronGeometry(1, 4), pos = geo.attributes.position, v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i);
      const r = 1 + 0.16 * Math.sin(v.x * 7.1 + 1.3) * Math.sin(v.y * 6.3) + 0.1 * Math.sin(v.z * 9.7 + v.x * 3.1);
      v.multiplyScalar(r); pos.setXYZ(i, v.x, v.y, v.z); }
    geo.computeVertexNormals();
    const m = new THREE.MeshStandardMaterial({ color: 0x5e1014, roughness: 0.85, emissive: 0x2a0306, transparent: true });
    const me = new THREE.Mesh(geo, m); me.position.copy(PUNTO_COAG);

    const voci = [['1', 'Viso', 'sorridi', T(7)], ['2', 'Braccia', 'alzale tutte e due', T(8)], ['3', 'Parola', 'ripeti una frase', T(9)]];
    c.save();
    voci.forEach(([n, ti, so, t0], i) => {
      const q = LAY.controllo(i), b = clamp((t - (T(6) + 0.3 + i * 0.35)) / 0.45), attivo = t >= t0 - 0.3 && t < (i < 2 ? voci[i + 1][3] - 0.3 : F(9) + 1);
      if (b <= 0.001) return;
      c.globalAlpha = a * clamp(b * 4);                        // il pannello è pieno subito, il contenuto entra
      const y = q.y + (1 - b) * 24;
      pannello(c, q.x, y, q.w, q.h, attivo ? KIT.giallo : 'rgba(255,255,255,.45)');
      c.globalAlpha = a * b;
      c.globalAlpha = a * b * (t >= T(7) - 0.3 && !attivo ? 0.6 : 1);
      c.fillStyle = KIT.giallo; c.beginPath(); c.arc(q.x + 52, y + 52, 32, 0, 7); c.fill();
      testo(c, n, q.x + 52, y + 66, 38, 900, KIT.blu, 'center');
      testo(c, ti, q.x + 100, y + 64, 40, 800, '#FFFFFF');
      testo(c, so, q.x + 100, y + 100, 24, 600, 'rgba(255,255,255,.85)');
      const dx = VERT ? q.x + q.w - 190 : q.x + q.w / 2, dy = VERT ? y + q.h / 2 + 6 : y + 330;
      if (i === 0) disegnoViso(c, dx, dy, VERT ? 100 : 130, liscia(tm.bocca - 0.6, tm.bocca + 0.4, t));
      if (i === 1) disegnoBraccia(c, dx, dy + (VERT ? 40 : 60), VERT ? 190 : 260, liscia(tm.scende - 0.5, tm.scende + 0.9, t));
      if (i === 2) disegnoParola(c, VERT ? q.x + q.w - 440 : q.x + 40, VERT ? y + 30 : y + 170, VERT ? 410 : q.w - 80, clamp((t - tm.ripetere + 0.4) / 0.6), clamp((t - tm.male + 0.6) / 0.6));
      const domanda = i === 0 ? 'Un lato della bocca resta giù?' : i === 1 ? 'Una scende o non si muove?' : 'Parla male o non capisce?';
      const vD = clamp((t - (i === 0 ? tm.bocca : i === 1 ? tm.scende : tm.male) + 0.2) / 0.4);
      if (vD > 0) { c.globalAlpha = a * b * vD; if (VERT) testo(c, domanda, q.x + 100, y + 150, 24, 700, KIT.giallo); else testo(c, domanda, q.x + q.w / 2, y + q.h - 30, 26, 700, KIT.giallo, 'center'); }
    });
    c.restore();
  }
  function chiama112(c, t) {
    const a = fin(t, T(10) - 0.1, F(10) + 0.9, 0.4, 0.5); if (a <= 0.001) return;
    const { x, y, w, h } = LAY.grande;
    c.save(); c.globalAlpha = a; pannello(c, x, y, w, h, KIT.giallo);
    testo(c, 'Basta un solo segno', x + w / 2, y + 90, 40, 800, '#FFFFFF', 'center');
    testo(c, 'chiama subito il', x + w / 2, y + 160, 34, 600, 'rgba(255,255,255,.9)', 'center');
    testo(c, '112', x + w / 2, y + 340, 170, 900, KIT.giallo, 'center');

  }
  function orologio(c, t) {
    const a = fin(t, T(11) - 0.2, F(11) + 0.8, 0.4, 0.5); if (a <= 0.001) return;

      c.beginPath(); c.moveTo(cx + Math.sin(an) * r * (0.92 - l), cy - Math.cos(an) * r * (0.92 - l)); c.lineTo(cx + Math.sin(an) * r * 0.92, cy - Math.cos(an) * r * 0.92); c.stroke(); }
    for (let k = 0; k < 60; k++) if (k % 5) { const an = k / 60 * 2 * Math.PI; c.lineWidth = 2;               // minuti
      c.beginPath(); c.moveTo(cx + Math.sin(an) * r * 0.87, cy - Math.cos(an) * r * 0.87); c.lineTo(cx + Math.sin(an) * r * 0.92, cy - Math.cos(an) * r * 0.92); c.stroke(); }
    for (let k = 1; k <= 12; k++) { const an = k / 12 * 2 * Math.PI;                                             // numeri delle ore
      testo(c, String(k), cx + Math.sin(an) * r * 0.66, cy - Math.cos(an) * r * 0.66 + r * 0.075, Math.round(r * 0.2), 700, KIT.blu, 'center'); }
    // 10:15: la lancetta delle ore sta un quarto oltre il 10, verso l'11 (10,25 ore); quella dei minuti sul 3
    const ore = 10 + 15 / 60, aO = ore / 12 * 2 * Math.PI, aM = 15 / 60 * 2 * Math.PI;
    c.lineCap = 'round'; c.lineWidth = 11; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.sin(aO) * r * 0.5, cy - Math.cos(aO) * r * 0.5); c.stroke();
    c.lineWidth = 7; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.sin(aM) * r * 0.78, cy - Math.cos(aM) * r * 0.78); c.stroke();
    c.fillStyle = KIT.blu; c.beginPath(); c.arc(cx, cy, 12, 0, 7); c.fill();
    const b = clamp((t - T(11) - 0.8) / 0.5);
    c.globalAlpha = a * b;
    testo(c, 'Annota: «sintomi dalle 10:15»', cx, cy + r + 70, VERT ? 36 : 30, 800, KIT.giallo, 'center');
    const b2 = clamp((t - W_(11, /oppure/, 0.45) + 0.2) / 0.5); c.globalAlpha = a * b2;
    testo(c, 'oppure l\'ultima volta che stava bene', cx, cy + r + (VERT ? 122 : 114), VERT ? 28 : 24, 600, '#FFFFFF', 'center');
    c.restore();
  }
  function iconaDivieto(c, q, tipo, alfa) {
    c.save(); c.globalAlpha = alfa; pannello(c, q.x, q.y, q.w, q.h, '#ff8a80');
    const cx = q.x + q.w / 2, cy = q.y + 130; c.strokeStyle = '#FFFFFF'; c.lineWidth = 6; c.lineCap = 'round'; c.lineJoin = 'round';
    if (tipo === 0) { c.beginPath(); c.ellipse(cx, cy + 20, 70, 22, 0, 0, 7); c.stroke();                       // piatto con forchetta
      c.beginPath(); c.moveTo(cx - 95, cy - 50); c.lineTo(cx - 95, cy + 40); c.moveTo(cx - 108, cy - 50); c.lineTo(cx - 108, cy - 20); c.lineTo(cx - 82, cy - 20); c.lineTo(cx - 82, cy - 50); c.stroke(); }
    if (tipo === 1) { c.beginPath(); c.moveTo(cx - 40, cy - 60); c.lineTo(cx - 30, cy + 55); c.lineTo(cx + 30, cy + 55); c.lineTo(cx + 40, cy - 60); c.stroke();   // bicchiere d'acqua
      c.fillStyle = 'rgba(0,159,227,.7)'; c.beginPath(); c.moveTo(cx - 35, cy - 15); c.lineTo(cx - 30, cy + 52); c.lineTo(cx + 30, cy + 52); c.lineTo(cx + 35, cy - 15); c.closePath(); c.fill(); }
    if (tipo === 2) { c.save(); c.translate(cx, cy); c.rotate(-0.6); rett(c, -62, -26, 124, 52, 26); c.stroke(); c.beginPath(); c.moveTo(0, -26); c.lineTo(0, 26); c.stroke(); c.restore();   // compressa
      c.beginPath(); c.arc(cx + 50, cy + 40, 22, 0, 7); c.stroke(); }
    c.strokeStyle = '#ff5a4e'; c.lineWidth = 10; c.beginPath(); c.arc(cx, cy, 92, 0, 7); c.stroke();             // divieto
    c.beginPath(); c.moveTo(cx - 65, cy + 65); c.lineTo(cx + 65, cy - 65); c.stroke();
    const ti = ['Niente cibo', 'Niente acqua', 'Niente farmaci'][tipo];
    testo(c, ti, cx, q.y + 278, VERT ? 28 : 26, 800, '#FFFFFF', 'center');
    if (tipo === 2) testo(c, 'nemmeno l\'aspirina', cx, q.y + 312, VERT ? 22 : 20, 700, KIT.giallo, 'center');
    c.restore();
  }
  function divieti(c, t) {
    const a = fin(t, T(13) - 0.2, tm.coagEmo - 0.1, 0.4, 0.5); if (a <= 0.001) return;
    const chi = [W_(13, /mangiare/, 0.05), W_(13, /bere/, 0.12), W_(13, /farmaci/, 0.2)];
    chi.forEach((t0, i) => iconaDivieto(c, LAY.divieti(i), i, a * clamp((t - t0 + 0.3) / 0.4)));
  }
  // chiusura: le azioni in ordine (riepilogo da leggere con calma), il 112 e i corsi
  function chiusura(c, t) {
    const a = clamp((t - T(15) + 0.4) / 0.7); if (a <= 0) return;
    c.save(); c.globalAlpha = a;
    c.fillStyle = 'rgba(0,40,92,.9)'; c.fillRect(0, 0, W, H);
    const passi = ['Viso, braccia, parola: controlla', 'Chiama subito il 112', 'Segna l\'ora dei primi segni', 'Niente cibo, acqua né farmaci'];
    const x0 = VERT ? 110 : 150, y0 = VERT ? 420 : 250, dy = VERT ? 92 : 104, corpo = VERT ? 36 : 38;
    testo(c, 'Se pensi a un ictus:', x0, y0, VERT ? 38 : 40, 800, KIT.giallo);
    passi.forEach((p, i) => {
      const b = clamp((t - T(15) - 0.1 - i * 0.3) / 0.4), y = y0 + 70 + i * dy;
      c.globalAlpha = a * b;
      c.fillStyle = KIT.giallo; c.beginPath(); c.arc(x0 + 30, y - 12, 30, 0, 7); c.fill();
      testo(c, String(i + 1), x0 + 30, y + 2, 36, 900, KIT.blu, 'center');
      testo(c, p, x0 + 82, y, corpo, 700, '#FFFFFF');
    });
    c.globalAlpha = a;
    const cx = VERT ? W / 2 : 1500, y112 = VERT ? 930 : 330;
    testo(c, 'In ogni emergenza', cx, y112 - 80, VERT ? 34 : 34, 700, '#FFFFFF', 'center');
    testo(c, '112', cx, y112 + 70, VERT ? 140 : 150, 900, KIT.giallo, 'center');
    const d = clamp((t - T(16) + 0.2) / 0.6);
    c.globalAlpha = a * d;
    const yc = VERT ? 1080 : 560;
    testo(c, 'Il primo soccorso si impara ai corsi BLSD', cx, yc, VERT ? 30 : 28, 700, '#FFFFFF', 'center');
    testo(c, 'della Misericordia di Ariccia', cx, yc + (VERT ? 40 : 38), VERT ? 30 : 28, 700, '#FFFFFF', 'center');
    testo(c, '328 8105399', cx, yc + (VERT ? 118 : 116), VERT ? 60 : 58, 900, KIT.giallo, 'center');
    testo(c, 'oppure 06 933 3717', cx, yc + (VERT ? 160 : 156), 26, 600, '#FFFFFF', 'center');
    testo(c, 'misericordia-ariccia.it/servizi/formazione', cx, yc + (VERT ? 212 : 210), VERT ? 28 : 26, 600, '#FFFFFF', 'center');
    c.restore();
  }

  /* ============================================================ cornice di microtesto */
  const telaCornice = document.getElementById('cornice');
  let esitoCornice = null;

  /* ============================================================ render(t) */
  const fonte = document.getElementById('fonte');
  const sceneA = t => { let k = 0; SCENE.forEach((s, i) => { if (t >= s.inizio) k = i; }); return k; };
  function opacita(nome, a) { const m = PARTI[nome]; if (!m) return; m.material.opacity = a; m.visible = a > 0.004; m.material.depthWrite = a > 0.97; }
  function render(tempo) {
    const t = clamp(tempo, 0, TOTAL);
    U.uT.value = t;
    const f = flusso(t); U.uFA.value = f;
    const c = contrazione(t); contrV.value = 0.07 * c.v; contrA.value = 0.06 * c.a;
    const b = blocco(t); U.uBlocco.value = b; U.uScuro.value = scurito(t);
    U.uParola.value = fin(t, tm.parola - 0.2, F(4) + 0.4, 0.5, 0.5) * (0.75 + 0.25 * Math.sin(t * 5));
    U.uBraccio.value = fin(t, tm.braccio - 0.2, F(4) + 0.4, 0.5, 0.5) * (0.75 + 0.25 * Math.sin(t * 5 + 1.5));

    U.uLatoDx.value = fin(t, tm.destro - 0.6, F(5) + 0.6, 0.6, 0.5);
    const cam = telecamera(t);
    dentro.updateMatrixWorld(true);

    // pelle olografica: piena nelle viste del corpo, più leggera vicino al cervello
    const vicinoCerv = clamp((0.9 - camDist) / 0.4);
    alfaPelle.value = mix(1, 0.35, vicinoCerv);
    PARTI.pelle.visible = true;
    opacita('colonna', 0.35 * (1 - vicinoCerv));
    // emisferi trasparenti quando si guardano le arterie, pieni quando si guarda il cervello
    const trasp = Math.max(fin(t, T(2) + 1.2, tm.senza + 1.45, 1.0, 0.5), fin(t, T(13) + 0.2, tm.tac + 0.4, 0.8, 0.6), fin(t, T(14) + 0.3, tm.salva + 1.7, 0.6, 0.6));   // nel finale si vede il coagulo che si scioglie
    const aCerv = mix(1, 0.2, trasp);
    for (const n of ['emisfero_sx', 'emisfero_dx', 'encefalo_resto']) {   // a metà dissolvenza solo la faccia esterna: niente pieghe interne
      opacita(n, aCerv); const m = PARTI[n].material, pieno = aCerv > 0.35;
      if ((m.side === THREE.FrontSide) !== pieno) { m.side = pieno ? THREE.FrontSide : THREE.DoubleSide; m.needsUpdate = true; }
      m.depthWrite = pieno; }
    opacita('arterie_cervello', 1); opacita('arterie', 1); opacita('vene', 0.3 * (1 - vicinoCerv));
    U.uVis.value = 1;
    // globuli
    const rCorpo = clamp(0.0026 * camDist / 0.7, 0.0026, 0.0085), rCerv = clamp(0.0009 * camDist / 0.25, 0.0007, 0.0024);
    const vG = t < T(1) + 0.5 ? fin(t, 0.3, 99, 0.8, 1) : 1;
    aggiornaGlobuli(t, f, vG * (1 - 0.6 * vicinoCerv), vG, rCorpo, rCerv);
    // coagulo, emorragia, incrocio, TAC
    const sC = 0.0019 * b; coagulo.visible = sC > 1e-5; coagulo.scale.set(sC * 1.7, sC, sC);
    coagulo.material.opacity = clamp(b * 1.5);
    const vEmo = fin(t, tm.rompe - 0.1, tm.senza + 1.0, 0.9, 0.5) + fin(t, tm.coagEmo + 0.4, tm.tac + 0.3, 0.6, 0.5);
    emorragia.visible = vEmo > 0.01; emorragia.material.opacity = 0.85 * clamp(vEmo);
    const sE = 0.0055 * clamp(vEmo) * (0.85 + 0.15 * clamp((t - tm.rompe) / 1.5)); emorragia.scale.set(sE, sE * 0.8, sE);
    const cresce = clamp((t - tm.opposto) / 1.6) * fin(t, tm.opposto - 0.1, F(5) + 0.6, 0.1, 0.5);
    incrocio.visible = cresce > 0.01; incrocio.material.opacity = clamp(cresce * 3) * fin(t, tm.opposto, F(5) + 0.6, 0.1, 0.5);
    incrocio.geometry.setDrawRange(0, Math.floor(incrocio.geometry.index.count * clamp(cresce) / 3) * 3);
    const finePunta = curvaIncrocio.getPointAt(Math.max(0.001, clamp(cresce))), tang = curvaIncrocio.getTangentAt(Math.max(0.001, clamp(cresce)));
    puntaIncrocio.visible = incrocio.visible; puntaIncrocio.position.copy(finePunta); puntaIncrocio.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tang);
    const vTac = fin(t, tm.tac - 0.6, tm.medicine + 1.0, 0.6, 0.6);

    avviso(s2, 'anche se sembra migliorare', fin(t, W_(12, /anche/, 0.5) - 0.1, F(12) + 0.6, 0.35, 0.4), '#FFFFFF', VERT ? 810 : 590);
    divieti(s2, t);
    avviso(s2, 'Lo dice solo la TAC, in ospedale', fin(t, tm.tac - 0.2, tm.medicine - 0.1, 0.35, 0.4), '#7fd4ff');
    avviso(s2, 'Le medicine le decidono i medici', fin(t, tm.medicine - 0.1, F(13) + 0.8, 0.35, 0.4), '#FFFFFF');
    avviso(s2, 'Il tempo è cervello', fin(t, tm.tempo - 0.2, F(14) + 0.9, 0.35, 0.4), KIT.giallo);
    avviso(s2, 'Ictus', fin(t, tm.ictus - 0.1, F(3) + 0.8, 0.3, 0.4), '#ff8a80');

    IMP.sottotitoli(stato, t, FRASI, { modo: 'parole' });

    if (fonte.textContent !== testoFonte) fonte.textContent = testoFonte;

    const pannelli = Math.max(fin(t, T(6) - 0.2, F(9) + 1.0, 0.3, 0.3), fin(t, T(11) - 0.2, F(11) + 0.8, 0.3, 0.3) * (VERT ? 1 : 0), fin(t, T(13) - 0.2, tm.coagEmo - 0.1, 0.3, 0.3));
    fonte.style.opacity = ((t < T(15) - 0.4 ? 1 : 1 - clamp((t - T(15) + 0.4) / 0.5)) * (1 - pannelli)).toFixed(3);
    window.__camFerma = cam.ferma;
  }

  window.renderFrame = t => render(t);
  const problemi = [];
  if (!MEDIA) problemi.push({ tipo: 'anatomia', dettagli: 'manca il percorso dell\'arteria cerebrale media sinistra' });
  if (MEDIA && (MEDIA.uC < 0.2 || MEDIA.uC > 0.9)) problemi.push({ tipo: 'anatomia', dettagli: 'coagulo fuori dal tratto dell\'arteria cerebrale media (u = ' + MEDIA.uC.toFixed(2) + ')' });
  if (FRASI.length && RIGHE.length !== 16) problemi.push({ tipo: 'voce', dettagli: 'le frasi della voce non sono 16' });
  window.__controlli = () => IMP.controlli(stato).concat(problemi);
  Promise.all([IMP.caricaFont(), new Promise(r => { if (stemma.complete) r(); else stemma.onload = r; })]).then(() => {
    render(0);
    esitoCornice = window.corniceSovrapposta(telaCornice, fondo);
    window.CORNICE_ESITO = esitoCornice;
    window.__ready = true;
  });
})();

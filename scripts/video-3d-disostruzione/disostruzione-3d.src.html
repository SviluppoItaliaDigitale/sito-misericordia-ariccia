<script>/*CORNICE*/</script>
<script>
(function () {
  'use strict';
  const M3 = window.Motore3D, IMP = window.IMP, THREE = window.THREE;
  const dato = n => { const e = document.getElementById('dato-' + n), s = e ? e.textContent.trim() : '';
                      return !s || s.startsWith('/*DATO:') ? null : JSON.parse(s); };
  const A = dato('anatomia'), FRASI = dato('sottotitoli') || [];
  const P = A.punti;
  const { clamp, mix, prog } = M3;
  const morb = u => 0.5 - 0.5 * Math.cos(Math.PI * clamp(u));
  const liscia = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
  const fin = (t, a, b, e = 0.4, u = 0.4) => clamp(Math.min((t - a) / e, (b - t) / u));   // finestra 0..1
  const KIT = { blu: '#003F85', giallo: '#FCEB0C', azzurro: '#009FE3', notte: '#061633' };
  const TITOLO = 'Soffocamento: come si libera la gola';

  /* ============================================================ tempi: inizio e fine delle 20 frasi della voce */
  // Le scene sono scritte rispetto alle frasi (S[i] inizio, E[i] fine della frase i, in secondi veri): niente
  // scaletta da riallineare. Senza sottotitoli (provini) si usa una stima dalla lunghezza delle frasi.
  const N = 20;
  const DOPO = [0, 1.2, 1.2, 1.6, 0.8, 1.6, 0.8, 3.6, 3.4, 1.0, 2.6, 2.6, 0.8, 1.2, 1.2, 0.8, 2.6, 2.6, 1.2, 4.6, 3.0];   // dopo la 19: scheda «Dall'anno in su»
  const S = [], E = [];
  (function () {
    const R = []; FRASI.forEach(f => { const r = f.riga; if (!R[r]) R[r] = { inizio: f.inizio, fine: f.fine }; else R[r].fine = Math.max(R[r].fine, f.fine); });
    if (R.filter(Boolean).length === N) { for (let i = 1; i <= N; i++) { S[i] = R[i].inizio; E[i] = R[i].fine; } return; }
    const PAROLE = [21, 10, 15, 9, 14, 17, 15, 28, 16, 9, 22, 13, 13, 6, 13, 18, 14, 16, 12, 34];
    let x = 1.0; for (let i = 1; i <= N; i++) { S[i] = x; E[i] = x + PAROLE[i - 1] / 2.55; x = E[i] + DOPO[i]; }
  })();
  const TOTAL = E[N] + DOPO[N];
  window.TOTAL = TOTAL;
  const dur = i => E[i] - S[i];
  const SCENE = [
    { nome: 'Esofago e trachea', inizio: 0 }, { nome: 'Il boccone sbaglia strada', inizio: S[3] - 0.3 },
    { nome: 'La tosse', inizio: S[5] - 0.3 }, { nome: 'Cinque colpi tra le scapole', inizio: S[7] - 0.3 },
    { nome: 'Cinque compressioni addominali', inizio: S[8] - 0.3 }, { nome: 'Se perde conoscenza', inizio: S[11] - 0.3 },
    { nome: 'Dopo', inizio: S[12] - 0.3 }, { nome: 'Nel lattante (sotto l\'anno)', inizio: S[14] - 0.3 },
    { nome: 'Che cosa fare', inizio: S[20] - 0.3 }
  ];
  const FORMATO = new URLSearchParams(location.search).get('formato') === 'verticale' ? 'verticale' : 'orizzontale';
  const VERT = FORMATO === 'verticale';
  const L = IMP.layout(FORMATO), W = L.W, H = L.H;
  window.STAGE_W = W; window.STAGE_H = H;
  for (const id of ['fondo', 'sopra', 'cornice']) { const e = document.getElementById(id); e.width = W; e.height = H; }
  const stage = document.getElementById('stage');
  const stato = IMP.monta(stage, { ente: 'misericordia', formato: FORMATO, hud: null, nota: null });
  IMP.anteprima(stage);
  if (new URLSearchParams(location.search).get('pulito') === '1') {
    const st = document.createElement('style'); st.textContent = '#sopra,#cornice,#fonte,#imp-radice{display:none!important}'; document.head.appendChild(st);
  }

  /* ============================================================ eventi (tempi veri) */
  // colpi tra le scapole e compressioni addominali: istanti dei 5 colpi
  const COLPI = [0, 1, 2, 3, 4].map(k => S[7] + Math.min(1.6, dur(7) * 0.35) + k * 0.78);
  const SPINTE = [0, 1, 2, 3, 4].map(k => Math.max(S[8] + dur(8) * 0.62, E[8] - 2.4) + k * 0.82);
  const SPINTE_LENTE = [S[9] + 0.9, S[9] + 2.9];                    // al rallentatore, nello spaccato
  const ALTERNA = [];                                              // frase 10: 2 colpi e 2 spinte veloci, poi esce
  for (let k = 0; k < 3; k++) ALTERNA.push({ t: S[10] + 0.4 + k * 0.62, tipo: 'colpo' });
  for (let k = 0; k < 3; k++) ALTERNA.push({ t: S[10] + 2.4 + k * 0.62, tipo: 'spinta' });
  const T_ESCE = Math.min(E[10] + 1.4, S[11] - 1.0);                // il boccone esce dalla bocca
  const T_SDRAIA = S[11] + 0.2, RCP_A = S[11] + 2.6, RCP_B = E[11] + 2.2, PERIODO_RCP = 60 / 110;
  const T_ESCE2 = RCP_B - 0.9;
  const TOSSI = [S[5] + 0.6, S[5] + 1.5, S[5] + 2.4, E[5] + 0.3];
  const impulso = (t, t0, a = 0.06, b = 0.28) => t < t0 ? 0 : t < t0 + a ? (t - t0) / a : Math.exp(-(t - t0 - a) / b);
  const somma = (t, lista, a, b) => lista.reduce((s, t0) => s + impulso(t, t0, a, b), 0);
  function colpo(t) { return somma(t, COLPI.concat(ALTERNA.filter(x => x.tipo === 'colpo').map(x => x.t)), 0.05, 0.16); }
  function spinta(t) {
    return somma(t, SPINTE.concat(ALTERNA.filter(x => x.tipo === 'spinta').map(x => x.t)), 0.12, 0.3) + somma(t, SPINTE_LENTE, 0.5, 0.7);
  }
  function compressione(t) {                                       // affondamento dello sterno (m) a 110 al minuto
    if (t < RCP_A || t > RCP_B) return 0;
    const ph = ((t - RCP_A) / PERIODO_RCP) % 1;
    return 0.05 * (0.5 - 0.5 * Math.cos(2 * Math.PI * ph)) * clamp((RCP_B - t) / 0.2);
  }
  // piegata in avanti (radianti): durante colpi e spinte
  const piegata = t => 0.6 * fin(t, S[7] + 0.1, T_ESCE + 0.8, 1.0, 1.0);
  const sdraiata = t => morb(prog(t, T_SDRAIA, 2.2)) * (1 - morb(prog(t, E[13] + 0.2, 1.0)));

  /* ============================================================ fondo e scena */
  const fondo = document.getElementById('fondo'), fctx = fondo.getContext('2d');
  (function () {
    const g = fctx.createRadialGradient(W * 0.5, VERT ? 820 : 470, 60, W * 0.5, VERT ? 820 : 470, VERT ? 1500 : 1250);
    g.addColorStop(0, '#0B3D7E'); g.addColorStop(0.5, '#082B5E'); g.addColorStop(1, KIT.notte);
    fctx.fillStyle = g; fctx.fillRect(0, 0, W, H);
  })();
  const vicino = M3.creaRenderer(document.getElementById('livello-scena'), W, H, { scala: 0.8 });
  const scena = new THREE.Scene();
  const camera = M3.creaCamera(W, H, { fov: VERT ? 42 : 30, zona: L.zona });
  scena.add(new THREE.HemisphereLight(0xdfe8ff, 0x1a2a4a, 1.25));
  const luce = new THREE.DirectionalLight(0xffffff, 1.5); scena.add(luce); scena.add(luce.target);
  const luce2 = new THREE.DirectionalLight(0x9fc4ff, 0.55); scena.add(luce2); scena.add(luce2.target);

  /* ============================================================ anatomia */
  function b64(s, T) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new T(u.buffer); }
  function geometria(g) {
    const q = b64(g.pos, Uint16Array), n = b64(g.nor, Int8Array), p = new Float32Array(q.length), nn = new Float32Array(q.length);
    for (let i = 0; i < q.length; i++) { const k = i % 3; p[i] = g.lo[k] + q[i] / 65535 * g.sc[k]; nn[i] = n[i] / 127; }
    const G = new THREE.BufferGeometry();
    G.setAttribute('position', new THREE.BufferAttribute(p, 3));
    G.setAttribute('normal', new THREE.BufferAttribute(nn, 3));
    G.setIndex(new THREE.BufferAttribute(b64(g.idx, g.i32 ? Uint32Array : Uint16Array), 1));
    G.computeBoundingSphere();
    return G;
  }
  // Uniformi comuni: piegatura in avanti, affondamento dello sterno, salita del diaframma, respiro.
  const U = { uPieg: { value: 0 }, uComp: { value: 0 }, uDiaf: { value: 0 }, uResp: { value: 0 } };
  const PIANO = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 1e3);    // spaccato: si tiene x <= costante
  // Piegatura in avanti attorno alle anche (asse x, perno y 0,93 z 0,07): il busto ruota, le gambe restano; le braccia
  // (|x| > 0,17 sopra i 60 cm, staccate dal fianco nel modello) ruotano tutte con il busto.
  const PERNO_P = [0.93, 0.07];
  const VERT_POSA = `
    float pesoP = max(smoothstep(0.86, 0.98, transformed.y), smoothstep(0.165, 0.18, abs(transformed.x)) * step(0.6, transformed.y));
    if (pesoP > 0.0 && uPieg > 0.0) { float a = uPieg * pesoP; float dy = transformed.y - ${PERNO_P[0]}, dz = transformed.z - ${PERNO_P[1]};
      transformed.y = ${PERNO_P[0]} + dy * cos(a) - dz * sin(a); transformed.z = ${PERNO_P[1]} + dy * sin(a) + dz * cos(a); }`;
  const VERT_COMP = `
    float pesoComp = smoothstep(0.075, 0.205, transformed.z) * exp(-pow(transformed.x / 0.115, 2.0)) * exp(-pow((transformed.y - 1.205) / 0.12, 2.0));
    transformed.z -= uComp * pesoComp;`;
  function prepara(mat, o = {}) {
    mat.onBeforeCompile = sh => {
      Object.assign(sh.uniforms, U);
      sh.uniforms.uAlfa = o.alfa || { value: 1 }; sh.uniforms.uCentro = { value: new THREE.Vector3(...(o.centro || [0, 0, 0])) };
      let v = sh.vertexShader, f = sh.fragmentShader;
      v = v.replace('#include <common>', `#include <common>
        uniform float uPieg, uComp, uDiaf, uResp; uniform vec3 uCentro;`);
      v = v.replace('#include <begin_vertex>', `#include <begin_vertex>
        ${o.polmoni ? `{ float basso = 1.0 - smoothstep(1.02, 1.2, transformed.y);
          transformed = uCentro + (transformed - uCentro) * (1.0 + uResp);
          transformed.y += uDiaf * 0.032 * basso; transformed.xz = uCentro.xz + (transformed.xz - uCentro.xz) * (1.0 - 0.05 * uDiaf * basso); }` : ''}
        ${o.diaframma ? 'transformed.y += uDiaf * 0.032 * (1.0 - smoothstep(0.0, 0.09, abs(transformed.y - 1.12)));' : ''}
        ${o.addome ? 'transformed.y += uDiaf * 0.02 * (1.0 - smoothstep(0.98, 1.16, transformed.y)) * step(0.9, transformed.y);' : ''}
        ${VERT_COMP}
        ${VERT_POSA}`);
      f = f.replace('#include <common>', `#include <common>
        uniform float uAlfa;`);
      let extra = '';
      if (o.olo) extra += `
        float rim = pow(1.0 - abs(dot(normalize(normal), normalize(vViewPosition))), 2.4);
        diffuseColor.a = clamp((0.035 + 0.75 * rim) * uAlfa, 0.0, 1.0);
        totalEmissiveRadiance += vec3(0.45, 0.78, 1.0) * rim * 0.9;`;
      if (o.luce) extra += `
        totalEmissiveRadiance += vec3(${o.luce}) * 0.35;`;
      f = f.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>' + extra);
      sh.vertexShader = v; sh.fragmentShader = f;
    };
    mat.customProgramCacheKey = () => JSON.stringify(o, (k, x) => (x && x.value !== undefined ? 'u' : x));
    mat.clippingPlanes = [];
    return mat;
  }
  // stessa trasformazione dei vertici, per gli oggetti disegnati qui (boccone, aria, mani)
  function posa(v) {
    const w = Math.max(liscia(0.86, 0.98, v.y), liscia(0.165, 0.18, Math.abs(v.x)) * (v.y >= 0.6 ? 1 : 0)), a = U.uPieg.value * w;
    if (a > 0) { const dy = v.y - PERNO_P[0], dz = v.z - PERNO_P[1]; v.y = PERNO_P[0] + dy * Math.cos(a) - dz * Math.sin(a); v.z = PERNO_P[1] + dy * Math.sin(a) + dz * Math.cos(a); }
    return v;
  }
  function comprimi(v) {
    const w = liscia(0.075, 0.205, v.z) * Math.exp(-Math.pow(v.x / 0.115, 2)) * Math.exp(-Math.pow((v.y - 1.205) / 0.12, 2));
    v.z -= U.uComp.value * w; return v;
  }
  const corpo = new THREE.Group(); scena.add(corpo);                 // ruota per sdraiare la persona
  const PERNO = new THREE.Vector3(0, 1.2, 0.12);
  corpo.position.copy(PERNO);
  const dentro = new THREE.Group(); dentro.position.copy(PERNO).multiplyScalar(-1); corpo.add(dentro);
  const PARTI = {};
  function parte(nome, mat) {
    const g = A.gruppi[nome]; if (!g) { console.warn('manca', nome); return null; }
    const me = new THREE.Mesh(geometria(g), mat); dentro.add(me); PARTI[nome] = me; return me;
  }
  const std = (colore, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: colore, roughness: 0.55, metalness: 0.0, side: THREE.DoubleSide, transparent: true }, o));
  const alfaPelle = { value: 1 };
  parte('pelle', prepara(std(0x6fa8e8, { depthWrite: false, roughness: 0.4 }), { olo: true, alfa: alfaPelle, addome: true })).renderOrder = 5;
  const OSSA = 0xeee6d2;
  for (const n of ['costole', 'colonna', 'scapole', 'cranio', 'mandibola', 'ioide']) parte(n, prepara(std(OSSA)));
  parte('polmoni', prepara(std(0xe7a3a6, { opacity: 0.35, depthWrite: false }), { polmoni: true, centro: P.polmoni }));
  parte('diaframma', prepara(std(0xc0675d, { opacity: 0.85 }), { diaframma: true }));
  parte('trachea', prepara(std(0x9fd8ff, { roughness: 0.4 }), { luce: '0.25, 0.55, 0.9' }));
  parte('laringe', prepara(std(0xbfe6ff, { roughness: 0.45 })));
  parte('epiglottide', prepara(std(0xffd36b, { roughness: 0.4 }), { luce: '0.9, 0.7, 0.1' }));
  parte('esofago', prepara(std(0xf29a6b, { roughness: 0.5 }), { luce: '0.8, 0.35, 0.15' }));
  parte('stomaco', prepara(std(0xe98d68, { opacity: 0.8 }), { addome: true }));
  parte('lingua', prepara(std(0xd96b72)));
  parte('palato', prepara(std(0xe48c90)));
  // epiglottide: si abbassa sull'ingresso della laringe ruotando attorno alla sua base (asse sinistra-destra)
  const EPI = PARTI.epiglottide;
  const BASE_EPI = new THREE.Vector3(0, P.epiglottide_min[1] + 0.002, P.epiglottide[2] + 0.001);
  const perno = new THREE.Group(); perno.position.copy(BASE_EPI); dentro.add(perno);
  dentro.remove(EPI); EPI.position.copy(BASE_EPI).multiplyScalar(-1); perno.add(EPI);

  // gola (faringe): l'atlante non la ha; tubo morbido e trasparente dietro la lingua, dal palato all'esofago
  const v3 = a => new THREE.Vector3(a[0], a[1], a[2]);
  const zF = P.esofago_alto[2];
  const curvaFaringe = new THREE.CatmullRomCurve3([[0, 1.50, 0.084], [0, 1.47, 0.088], [0, 1.44, 0.094], [0, 1.415, zF + 0.002], [0, P.esofago_alto[1] + 0.004, zF]].map(v3));
  const faringe = new THREE.Mesh(new THREE.TubeGeometry(curvaFaringe, 60, 0.011, 20, false), prepara(std(0xf6b0a0, { opacity: 0.32, depthWrite: false })));
  faringe.renderOrder = 4; dentro.add(faringe); PARTI.faringe = faringe;

  // centro dei condotti (media dei vertici per fette di 1 cm, lisciata), dai modelli veri
  function centrale(nome, y0, y1, filtro) {
    const pos = PARTI[nome].geometry.attributes.position, fette = new Map(), q = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) { q.fromBufferAttribute(pos, i); if (q.y > y0 || q.y < y1 || (filtro && !filtro(q))) continue;
      const k = Math.round(q.y / 0.01); const f = fette.get(k) || [0, 0, 0, 0]; f[0] += q.x; f[1] += q.y; f[2] += q.z; f[3]++; fette.set(k, f); }
    const pts = [...fette.entries()].sort((a, b) => b[0] - a[0]).map(([, f]) => new THREE.Vector3(f[0] / f[3], f[1] / f[3], f[2] / f[3]));
    for (let r = 0; r < 3; r++) for (let i = 1; i < pts.length - 1; i++) pts[i] = pts[i - 1].clone().add(pts[i + 1]).multiplyScalar(0.25).addScaledVector(pts[i], 0.5);
    return pts;
  }
  const lineaEsofago = centrale('esofago', P.esofago_alto[1], 1.12);
  const lineaTrachea = centrale('trachea', P.trachea_alto[1], P.carena[1] + 0.012, q => Math.abs(q.x) < 0.018);
  // percorsi del boccone: dalla bocca alla gola, poi nell'esofago (giusto) o nella trachea (sbagliato)
  const BOCCA = [0, 1.452, 0.168], LINGUA_DIETRO = [0, 1.462, 0.118], GOLA = [0, 1.44, 0.097];
  const strada = (...pp) => new THREE.CatmullRomCurve3(pp.map(p => p.isVector3 ? p.clone() : v3(p)), false, 'centripetal');
  const viaEsofago = strada(BOCCA, LINGUA_DIETRO, GOLA, [0, 1.412, zF + 0.001], ...lineaEsofago, [P.stomaco[0] - 0.01, P.stomaco_max[1] - 0.01, P.stomaco[2] - 0.02]);
  const INGRESSO = [0, 1.422, 0.101];
  const tr0 = lineaTrachea[0];
  const viaTrachea = strada(BOCCA, LINGUA_DIETRO, GOLA, INGRESSO, [0, 1.405, tr0.z + 0.001], tr0, lineaTrachea[2]);
  const lungTr = viaTrachea.getLength();
  const S_FERMO = 1.0;                                             // in fondo alla curva: 2 cm sotto la cima della trachea
  const fuori = strada(BOCCA, [0, 1.449, 0.205], [0, 1.44, 0.26]);   // dalla bocca verso l'esterno

  // il boccone: un pezzo di cibo irregolare, disegnato qui
  const bocconeGeo = new THREE.IcosahedronGeometry(0.0078, 3);
  { const p = bocconeGeo.attributes.position, q = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) { q.fromBufferAttribute(p, i); const n = 1 + 0.16 * Math.sin(q.x * 900) * Math.sin(q.y * 700 + 1) + 0.1 * Math.sin(q.z * 1100);
      q.multiplyScalar(n); q.y *= 1.25; p.setXYZ(i, q.x, q.y, q.z); } bocconeGeo.computeVertexNormals(); }
  const matBoccone = new THREE.MeshStandardMaterial({ color: 0xb8793e, roughness: 0.8, emissive: 0x3a1c06, emissiveIntensity: 0.6, transparent: true, depthTest: false });   // sempre visibile: è lo schema del boccone
  const boccone = new THREE.Mesh(bocconeGeo, matBoccone); boccone.renderOrder = 14; dentro.add(boccone);
  const alone = new THREE.Mesh(new THREE.SphereGeometry(0.016, 24, 16), new THREE.MeshBasicMaterial({ color: 0xff4d3d, transparent: true, opacity: 0, depthWrite: false }));
  alone.renderOrder = 7; dentro.add(alone);

  // aria: particelle chiare dalla bocca ai polmoni (e indietro con tosse e spinte)
  const PDX = [-0.075, 1.24, 0.08], PSX = [0.075, 1.24, 0.08];
  const viaAria = [strada(BOCCA, LINGUA_DIETRO, GOLA, INGRESSO, ...lineaTrachea, P.carena, [-0.03, 1.28, 0.083], PDX),
                   strada(BOCCA, LINGUA_DIETRO, GOLA, INGRESSO, ...lineaTrachea, P.carena, [0.03, 1.28, 0.083], PSX)];

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="formato" content="1080x1920">
<meta name="area-sicura" content="160">
<title>Storia con fascia</title>
<link rel="stylesheet" href="base.css">
</head>
<body>
<!--
Storia con fascia, 1080×1920 px. Modello della Confederazione Nazionale delle Misericordie d'Italia,
rifatto identico per la Misericordia di Ariccia. Storia 9:16 con le misure del modello nazionale: fascia a 348 px dall'alto, testi che finiscono a 170 px dal fondo.
Campi (attributo data-campo):
  foto           foto    foto vera della Misericordia; foto-posizione per il ritaglio (es. 70% 50%), foto-zoom da 1 a 2 per tagliare bande bianche, foto-alt per la descrizione
  fascia         testo   una o due parole: il tema del post (Volontariato, Servizio civile)
  evidenziato    testo   le prime parole del titolo, sul fondo blu scuro (stanno in una riga)
  titolo         testo   il resto del titolo
  sottotitolo    testo   una frase sotto il titolo
Dal 2/11/2026 caratteri e misure come nei post nazionali del 2026 (Mulish, fascia e titolo su due righe come in
post-giornata.html: prima riga evidenziata, di solito chiusa dai due punti), istruzione di Alessandro: «tutte le
grafiche devono uniformarsi da oggi in poi a quelle del nazionale».
Si compila e si salva con .claude/skills/grafiche-modelli-nazionali/rendi.py: istruzioni in LEGGIMI.md.
-->
<div class="tavola" style="width: 1080px; height: 1920px; position: relative; overflow: hidden; background: #0B2550; font-family: Mulish, sans-serif">
<img data-campo="foto" data-prova src="foto-prova/piazza-di-corte.jpg" alt="[Descrizione della foto]" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 900px; background: linear-gradient(180deg, rgba(0, 22, 54, 0) 0%, rgba(0, 22, 54, 0.5) 42%, rgba(0, 22, 54, 0.84) 100%)"></div>
<div style="position: absolute; left: 0; top: 340px; width: 1032px; height: 110px; background: var(--giallo)"></div>
<div data-riquadro data-ostacolo style="position: absolute; left: 0; top: 351px; width: 1014px; height: 110px; box-sizing: border-box; padding: 0 230px 0 26px; background: var(--blu); display: flex; align-items: center">
<span data-campo="fascia" style="font-weight: 700; font-size: 54px; line-height: 1.04; letter-spacing: -0.2px; color: var(--giallo); white-space: nowrap">[Tema]</span>
</div>
<img data-logo src="loghi/stemma-misericordie.png" alt="Stemma della Confederazione Nazionale delle Misericordie d'Italia" style="position: absolute; left: 798px; top: 294px; width: 182px; height: auto">
<div data-riquadro style="position: absolute; left: 56px; right: 60px; bottom: 238px; max-height: 650px; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-weight: 700; font-size: 61px; line-height: 70px; color: #FFFFFF"><span data-campo="evidenziato" style="display: inline-block; height: 70px; padding: 0 6px; margin-left: -6px; background: #013C7C; color: #FCF10C; white-space: nowrap">[Prime parole]</span><br><span data-campo="titolo">[resto del titolo]</span></p>
<p data-campo="sottotitolo" style="margin: 0; font-weight: 400; font-size: 46px; line-height: 52px; color: #FFFFFF">[Una frase: chi, che cosa, come esserci]</p>
</div>
<div class="firma" data-firma style="left: 56px; bottom: 180px; color: #FFFFFF; text-shadow: 0 1px 6px rgba(0, 22, 54, 0.6)">Misericordia di Ariccia</div>
</div>
</body>
</html>

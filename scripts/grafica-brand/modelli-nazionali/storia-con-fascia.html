<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="formato" content="1080x1920">
<meta name="area-sicura" content="160">
<title>Storia con fascia</title>
<link rel="stylesheet" href="base.css">
</head>
<body>
<!--
Storia con fascia, 1080×1920 px. Modello della Confederazione Nazionale delle Misericordie d'Italia,
rifatto identico per la Misericordia di Ariccia. Storia 9:16 con le misure del modello nazionale: fascia a 348 px dall'alto, testi che finiscono a 170 px dal fondo.
Campi (attributo data-campo):
  foto           foto    foto vera della Misericordia; foto-posizione per il ritaglio (es. 70% 50%), foto-zoom da 1 a 2 per tagliare bande bianche, foto-alt per la descrizione
  fascia         testo   una o due parole: il tema del post (Volontariato, Servizio civile)
  evidenziato    testo   le prime parole del titolo, sul fondo blu scuro (stanno in una riga)
  titolo         testo   il resto del titolo
  sottotitolo    testo   una frase sotto il titolo
Si compila e si salva con .claude/skills/grafiche-modelli-nazionali/rendi.py: istruzioni in LEGGIMI.md.
-->
<div class="tavola" style="width: 1080px; height: 1920px; position: relative; overflow: hidden; background: #0B2550; font-family: Montserrat, sans-serif">
<img data-campo="foto" data-prova src="foto-prova/piazza-di-corte.jpg" alt="[Descrizione della foto]" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 900px; background: linear-gradient(180deg, rgba(0, 22, 54, 0) 0%, rgba(0, 22, 54, 0.5) 42%, rgba(0, 22, 54, 0.84) 100%)"></div>
<div style="position: absolute; left: 0; top: 337px; width: 1028px; height: 92px; background: var(--giallo)"></div>
<div data-riquadro data-ostacolo style="position: absolute; left: 0; top: 348px; width: 1010px; height: 102px; box-sizing: border-box; padding: 0 240px 0 52px; background: var(--blu); display: flex; align-items: center">
<span data-campo="fascia" style="font-weight: 600; font-size: 93px; line-height: 1; color: var(--giallo); white-space: nowrap">[Tema]</span>
</div>
<img data-logo src="loghi/stemma-misericordie.png" alt="Stemma della Confederazione Nazionale delle Misericordie d'Italia" style="position: absolute; left: 786px; top: 302px; width: 176px; height: auto">
<div data-riquadro style="position: absolute; left: 56px; right: 70px; bottom: 170px; max-height: 650px; display: flex; flex-direction: column; gap: 24px">
<p style="margin: 0; font-weight: 500; font-size: 71px; line-height: 76px; color: #FFFFFF"><span data-campo="evidenziato" style="display: inline-block; height: 76px; padding: 0 8px; margin-left: -8px; background: #013C7C; color: #FCF10C; font-weight: 700; white-space: nowrap">[Prime parole]</span> <span data-campo="titolo">[resto del titolo]</span></p>
<p data-campo="sottotitolo" style="margin: 0; font-weight: 300; font-size: 48px; line-height: 55px; color: #FFFFFF">[Una frase: chi, che cosa, come esserci]</p>
</div>
</div>
</body>
</html>

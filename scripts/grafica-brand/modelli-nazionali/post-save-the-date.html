<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="formato" content="1080x1350">
<title>Post Save the date</title>
<link rel="stylesheet" href="base.css">
</head>
<body>
<!--
Post Save the date, 1080×1350 px. Modello della Confederazione Nazionale delle Misericordie d'Italia,
rifatto identico per la Misericordia di Ariccia. Dal post nazionale «Save the date»: il filo rosso è quello del modello.
Campi (attributo data-campo):
  foto           foto    foto del luogo o dell'evento; foto-posizione e foto-zoom per il ritaglio, foto-alt per la descrizione
  evidenziato    testo   titolo breve sul fondo blu, in una riga
  testo          html    una frase con data, luogo e che cosa succede; HTML ammesso (<strong>)
Si compila e si salva con .claude/skills/grafiche-modelli-nazionali/rendi.py: istruzioni in LEGGIMI.md.
-->
<div class="tavola" style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #DCE6F2; font-family: Montserrat, sans-serif">
<img data-campo="foto" data-prova src="foto-prova/piazza-di-corte.jpg" alt="[Descrizione della foto]" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 560px; background: linear-gradient(180deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.55) 38%, rgba(255, 255, 255, 0.82) 100%)"></div>
<div style="position: absolute; left: 0; top: 65px; width: 1019px; height: 15px; background: #C92337"></div>
<div style="position: absolute; left: 0; top: 80px; width: 1035px; height: 177px; background: #FFFFFF"></div>
<span style="position: absolute; left: 34px; top: 80px; height: 177px; display: flex; align-items: center; font-weight: 800; font-size: 96px; line-height: 1; color: var(--blu); white-space: nowrap">SAVE THE DATE</span>
<img data-logo src="loghi/stemma-misericordie.png" alt="Stemma della Confederazione Nazionale delle Misericordie d'Italia" style="position: absolute; left: 874px; top: 93px; width: 124px; height: auto">
<div data-riquadro style="position: absolute; left: 60px; right: 60px; top: 932px; height: 330px; display: flex; flex-direction: column; align-items: flex-start; gap: 18px">
<span data-campo="evidenziato" style="display: inline-block; line-height: 80px; padding: 0 22px 12px 28px; background: var(--blu); color: #FFFFFF; font-weight: 700; font-size: 84px; white-space: nowrap">[Titolo breve.]</span>
<p data-campo="testo" data-html style="margin: 0 0 0 2px; font-weight: 400; font-size: 51px; line-height: 53px; color: #093363; text-shadow: 0 0 10px rgba(255, 255, 255, 0.95), 0 0 3px rgba(255, 255, 255, 0.9)">Il [giorno e mese] la <strong>Misericordia di Ariccia</strong> vi aspetta in <strong>[luogo]</strong> per <strong>[che cosa succede]</strong>.</p>
</div>
<div class="firma" data-firma style="left: 62px; bottom: 40px; color: #093363; text-shadow: 0 0 10px rgba(255, 255, 255, 0.95), 0 0 3px rgba(255, 255, 255, 0.9)">Misericordia di Ariccia</div>
</div>
</body>
</html>

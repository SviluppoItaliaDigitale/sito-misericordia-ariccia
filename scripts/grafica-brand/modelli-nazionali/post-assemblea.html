<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">

<body>
<!--
Post assemblea, 1080×1350 px. Modello della Confederazione Nazionale delle Misericordie d'Italia,
rifatto identico per la Misericordia di Ariccia. Dal post nazionale dell'assemblea: carattere Roboto Condensed.
Campi (attributo data-campo):
  titolo         testo   tipo di assemblea, in una riga
  giorno         testo   giorno della settimana
  data           testo   giorno e mese (es. 15 MARZO)
  ora            testo   ora
  luogo          testo   dove si tiene, come scritto nella convocazione
  convocazione   testo   quale convocazione
  nota           testo   riga nella pillola bianca (di solito resta questa)
Si compila e si salva con .claude/skills/grafiche-modelli-nazionali/rendi.py: istruzioni in LEGGIMI.md.
-->
<div class="tavola" style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: radial-gradient(130% 95% at 0% 45%, #19A5D8 0%, #1190C8 32%, #0B72B2 60%, #06589C 82%, #044C8F 100%); font-family: 'Roboto Condensed', sans-serif; color: #FFFFFF; text-align: center">

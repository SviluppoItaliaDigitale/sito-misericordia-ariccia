<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="formato" content="1080x1350">
<title>Post di una giornata</title>
<link rel="stylesheet" href="base.css">
</head>
<body>
<!--
Post di una giornata, 1080×1350 px. Modello dei post nazionali delle ricorrenze e delle giornate (Commemorazione dei
defunti, Tutti i Santi, giornate internazionali: account Instagram misericordieitalia, settembre-novembre 2026), rifatto
per la Misericordia di Ariccia il 2/11/2026. Fascia con il nome della giornata, prima parte in giallo e resto in bianco;
titolo su due righe, la prima evidenziata e chiusa dai due punti; una frase sotto.
Campi (attributo data-campo):
  foto           foto    foto o opera che evoca la giornata; foto-posizione per il ritaglio (es. 50% 30%), foto-zoom da 1 a 2, foto-alt per la descrizione
  giornata       testo   prima parte del nome della giornata, in giallo (Commemorazione, Festa, Giornata internazionale)
  giornata-resto testo   resto del nome, in bianco (dei defunti); \n all'inizio per mandarlo sulla seconda riga
  evidenziato    testo   prima riga del titolo, sul fondo blu, di solito chiusa dai due punti (Il bene compiuto:)
  titolo         testo   seconda riga del titolo (continua a vivere)
  sottotitolo    testo   una frase sulla giornata, al massimo quattro righe
Si compila e si salva con .claude/skills/grafiche-modelli-nazionali/rendi.py: istruzioni in LEGGIMI.md.
-->
<div class="tavola" style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #0B2550; font-family: Montserrat, sans-serif">
<img data-campo="foto" data-prova src="foto-prova/piazza-di-corte.jpg" alt="[Descrizione della foto]" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 640px; background: linear-gradient(180deg, rgba(0, 22, 54, 0) 0%, rgba(0, 22, 54, 0.45) 40%, rgba(0, 22, 54, 0.8) 100%)"></div>
<div style="position: absolute; left: 0; top: 126px; width: 1032px; height: 110px; background: var(--giallo)"></div>
<div data-riquadro data-ostacolo style="position: absolute; left: 0; top: 137px; width: 1014px; height: 110px; box-sizing: border-box; padding: 0 230px 0 26px; background: var(--blu); display: flex; align-items: center">
<span style="font-weight: 700; font-size: 42px; line-height: 1.08; letter-spacing: -0.3px; white-space: nowrap"><span data-campo="giornata" style="color: var(--giallo)">[Giornata]</span> <span data-campo="giornata-resto" style="color: #FFFFFF">[nome]</span></span>
</div>
<img data-logo src="loghi/stemma-misericordie.png" alt="Stemma della Confederazione Nazionale delle Misericordie d'Italia" style="position: absolute; left: 798px; top: 80px; width: 182px; height: auto">
<div data-riquadro style="position: absolute; left: 56px; right: 60px; bottom: 118px; max-height: 560px; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-weight: 700; font-size: 54px; line-height: 64px; color: #FFFFFF"><span data-campo="evidenziato" style="display: inline-block; height: 64px; padding: 0 6px; margin-left: -6px; background: #013C7C; color: #FCF10C; white-space: nowrap">[Prima riga:]</span><br><span data-campo="titolo">[seconda riga]</span></p>
<p data-campo="sottotitolo" style="margin: 0; font-weight: 400; font-size: 40px; line-height: 47px; color: #FFFFFF">[Una frase sulla giornata]</p>
</div>
<div class="firma" data-firma style="left: 56px; bottom: 52px; color: #FFFFFF; text-shadow: 0 1px 6px rgba(0, 22, 54, 0.6)">Misericordia di Ariccia</div>
</div>
</body>
</html>

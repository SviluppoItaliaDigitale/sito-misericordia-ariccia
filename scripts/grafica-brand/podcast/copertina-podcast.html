<!doctype html>
<html lang="it">
<head>

<title>Copertina del podcast</title>
<link rel="stylesheet" href="../modelli-nazionali/base.css">
<!--
Copertina del podcast della Misericordia di Ariccia (18/11/2026). Nessun modello nazionale è
quadrato: è composta con gli elementi del kit nazionale (blu, giallo, Montserrat, fascia bianca
del carosello, triangolo ufficiale, doppia freccia gialla). Si disegna a 1000×1000 e si salva a
3000×3000 con rendi-copertina.py, che poi passa da rendi.py --cornice.
-->
<style>
  html, body { margin: 0; }
  .tavola { width: 1000px; height: 1000px; position: relative; overflow: hidden; background: var(--blu); font-family: Montserrat, sans-serif; color: #fff; }
</style>
</head>
<body>
<div class="tavola">
  <div style="position:absolute; left:0; right:0; top:110px; height:118px; background:#fff"></div>
  <img src="../modelli-nazionali/loghi/triangolo-misericordie.png" alt="" style="position:absolute; left:92px; top:86px; width:196px; height:auto">
  <div style="position:absolute; right:92px; top:110px; height:118px; display:flex; align-items:center; font-size:54px; line-height:1; letter-spacing:.01em; color:#233B74; white-space:nowrap"><span style="font-weight:400">IL</span>&nbsp;<span style="font-weight:800">PODCAST</span></div>
  <div style="position:absolute; left:92px; top:370px; width:820px; font-weight:800; font-size:104px; line-height:1.04">
    <div>Misericordia</div>
    <div>di <span style="color:var(--giallo)">Ariccia</span></div>
  </div>
  <div style="position:absolute; left:92px; top:640px; width:830px; font-weight:500; font-size:39px; line-height:1.3">Primo soccorso, kit per le emergenze,<br>la Confraternita e i suoi servizi</div>
  <svg aria-hidden="true" style="position:absolute; right:96px; bottom:96px" width="124" height="114" viewBox="0 0 94 86" fill="none" stroke="#FCEB0C" stroke-width="15" stroke-linejoin="miter" stroke-miterlimit="10"><path d="M8 8l34 35-34 35"></path><path d="M48 8l34 35-34 35"></path></svg>
  <div style="position:absolute; left:92px; bottom:104px; font-weight:600; font-size:30px; color:#fff">www.misericordia-ariccia.it</div>
</div>
</body>
</html>

<script>/*CORNICE*/</script>
<script>
(function () {
  'use strict';
  const M3 = window.Motore3D, IMP = window.IMP, THREE = window.THREE;
  const dato = n => { const e = document.getElementById('dato-' + n), s = e ? e.textContent.trim() : '';
                      return !s || s.startsWith('/*DATO:') ? null : JSON.parse(s); };
  const A = dato('anatomia'), FRASI = dato('sottotitoli') || [];
  const P = A.punti;
  const { clamp, mix, prog } = M3;
  const morb = u => 0.5 - 0.5 * Math.cos(Math.PI * clamp(u));
  const liscia = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
  const fin = (t, a, b, e = 0.4, u = 0.4) => clamp(Math.min((t - a) / e, (b - t) / u));   // finestra 0..1
  const KIT = { blu: '#003F85', giallo: '#FCEB0C', azzurro: '#009FE3', notte: '#061633' };

  /* ============================================================ scene, tempi e testi */
  // Tempi: le scene sono scritte su una scaletta fissa (inizio delle 22 frasi qui sotto); la pagina la allinea alla voce
  // vera (inizio delle frasi in sottotitoli.json) con un tratto lineare fra una frase e l'altra. Battito, compressioni,
  // tracciato e flusso del sangue vanno invece in tempo reale (110 compressioni al minuto restano 110).
  const SCALETTA = [0, 1.0, 8.6, 13.2, 17.4, 22.0, 28.0, 31.0, 35.4, 40.6, 48.0, 51.4, 59.6, 64.8, 67.8, 74.0, 80.0, 86.5,
                    94.5, 102.0, 107.8, 111.0, 114.6, 124.5];
  // le frasi lunghe sono divise in più sottotitoli (campo «riga»: la frase della voce a cui appartengono)
  const RIGHE = []; FRASI.forEach((f, i) => { const r = f.riga || i + 1; if (!RIGHE[r - 1]) RIGHE[r - 1] = { inizio: f.inizio, fine: f.fine }; else RIGHE[r - 1].fine = f.fine; });
  const VERI = RIGHE.length === 22 ? [0, ...RIGHE.map(f => f.inizio), RIGHE[21].fine + 2.8] : SCALETTA.slice();
  const interp = (x, xs, ys) => { if (x <= xs[0]) return ys[0]; for (let i = 1; i < xs.length; i++) if (x <= xs[i]) return mix(ys[i - 1], ys[i], (x - xs[i - 1]) / (xs[i] - xs[i - 1])); return ys[ys.length - 1] + (x - xs[xs.length - 1]); };
  const scaletta = tr => interp(tr, VERI, SCALETTA), reale = tp => interp(tp, SCALETTA, VERI);
  const TOTAL = VERI[VERI.length - 1];
  const SCENE = [
    { nome: 'Il cuore e il sangue', inizio: 0 },     { nome: 'Le quattro camere del cuore', inizio: 7.2 },
    { nome: 'Il giro del sangue', inizio: 12.8 },    { nome: 'L\'arresto cardiaco', inizio: 27.4 },
    { nome: 'Il cervello senza sangue', inizio: 40.0 }, { nome: 'Le compressioni', inizio: 46.4 },
    { nome: 'Ritmo e pause', inizio: 64.4 },         { nome: 'Il defibrillatore (DAE)', inizio: 79.6 },
    { nome: 'E le costole?', inizio: 93.5 },         { nome: 'Che cosa fare', inizio: 110.4 }
  ];
  window.TOTAL = TOTAL;
  const FORMATO = new URLSearchParams(location.search).get('formato') === 'verticale' ? 'verticale' : 'orizzontale';
  const VERT = FORMATO === 'verticale';
  const L = IMP.layout(FORMATO), W = L.W, H = L.H;
  window.STAGE_W = W; window.STAGE_H = H;
  for (const id of ['fondo', 'sopra', 'cornice']) { const e = document.getElementById(id); e.width = W; e.height = H; }
  const stage = document.getElementById('stage');
  const stato = IMP.monta(stage, { ente: 'misericordia', formato: FORMATO, hud: null, nota: null });
  IMP.anteprima(stage);
  // ?pulito=1: solo il 3D, senza scritte (immagini per la grafica della news, che ha la sua fascia)
  if (new URLSearchParams(location.search).get('pulito') === '1') {
    const st = document.createElement('style'); st.textContent = '#sopra,#cornice,#fonte,#imp-radice{display:none!important}'; document.head.appendChild(st);
  }

  // Ritmo: battito normale (70 al minuto), fibrillazione, compressioni a 110 al minuto con pause, scarica.
  const T_ARRESTO = reale(28.35), T_SCARICA = reale(83.4);      // tempo reale
  const RCP = [[52.4, 74.6], [77.4, 81.6], [84.2, 108.0]].map(([a, b]) => [reale(a), reale(b)]);          // compressioni (inizio, fine)
  const PERIODO_RCP = 60 / 110, PROF = 0.055;                       // 110 al minuto, 5,5 cm
  const PERIODO_CUORE = 60 / 70;
  const inRCP = t => RCP.find(([a, b]) => t >= a && t < b);
  function profondita(t) {                                          // affondamento dello sterno in metri
    const r = inRCP(t); if (!r) return 0;
    const ph = ((t - r[0]) / PERIODO_RCP) % 1;
    return PROF * (0.5 - 0.5 * Math.cos(2 * Math.PI * ph)) * clamp((r[1] - t) / 0.2);
  }
  function contrazione(t) {                                         // sistole dei ventricoli (0..1) e degli atri
    if (t >= T_ARRESTO) return { v: 0, a: 0 };
    const ph = (t / PERIODO_CUORE) % 1;
    const v = Math.exp(-Math.pow((ph - 0.3) / 0.09, 2)), a = Math.exp(-Math.pow((ph - 0.08) / 0.05, 2));
    return { v, a };
  }
  function fibrillazione(t) {                                       // ampiezza del tremito (m)
    if (t < T_ARRESTO || t >= T_SCARICA) return 0;
    return 0.0011 * liscia(T_ARRESTO, T_ARRESTO + 0.6, t);
  }
  // Velocità del sangue lungo i vasi (m/s di «onda»), arteriosa e venosa, integrata per avere il flusso al tempo t.
  function velocita(t) {
    let a = 0, v = 0;
    if (t < T_ARRESTO + 1.4) {
      const c = contrazione(Math.min(t, T_ARRESTO - 1e-3)).v, k = 1 - liscia(T_ARRESTO, T_ARRESTO + 1.4, t);
      a = (0.10 + 0.55 * c) * k; v = 0.16 * k;
    }
    const r = inRCP(t);
    if (r) {
      const ph = ((t - r[0]) / PERIODO_RCP) % 1, giu = Math.sin(2 * Math.PI * ph);
      a += 0.32 * Math.max(0, giu); v += 0.20 * Math.max(0, -giu);
    }
    return { a, v };
  }
  const PASSO = 1 / 120, flussi = [{ a: 0, v: 0 }];
  for (let k = 1; k * PASSO <= TOTAL + 0.1; k++) {
    const s = velocita((k - 0.5) * PASSO), p = flussi[k - 1];
    flussi.push({ a: p.a + s.a * PASSO, v: p.v + s.v * PASSO });
  }
  const flusso = t => { const x = clamp(t, 0, TOTAL) / PASSO, k = Math.floor(x), u = x - k, p = flussi[k], q = flussi[Math.min(k + 1, flussi.length - 1)];
                        return { a: mix(p.a, q.a, u), v: mix(p.v, q.v, u) }; };
  // Quanto si vede il sangue che scorre (bagliori nei vasi): pieno col cuore, ridotto con le compressioni.
  function vistaFlusso(t) {
    let x = 1 - liscia(T_ARRESTO, T_ARRESTO + 1.6, t);
    const r = inRCP(t); if (r) x = Math.max(x, 0.75 * clamp(Math.min((t - r[0]) / 0.8, (r[1] - t) / 0.4)));
    return x;
  }
  // Ossigeno nel cervello (0..1): cala dopo l'arresto, risale in parte con le compressioni, cala nelle pause.
  const OSS = [[0, 1], [30.2, 1], [45.6, 0.08], [52.4, 0.08], [60.0, 0.55], [74.6, 0.6], [77.2, 0.42], [80.5, 0.6],
               [81.6, 0.6], [84.1, 0.48], [93.0, 0.66], [108.0, 0.72], [124.5, 0.72]];
  function ossigeno(t) {
    for (let i = 1; i < OSS.length; i++) if (t <= OSS[i][0]) return mix(OSS[i - 1][1], OSS[i][1], morb((t - OSS[i - 1][0]) / (OSS[i][0] - OSS[i - 1][0])));
    return OSS[OSS.length - 1][1];
  }

  /* ============================================================ fondo, livello 3D, sovrimpressioni */
  const fondo = document.getElementById('fondo'), fctx = fondo.getContext('2d');
  (function () {
    const g = fctx.createRadialGradient(W * 0.5, VERT ? 820 : 470, 60, W * 0.5, VERT ? 820 : 470, VERT ? 1500 : 1250);
    g.addColorStop(0, '#0B3D7E'); g.addColorStop(0.5, '#082B5E'); g.addColorStop(1, KIT.notte);
    fctx.fillStyle = g; fctx.fillRect(0, 0, W, H);
  })();
  const vicino = M3.creaRenderer(document.getElementById('livello-scena'), W, H, { scala: 0.8 });
  const scena = new THREE.Scene();
  const camera = M3.creaCamera(W, H, { fov: VERT ? 42 : 30, zona: L.zona });
  scena.add(new THREE.HemisphereLight(0xdfe8ff, 0x1a2a4a, 1.25));
  const luce = new THREE.DirectionalLight(0xffffff, 1.5); scena.add(luce); scena.add(luce.target);
  const luce2 = new THREE.DirectionalLight(0x9fc4ff, 0.55); scena.add(luce2); scena.add(luce2.target);

  /* ============================================================ anatomia */
  function b64(s, T) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new T(u.buffer); }
  function geometria(g) {
    const q = b64(g.pos, Uint16Array), n = b64(g.nor, Int8Array), p = new Float32Array(q.length), nn = new Float32Array(q.length);
    for (let i = 0; i < q.length; i++) { const k = i % 3; p[i] = g.lo[k] + q[i] / 65535 * g.sc[k]; nn[i] = n[i] / 127; }
    const G = new THREE.BufferGeometry();
    G.setAttribute('position', new THREE.BufferAttribute(p, 3));
    G.setAttribute('normal', new THREE.BufferAttribute(nn, 3));
    G.setIndex(new THREE.BufferAttribute(b64(g.idx, g.i32 ? Uint32Array : Uint16Array), 1));
    if (g.flusso) { const f = b64(g.flusso, Uint16Array), d = new Float32Array(f.length);
                    for (let i = 0; i < f.length; i++) d[i] = f[i] / 65535 * g.flussoMax; G.setAttribute('flusso', new THREE.BufferAttribute(d, 1)); }
    G.computeBoundingSphere();
    return G;
  }
  // Uniformi comuni: affondamento del torace, tremito, contrazione, tempo, flusso.
  const U = { uAbd: { value: 0 }, uComp: { value: 0 }, uFib: { value: 0 }, uT: { value: 0 }, uFA: { value: 0 }, uFV: { value: 0 }, uVis: { value: 1 } };
  const PIANO = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0.02);   // spaccato: si tiene x <= 0,02 m
  // Affondamento dello sterno: pesato dalla profondità (0 davanti alla colonna, 1 sullo sterno) e dalla distanza
  // dalla metà inferiore dello sterno; è lo stesso per pelle, ossa, polmoni, cuore e vasi.
  // Braccio sinistro aperto in fuori (abduzione attorno alla spalla) prima di attaccare la placca laterale del DAE:
  // nella posizione del modello il braccio copre il fianco sotto l'ascella, dove la placca va sul torace.
  const SPALLA = [0.19, 1.33], LIM_BRACCIO = [0.172, 0.19, 1.27, 1.36];
  const VERT_COMP = `
    float pesoBr = smoothstep(${LIM_BRACCIO[0]}, ${LIM_BRACCIO[1]}, transformed.x) * (1.0 - smoothstep(${LIM_BRACCIO[2]}, ${LIM_BRACCIO[3]}, transformed.y));
    if (pesoBr > 0.0) { float ab = uAbd * pesoBr; vec2 dd = transformed.xy - vec2(${SPALLA[0]}, ${SPALLA[1]});
      transformed.xy = vec2(${SPALLA[0]}, ${SPALLA[1]}) + vec2(dd.x * cos(ab) - dd.y * sin(ab), dd.x * sin(ab) + dd.y * cos(ab)); }
    float pesoComp = smoothstep(0.075, 0.205, transformed.z) * exp(-pow(transformed.x / 0.115, 2.0)) * exp(-pow((transformed.y - 1.205) / 0.12, 2.0));
    transformed.z -= uComp * pesoComp;`;
  function prepara(mat, o = {}) {
    mat.onBeforeCompile = sh => {
      Object.assign(sh.uniforms, U);
      sh.uniforms.uContr = o.contr; sh.uniforms.uCentro = { value: new THREE.Vector3(P.cuore[0], P.cuore[1], P.cuore[2]) };
      sh.uniforms.uOss = o.oss || { value: 1 }; sh.uniforms.uAlfa = o.alfa || { value: 1 };
      sh.uniforms.uTinta = o.tinta || { value: new THREE.Color(0, 0, 0) }; sh.uniforms.uTintaK = o.tintaK || { value: 0 };
      let v = sh.vertexShader, f = sh.fragmentShader;
      v = v.replace('#include <common>', `#include <common>
        uniform float uAbd, uComp, uFib, uT, uFA, uFV, uVis; uniform float uContr; uniform vec3 uCentro;
        ${o.flusso ? 'attribute float flusso; varying float vFlusso;' : ''}`);
      v = v.replace('#include <begin_vertex>', `#include <begin_vertex>
        ${o.cuore ? `transformed = uCentro + (transformed - uCentro) * (1.0 - uContr);
          transformed += normal * uFib * (sin(transformed.y * 230.0 + uT * 47.0) * sin(transformed.x * 190.0 - uT * 39.0)
                                         + 0.6 * sin(transformed.z * 260.0 + uT * 61.0));` : ''}
        ${VERT_COMP}
        ${o.flusso ? 'vFlusso = flusso;' : ''}`);
      f = f.replace('#include <common>', `#include <common>
        uniform float uFA, uFV, uVis, uOss, uAlfa, uTintaK; uniform vec3 uTinta;
        ${o.flusso ? 'varying float vFlusso;' : ''}`);
      let extra = '';
      if (o.flusso) extra += `
        float onda = ${o.verso > 0 ? 'vFlusso - uFA' : 'vFlusso + uFV'};
        float fr = fract(onda / 0.11);
        float banda = smoothstep(0.0, 0.18, fr) * smoothstep(0.62, 0.18, fr);
        totalEmissiveRadiance += vec3(${o.bagliore}) * banda * uVis * 0.9;`;
      if (o.cervello) extra += `
        totalEmissiveRadiance += vec3(0.35, 0.10, 0.12) * uOss * 0.55;`;
      if (o.olo) extra += `
        float rim = pow(1.0 - abs(dot(normalize(normal), normalize(vViewPosition))), 2.4);
        diffuseColor.a = clamp((0.035 + 0.75 * rim) * uAlfa, 0.0, 1.0);
        totalEmissiveRadiance += vec3(0.45, 0.78, 1.0) * rim * 0.9;`;
      if (o.tinta) extra += `
        diffuseColor.rgb = mix(diffuseColor.rgb, uTinta, uTintaK);`;
      f = f.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>' + extra);
      sh.vertexShader = v; sh.fragmentShader = f;
    };
    mat.customProgramCacheKey = () => JSON.stringify(o, (k, x) => (x && x.value !== undefined ? 'u' : x));
    mat.clippingPlanes = [];
    return mat;
  }
  const corpo = new THREE.Group(); scena.add(corpo);                 // ruota per sdraiare la persona
  const PERNO = new THREE.Vector3(0, 1.2, 0.12);
  corpo.position.copy(PERNO);
  const dentro = new THREE.Group(); dentro.position.copy(PERNO).multiplyScalar(-1); corpo.add(dentro);
  const PARTI = {}, MATERIALI = [];
  function parte(nome, mat, gruppo = dentro) {
    const g = A.gruppi[nome]; if (!g) { console.warn('manca', nome); return null; }
    const me = new THREE.Mesh(geometria(g), mat); gruppo.add(me); PARTI[nome] = me; MATERIALI.push(mat); return me;
  }
  const std = (colore, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: colore, roughness: 0.55, metalness: 0.0, side: THREE.DoubleSide }, o));
  // pelle «olografica»: trasparente al centro, accesa sui contorni
  const alfaPelle = { value: 1 };
  parte('pelle', prepara(std(0x6fa8e8, { transparent: true, depthWrite: false, roughness: 0.4 }), { olo: true, alfa: alfaPelle })).renderOrder = 5;
  const OSSA = 0xeee6d2;
  parte('costole', prepara(std(OSSA, { transparent: true })));
  parte('colonna', prepara(std(OSSA, { transparent: true })));
  parte('polmoni', prepara(std(0xe7a3a6, { transparent: true, opacity: 0.3, depthWrite: false })));
  parte('trachea', prepara(std(0xd9e1e8, { transparent: true })));
  parte('diaframma', prepara(std(0xb5584f, { transparent: true, opacity: 0.0, depthWrite: false })));
  const ossCerv = { value: 1 }, colCerv = { value: new THREE.Color(0x8b8f99) }, kCerv = { value: 0 };
  parte('cervello', prepara(std(0xf0c0c4, { transparent: true }), { cervello: true, oss: ossCerv, tinta: colCerv, tintaK: kCerv }));
  // vasi: rosso il sangue ricco di ossigeno, blu quello povero (piccola circolazione compresa)
  const ROSSO = 0xd32f2f, BLU = 0x4f7fe8;
  parte('arterie', prepara(std(ROSSO, { transparent: true }), { flusso: true, verso: 1, bagliore: '1.0, 0.62, 0.55' }));
  parte('vene', prepara(std(BLU, { transparent: true }), { flusso: true, verso: -1, bagliore: '0.62, 0.78, 1.0' }));
  parte('arterie_polm', prepara(std(BLU, { transparent: true }), { flusso: true, verso: 1, bagliore: '0.62, 0.78, 1.0' }));
  parte('vene_polm', prepara(std(ROSSO, { transparent: true }), { flusso: true, verso: -1, bagliore: '1.0, 0.62, 0.55' }));
  // cuore: ogni parte nel suo gruppo, per la vista esplosa
  const cuore = new THREE.Group(); dentro.add(cuore);
  const contrV = { value: 0 }, contrA = { value: 0 };
  const tintaDx = { value: new THREE.Color(0x3d63c9) }, tintaSx = { value: new THREE.Color(0xc62828) }, kLato = { value: 0 };
  const PARETE = 0xb34a42;
  const PEZZI = {
    atrio_dx: { col: PARETE, contr: contrA, dir: [-1, 0.75, 0.25], tinta: tintaDx },
    atrio_sx: { col: PARETE, contr: contrA, dir: [1, 0.85, -0.45], tinta: tintaSx },
    ventricolo_dx: { col: PARETE, contr: contrV, dir: [-0.9, -0.55, 0.55], tinta: tintaDx },
    ventricolo_sx: { col: PARETE, contr: contrV, dir: [1, -0.6, 0.2], tinta: tintaSx },
    papillari: { col: 0x9c3a33, contr: contrV, dir: [0, -0.4, 0.3] },
    valvole: { col: 0xf2e3c4, contr: contrV, dir: [0, 0, 0] },
    coronarie: { col: 0xe23b30, contr: contrV, dir: [0.2, -0.3, 0.6] },
    vene_cuore: { col: 0x4f7fe8, contr: contrV, dir: [0.2, -0.3, 0.6] }
  };
  const GRUPPI_CUORE = {};
  for (const [nome, c] of Object.entries(PEZZI)) {
    const g = new THREE.Group(); cuore.add(g); GRUPPI_CUORE[nome] = g;
    const m = prepara(std(c.col, { transparent: true, roughness: 0.5 }), { cuore: true, contr: c.contr, tinta: c.tinta, tintaK: kLato });
    parte(nome, m, g);
  }
  // sangue nelle camere: particelle lungo i percorsi veri (centri delle cavità e delle valvole dall'atlante)
  const v3 = a => new THREE.Vector3(a[0], a[1], a[2]);
  const PERCORSI = [
    { col: 0x7fa4ff, punti: [[P.vcs[0], P.vcs_max[1] - 0.005, P.vcs[2]], P.vcs, P.cav_ad, P.tricuspide, P.cav_vd, P.efflusso_vd, P.v_polmonare, P.tronco_polm], n: 70 },
    { col: 0x7fa4ff, punti: [[P.vci[0], P.vci_min[1] + 0.03, P.vci[2]], P.vci, P.cav_ad, P.tricuspide, P.cav_vd, P.efflusso_vd, P.v_polmonare, P.tronco_polm], n: 70 },
    { col: 0xff6b5e, punti: [P.vp_dx_sup, P.cav_as, P.mitrale, P.cav_vs, P.efflusso_vs, P.v_aortica, P.aorta_asc, P.arco_aortico], n: 70 },
    { col: 0xff6b5e, punti: [P.vp_sx_inf, P.cav_as, P.mitrale, P.cav_vs, P.efflusso_vs, P.v_aortica, P.aorta_asc, P.arco_aortico], n: 70 }
  ].map(p => Object.assign(p, { curva: new THREE.CatmullRomCurve3(p.punti.map(v3), false, 'centripetal') }));
  const sfera = new THREE.SphereGeometry(0.0022, 10, 8);

        const jx = (M3.hash(i * 3.1 + g.seme) - 0.5) * 0.006, jy = (M3.hash(i * 5.3 + g.seme) - 0.5) * 0.006, jz = (M3.hash(i * 7.7 + g.seme) - 0.5) * 0.006;
        const px = q.x + jx, py = q.y + jy, pz = q.z + jz;
        const wq = liscia(0.075, 0.205, pz) * Math.exp(-Math.pow(px / 0.115, 2)) * Math.exp(-Math.pow((py - 1.205) / 0.12, 2));
        mm.makeTranslation(px, py, pz - comp * wq); g.im.setMatrixAt(i, mm);
      }
      g.im.instanceMatrix.needsUpdate = true;
    }
    // spaccato del torace durante le compressioni (piano sagittale, si toglie la metà verso la telecamera)
    const sezione = t >= 51.0 && t < 64.6;
    const nomiSezione = ['pelle', 'costole', 'colonna', 'polmoni', 'trachea', 'atrio_dx', 'atrio_sx', 'ventricolo_dx', 'ventricolo_sx', 'papillari', 'valvole', 'coronarie', 'vene_cuore', 'arterie', 'vene', 'arterie_polm', 'vene_polm'];
    PIANO.constant = sezione ? mix(0.4, 0.02, morb(prog(t, 51.0, 1.2))) : 1e3;
    for (const n of nomiSezione) if (PARTI[n]) PARTI[n].material.clippingPlanes = sezione ? [PIANO] : [];
    for (const g of gocce) g.m.clippingPlanes = sezione ? [PIANO] : [];
    // mani e freccia della spinta
    const vMani = t >= 49.4 && t < 79.6 ? fin(t, 49.6, 79.4, 0.5, 0.4) * (t >= 51.0 && t < 64.4 ? 1 - fin(t, 51.0, 64.4, 0.4, 0.5) : 1) : 0;
    const vM2 = vMani * (1 - fin(t, 64.2, 66.4, 0.25, 0.4));
    anello.material.opacity = vM2; anello.visible = vM2 > 0.01;
    const wM = Math.exp(-Math.pow((PUNTO_MANI.y - 1.205) / 0.12, 2)) * liscia(0.075, 0.205, PUNTO_MANI.z);
    anello.position.set(PUNTO_MANI.x, PUNTO_MANI.y, PUNTO_MANI.z - comp * wM + 0.003);
    const vFreccia = t >= 51.0 && t < 79.6 ? fin(t, 51.6, 79.4, 0.4, 0.3) * (inRCP(tr) || t < 52.4 ? 1 : 0.25) : 0;
    const vF2 = vFreccia * (1 - fin(t, 64.2, 66.4, 0.25, 0.4));
    freccia.visible = vF2 > 0.01; freccia.userData.m.opacity = vF2;
    freccia.position.set(PUNTO_MANI.x, PUNTO_MANI.y, PUNTO_MANI.z - comp * wM + 0.012);
    freccia.scale.setScalar(t >= 51.0 && t < 64.6 ? 0.2 : 0.55);   // nel primo piano della sezione resta sotto la fascia
    // placche, analisi e scarica
    const vPlacche = t >= 80.2 ? liscia(80.2, 81.0, t) * (1 - liscia(93.3, 94.2, t)) : 0;
    placche.forEach(p => { p.g.visible = vPlacche > 0.01; p.mats.forEach(m => (m.opacity = vPlacche)); });
    const lampo = tr >= T_SCARICA ? Math.exp(-(tr - T_SCARICA) / 0.12) : 0;
    scarica.material.opacity = tr >= T_SCARICA && tr < T_SCARICA + 0.6 ? clamp(lampo * 1.4) : 0;
    // frattura della costola
    const vCrepa = t >= 95.6 ? liscia(95.6, 95.75, t) * (1 - liscia(109.0, 110.0, t)) : 0;
    crepa.visible = vCrepa > 0.01; crepa.userData.m.opacity = vCrepa;
    alone.material.opacity = t >= 95.6 ? 0.7 * Math.exp(-(t - 95.6) / 0.5) : 0;
    const fr = PUNTO_FRATTURA, wF = Math.exp(-Math.pow(fr.x / 0.115, 2)) * Math.exp(-Math.pow((fr.y - 1.205) / 0.12, 2)) * liscia(0.075, 0.205, fr.z);
    crepa.position.set(fr.x, fr.y, fr.z + 0.004 - comp * wF); alone.position.copy(crepa.position);

    vicino.disegna(scena, camera);

    // --- sovrimpressioni
    s2.clearRect(0, 0, W, H);
    if (lampo > 0.01 && tr < T_SCARICA + 0.5) { s2.fillStyle = `rgba(255,250,210,${(0.55 * lampo).toFixed(3)})`; s2.fillRect(0, 0, W, H); }
    const vECG = t < 7.2 ? fin(t, 1.6, 7.0, 0.5, 0.4) : t >= 27.4 && t < 40.0 ? fin(t, 27.8, 39.8, 0.5, 0.4) : t >= 79.6 && t < 93.5 ? fin(t, 80.0, 86.3, 0.5, 0.4) : 0;
    ecg(s2, tr, vECG, tr < T_ARRESTO ? 'Battito normale' : tr < T_SCARICA ? 'Fibrillazione ventricolare' : 'Dopo la scarica', t >= 79.6 && t < 93.5);
    righello(s2, tr, t >= 52.0 && t < 64.4 ? fin(t, 52.2, 64.2, 0.5, 0.4) : 0);
    const pausa = (t >= 74.6 && t < 77.4);
    metronomo(s2, tr, t >= 64.4 && t < 79.6 ? fin(t, 64.8, 79.4, 0.5, 0.4) : 0, pausa);
    avviso(s2, 'Analisi: nessuno tocchi la persona', t >= 81.6 && t < 83.4 ? fin(t, 81.7, 83.4, 0.25, 0.15) : 0, '#FCEB0C');
    avviso(s2, 'Scarica', t >= 83.4 && t < 84.1 ? fin(t, 83.4, 84.1, 0.05, 0.25) : 0, '#FFFFFF');
    avviso(s2, 'Riprendi subito le compressioni', t >= 84.2 && t < 86.4 ? fin(t, 84.2, 86.4, 0.25, 0.3) : 0, '#7CFFB2');
    dato3(s2, t >= 87.2 && t < 93.0 ? fin(t, 87.2, 92.9, 0.4, 0.35) : 0);
    chiusura(s2, t);
    legenda(s2, t < 7.2 ? fin(t, 0.6, 7.0, 0.5, 0.4) : t >= 12.8 && t < 27.4 ? fin(t, 13.4, 27.2, 0.5, 0.5) : t >= 64.4 && t < 79.6 ? fin(t, 66.4, 79.4, 0.5, 0.4) * (VERT ? 0 : 1) : 0);
    testata(s2, SCENE[sceneA(t)].nome);

    // --- impaginazione comune: barra, nota, sottotitoli, schede
    const k = sceneA(t), sc = SCENE[k];
    IMP.aggiorna(stato, t, { passoHUD: k + (k === 0 ? 1 : clamp((t - sc.inizio) / 0.4)), notaVisibile: true, hud: sc.nome });
    IMP.sottotitoli(stato, tr, FRASI, { modo: 'parole' });
    for (const s of SCHEDE) {
      let p = null;
      if (s.punto) { const off = s.pezzo ? GRUPPI_CUORE[s.pezzo].position : null;
                     p = proietta(off ? [s.punto[0] + off.x, s.punto[1] + off.y, s.punto[2] + off.z] : s.punto); }
      IMP.scheda(stato, t, { id: s.id, titolo: s.titolo, sotto: s.sotto, punto: p, verso: VERT && s.versoV ? s.versoV : s.verso, centro: VERT && s.centroV ? s.centroV : s.centro,
                             inizio: s.inizio, fine: s.fine, visibile: !s.punto || !!p });
    }
    const testoFonte = 'Anatomia: BodyParts3D, © The Database Center for Life Science, CC BY 4.0\nContenuti: Linee guida RCP 2025, Italian Resuscitation Council';
    if (fonte.textContent !== testoFonte) fonte.textContent = testoFonte;
    fonte.style.left = L.margine + 'px'; fonte.style.top = (L.zona.basso - fonte.offsetHeight + 4) + 'px';
    fonte.style.opacity = (t < 110.4 ? 1 : 1 - clamp((t - 110.4) / 0.5)).toFixed(3);
    window.__camFerma = cam.ferma;
  }

  window.renderFrame = t => render(t);
  // Errore del 20/11/2026 (la placca laterale finiva sul braccio): la placca deve stare sul torace, non sul braccio,
  // e il braccio deve essere aperto quando le placche sono visibili.
  const problemiPlacche = [];
  if (PUNTO_PLACCA2.x >= LIM_BRACCIO[0] || PUNTO_PLACCA2.x < 0.12) problemiPlacche.push({ tipo: 'placca', dettagli: 'placca laterale del DAE fuori dal torace (x = ' + PUNTO_PLACCA2.x.toFixed(3) + ')' });
  window.__controlli = () => IMP.controlli(stato).concat(problemiPlacche)
    .concat(placche[1].g.visible && U.uAbd.value < 0.6 ? [{ tipo: 'placca', dettagli: 'placca laterale visibile con il braccio non ancora aperto' }] : []);
  Promise.all([IMP.caricaFont(), new Promise(r => { if (stemma.complete) r(); else stemma.onload = r; })]).then(() => {
    render(0);
    esitoCornice = window.corniceSovrapposta(telaCornice, fondo);   // tono preso dal fondo blu, in ogni fotogramma
    window.CORNICE_ESITO = esitoCornice;
    window.__ready = true;
  });
})();
</script>

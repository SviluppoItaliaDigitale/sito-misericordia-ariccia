  /* ============================================================ il lattante, le mani, la gamba, il piano */
  // il lattante (forme disegnate qui) con mani e piedi veri a cinque dita; braccia e mani dell'adulto vere (MakeHuman, CC0)
  const lat = L3.creaLattante(THREE, { mh: MANI }); scena.add(lat.radice);
  const braccio = {}, gruppo = {};
  for (const n of ['R', 'L']) {
    // le due maniche di tono diverso, così si leggono come due avambracci distinti
    braccio[n] = L3.creaParteMH(THREE, MANI, 'braccio.' + n, { manica: n === 'L' ? 0x2f6db3 : 0x003f85, manicaDa: 0.1 });
    gruppo[n] = new THREE.Group(); gruppo[n].add(braccio[n].mesh); scena.add(gruppo[n]);
    braccio[n].mesh.castShadow = false; braccio[n].mesh.receiveShadow = false;   // il tono della mano non si scurisce
    // manica blu lunga (revisione del 21/11/2026): dal polso in su, dritta oltre il gomito fino a uscire dal quadro; il
    // controllo «braccio» verifica che la sua estremità non si veda mai
    (function (b) {

      // tranne i due pollici; «nudo» (avambraccio nudo e continuazione color pelle) solo nei pollici. Giunzione pulita

      const tubo = []; b.mesh.traverse(o => { if (o !== b.mesh && o.isMesh) tubo.push(o); }); tubo.forEach(o => o.visible = false);
      const geo = b.mesh.geometry, pos = geo.attributes.position, la = b.ossa['lowerarm01.' + b.lato], qv = v3(0, 0, 0);
      b.mesh.updateMatrixWorld(true); const inv = new THREE.Matrix4().copy(la.matrixWorld).invert(), M = new THREE.Matrix4().copy(b.mesh.matrixWorld);

      const asseD = p => Math.hypot(p[0], p[2]); const med = P.map(asseD).sort((a, b2) => a - b2)[Math.floor(P.length / 2)];

      const yCut = Math.min(...PB.map(p => p[1])), lw = la.worldToLocal(b.ossa['wrist.' + b.lato].getWorldPosition(v3(0, 0, 0))).y;
      const ellisse = (a0, a1) => { const f = PB.filter(p => p[1] >= a0 && p[1] <= a1), cx = f.reduce((s0, p) => s0 + p[0], 0) / f.length, cz = f.reduce((s0, p) => s0 + p[2], 0) / f.length;
        let sxx = 0, szz = 0, sxz = 0; for (const [x, , z] of f) { sxx += (x - cx) ** 2; szz += (z - cz) ** 2; sxz += (x - cx) * (z - cz); }
        const th = 0.5 * Math.atan2(2 * sxz, sxx - szz), ux = Math.cos(th), uz = Math.sin(th); let a = 0, c = 0;
        for (const [x, , z] of f) { a = Math.max(a, Math.abs((x - cx) * ux + (z - cz) * uz)); c = Math.max(c, Math.abs(-(x - cx) * uz + (z - cz) * ux)); }

      // i vertici entro 4 cm dal taglio rientrano verso l'asse (fino all'85%), così restano dentro la continuazione
      const R0 = new THREE.Matrix4().copy(la.matrixWorld), toLa = new THREE.Matrix4().multiplyMatrices(inv, M), daLa = new THREE.Matrix4().copy(toLa).invert();
      for (let i = 0; i < pos.count; i++) { const [x, y, z] = P[i]; if (y > yR + 0.048) continue; const k = y < yR ? 0.85 : 0.85 + 0.15 * ((y - yR) / 0.048) ** 2;
        const q = v3(E0.cx + (x - E0.cx) * k, y, E0.cz + (z - E0.cz) * k).applyMatrix4(daLa); pos.setXYZ(i, q.x, q.y, q.z); }
      pos.needsUpdate = true; geo.computeVertexNormals();

      // oltre, allargandosi come un braccio vero, fino a uscire dal quadro

        const pp = g2.attributes.position; for (let i = 0; i < pp.count; i++) { const t = (pp.getY(i) + (ya - yb) / 2) / (ya - yb), e = t < 0.5 ? null : null;
          const A = sb.a + (sa.a - sb.a) * t, C = sb.c + (sa.c - sb.c) * t, th = sb.th + (sa.th - sb.th) * t, cx = sb.cx + (sa.cx - sb.cx) * t, cz = sb.cz + (sa.cz - sb.cz) * t;

      const matPelle = new THREE.MeshStandardMaterial({ color: 0xd9a07c, roughness: 0.55 }), matBlu = new THREE.MeshStandardMaterial({ color: b.lato === 'L' ? 0x2f6db3 : 0x003f85, roughness: 0.55 });
      const mkCont = mat => [pezzo(sez(E1, 0.97), sez(E0, 1.0), yR + 0.05, yR, mat), pezzo(sez(E0, 1.0), sez(E0, 1.12), yR, yCut - 0.12, mat), pezzo(sez(E0, 1.12), sez(E0, 1.22), yCut - 0.12, yCut - LC, mat)];
      const contP = mkCont(matPelle), contB = mkCont(matBlu);

      const yPolsino = lw - 0.1 / 1.0, cP = new THREE.Color(0xd9a07c), cB = new THREE.Color(b.lato === 'L' ? 0x2f6db3 : 0x003f85), col = new Float32Array(pos.count * 3);

      b.riposo0 = Object.fromEntries(Object.entries(b.ossa).map(([k, o]) => [k, o.quaternion.clone()]));

  /* ---------- testa di chi soccorre per i soffi (IRC 2025 cap. 9 p. 25, fig. 9) ---------- */
  // dal corpo base di MakeHuman, CC0 (mani_makehuman.py, parte «testa»): viso vero con occhi, mascella, collo e spalle,
  // colori per vertice (pelle, labbra, occhi, maglia blu); mai sfere o primitive per un volto
  const capo = MANI && MANI.parti.testa ? L3.creaParteMH(THREE, MANI, 'testa', { pelle: 0xffffff }) : null;
  const gruppoCapo = new THREE.Group(); scena.add(gruppoCapo);
  const CAPO = {};
  if (capo) {
    gruppoCapo.add(capo.mesh); capo.mesh.castShadow = false;

    const b = atob(MANI.parti.testa.colori), col = new Float32Array(b.length / 3 * 4), c = new THREE.Color(), labbra = [], viso = [];
    const pos0 = capo.mesh.geometry.attributes.position;
    // colori della testa di chi soccorre (revisione del 21/11/2026): niente sfumature nella trasparenza (lasciavano un moncone
    // sfocato); pelle, maglia blu e capelli si fondono con pesi lisci calcolati sulla posizione a riposo, così scollo e
    // attaccatura dei capelli sono morbidi e non a gradini; collo, spalle e maglia restano interi ed escono dal quadro
    const sm = (a, b2, x) => { const u = M3.clamp((x - a) / (b2 - a)); return u * u * (3 - 2 * u); };
    const cPelle = new THREE.Color().setRGB(217 * 0.86 / 255, 160 * 0.86 / 255, 124 * 0.86 / 255, THREE.SRGBColorSpace);

        let wH = sm(-0.006, 0.006, fH) * sm(0.105, 0.09, Math.abs(x)) * (1 - sm(0.058, 0.07, Math.abs(x)) * sm(0.772, 0.758, y) * sm(0.0, 0.015, z) * sm(0.075, 0.06, z));

     nel quadro), due mani viste dall'alto, avambracci perpendicolari al lattante, paralleli e distanziati; pollici affiancati
     sul giallo (metà inferiore dello sterno, punte a 8 mm); le altre dita passano sotto la schiena e se ne vedono le punte
     dal lato lontano (4 per mano, il medio più lungo). Coordinate in metri sul torace: u verso la testa, v verso chi soccorre;
     ogni fotogramma l'ancora è lo sterno proiettato, così il disegno resta attaccato al 3D e scende con le compressioni. */
  const COL2D = { pelle: '#c48a63', luce: '#dba584', bordo: '#1b2a3a', unghia: '#e8c3ad', maniche: ['#003F85', '#2F6DB3'] };
  let geo2D = null;
  function disegnaMani2D(c, m) {
    const b = lat.G.bacino, yS = 0.128, q = lat.sezione(yS);
    const P3 = (u, v, h) => b.localToWorld(v3(-v, yS + u, h === undefined ? q.z + q.rz - m.comp : h));   // v verso -x locale (chi soccorre)
    const spost = PROVA === 'mani-fuori-sterno' ? 0.03 : 0;
    const S0 = proietta(P3(0, 0)), Su = proietta(P3(0.01, 0)), Sv = proietta(P3(0, 0.01));
    if (!S0 || !Su || !Sv) { geo2D = null; return; }
    const eu = { x: (Su.x - S0.x) / 0.01, y: (Su.y - S0.y) / 0.01 }, ev = { x: (Sv.x - S0.x) / 0.01, y: (Sv.y - S0.y) / 0.01 };
    const X = (u, v) => ({ x: S0.x + eu.x * (u + spost) + ev.x * v, y: S0.y + eu.y * (u + spost) + ev.y * v });
    const rx = q.rx, kpx = Math.hypot(eu.x, eu.y);
    const poli = [], linee = [];
    c.save(); c.globalAlpha = m.alfa; c.lineJoin = 'round'; c.lineCap = 'round'; c.lineWidth = 2; c.strokeStyle = COL2D.bordo;
    // forme morbide: curve quadratiche per i punti medi (stile illustrazione medica, contorno sottile)
    const forma = (pts, fill, morbida = true) => { const Q = pts.map(p => X(p[0], p[1])); c.beginPath();
      if (morbida) { const M = (a, bq) => ({ x: (a.x + bq.x) / 2, y: (a.y + bq.y) / 2 }); const n = Q.length; let m0 = M(Q[n - 1], Q[0]); c.moveTo(m0.x, m0.y);
        for (let i = 0; i < n; i++) { const m1 = M(Q[i], Q[(i + 1) % n]); c.quadraticCurveTo(Q[i].x, Q[i].y, m1.x, m1.y); } }
      else Q.forEach((P, i) => i ? c.lineTo(P.x, P.y) : c.moveTo(P.x, P.y));
      c.closePath(); c.fillStyle = fill; c.fill(); c.stroke(); poli.push(Q); };
    const curva = (pts) => { c.beginPath(); pts.forEach((p, i) => { const P = X(p[0], p[1]); i ? c.lineTo(P.x, P.y) : c.moveTo(P.x, P.y); }); c.stroke(); };
    const pollici = [];
    [[0.026, 0], [-0.026, 1]].forEach(([uc, k]) => {
      const mz = Math.sign(uc);                                             // il pollice sta dal lato del centro
      // punte delle 4 dita che spuntano da sotto la schiena dal lato lontano (indice vicino al centro, medio il più lungo)
      const lung = [0.013, 0.017, 0.014, 0.010];                            // indice, medio (il più lungo), anulare, mignolo
      lung.forEach((L, i) => { const u = uc - mz * 0.013 + mz * i * 0.0088, v0 = -(rx - 0.001), r = i === 3 ? 0.0038 : 0.0045;
        forma([[u - r, v0 + 0.002], [u - r, v0 - L + 0.004], [u, v0 - L], [u + r, v0 - L + 0.004], [u + r, v0 + 0.002]], COL2D.pelle);
        forma([[u - r * 0.55, v0 - L + 0.0055], [u, v0 - L + 0.0018], [u + r * 0.55, v0 - L + 0.0055], [u, v0 - L + 0.007]], COL2D.unghia);   // unghia
        curva([[u - r * 0.8, v0 - L * 0.45], [u + r * 0.8, v0 - L * 0.45]]); });    // piega dell'ultima falange
      // avambraccio e manica (fino al bordo in basso), polso
      const w = 0.021;
      forma([[uc - w * 0.92, rx + 0.025], [uc + w * 0.92, rx + 0.025], [uc + w * 1.08, 0.6], [uc - w * 1.08, 0.6]], COL2D.pelle, false);
      forma([[uc - w * 1.06, rx + 0.07], [uc + w * 1.06, rx + 0.07], [uc + w * 1.18, 0.6], [uc - w * 1.18, 0.6]], COL2D.maniche[k], false);
      curva([[uc - w * 1.06, rx + 0.078], [uc + w * 1.06, rx + 0.078]]);                     // orlo del polsino
      // dorso della mano sul fianco vicino, con le nocche sul bordo del torace (le dita proseguono sotto la schiena)
      const v1 = rx - 0.006;
      forma([[uc - w * 0.92, rx + 0.036], [uc - w * 1.02, rx + 0.02], [uc - w * 1.12, v1 + 0.006], [uc - w * 0.9, v1 - 0.002], [uc, v1 - 0.004], [uc + w * 0.9, v1 - 0.002], [uc + w * 1.12, v1 + 0.006], [uc + w * 1.02, rx + 0.02], [uc + w * 0.92, rx + 0.036]], COL2D.pelle);
      for (let i = 0; i < 4; i++) { const u = uc - mz * 0.013 + mz * i * 0.0088; curva([[u - 0.004, v1 + 0.004], [u, v1 + 0.0015], [u + 0.004, v1 + 0.004]]); }
      // pollice: dalla base sul lato della mano alla punta sul giallo (due falangi, piega e unghia)
      const ub = uc - mz * 0.018, tip = [mz * 0.004, 0], base = [ub, v1 + 0.004], mid = [(ub + tip[0]) / 2 + mz * 0.002, (base[1] + tip[1]) / 2];
      const larg = (a, bb, r1, r2) => { const dx = bb[0] - a[0], dy = bb[1] - a[1], L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;
        return [[a[0] + nx * r1, a[1] + ny * r1], [bb[0] + nx * r2, bb[1] + ny * r2], [bb[0] - nx * r2, bb[1] - ny * r2], [a[0] - nx * r1, a[1] - ny * r1]]; };
      const f1 = larg(base, mid, 0.0095, 0.0082), f2 = larg(mid, tip, 0.0082, 0.0068);
      forma([f1[0], f1[1], f2[1], [tip[0] + (tip[0] - mid[0]) * 0.12, tip[1] - 0.004], f2[2], f1[2], f1[3]], COL2D.luce);
      const n1 = larg(mid, tip, 0.006, 0.0045); curva([n1[1], [tip[0], tip[1] - 0.0028], n1[2]]);          // unghia
      const cr = larg(mid, mid, 0.007, 0.007); curva([[mid[0] - 0.006, mid[1] + 0.0005], [mid[0] + 0.006, mid[1] + 0.0005]]);  // piega fra le falangi
      pollici.push(X(tip[0], tip[1] - 0.002));
    });
    c.restore();
    geo2D = { S0, poli, pollici, kpx, P3, X };
  }
  // controlli del disegno: punte dei pollici dentro il giallo proiettato, disegno attaccato allo sterno (< 3 px), niente sul
  // viso o sulle mani del lattante
  function controlliMani2D() {
    const pr = []; if (!geo2D || !mani2D || mani2D.alfa < 0.98) return pr;
    const dentro = (p, poly) => { let ins = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const a = poly[i], bq = poly[j]; if ((a.y > p.y) !== (bq.y > p.y) && p.x < (bq.x - a.x) * (p.y - a.y) / (bq.y - a.y) + a.x) ins = !ins; } return ins; };
    const b = lat.G.bacino, D = lat.G.sternoDati, giallo = [[-0.0075, D.Y1], [0.0075, D.Y1], [0.0075, D.meta], [-0.0075, D.meta]].map(([x, y]) => { const qq = lat.sezione(y); return proietta(b.localToWorld(v3(x, y, qq.z + qq.rz - mani2D.comp))); });
    geo2D.pollici.forEach((p, i) => { if (!dentro(p, giallo)) pr.push({ tipo: 'mani-2d', dettagli: `punta del pollice ${i + 1} disegnata fuori dal giallo (metà inferiore dello sterno)` }); });
    if (geo2D.pollici.length === 2) { const d = Math.hypot(geo2D.pollici[0].x - geo2D.pollici[1].x, geo2D.pollici[0].y - geo2D.pollici[1].y) / geo2D.kpx; if (d > 0.01) pr.push({ tipo: 'mani-2d', dettagli: `punte dei pollici a ${(d * 1000).toFixed(0)} mm (massimo 10)` }); }
    const ora = proietta(geo2D.P3(0, 0)); const sp = PROVA === 'mani-fuori-sterno' ? 0 : Math.hypot(ora.x - geo2D.S0.x, ora.y - geo2D.S0.y);
    if (sp > 3) pr.push({ tipo: 'mani-2d', dettagli: `disegno staccato dallo sterno di ${sp.toFixed(1)} px` });
    const viso = proietta(lat.G.testa.localToWorld(v3(0, 0.06, 0.06)));
    const manine = ['Sx', 'Dx'].map(n => proietta(mondo(lat.G['polso' + n])));
    for (const [nome, p] of [['viso', viso], ['mano sinistra del lattante', manine[0]], ['mano destra del lattante', manine[1]]]) if (p && geo2D.poli.some(poly => dentro(p, poly))) pr.push({ tipo: 'mani-2d', dettagli: `il disegno delle mani copre ${nome}` });
    return pr;
  }

  /* ---------- «giù di 1/3» accanto al torace (revisione del 21/11/2026): freccia verticale chiara, mai sopra il corpo, le
     braccia, le mani o un pannello: si prova a sinistra e a destra dello sterno e si sceglie il primo posto libero ---------- */
  // punti del viso e della testa del lattante (calotta anteriore, occhi, naso, bocca, guance) per i controlli di schede ed etichette
  function puntiViso() { const T = lat.G.testa, out = [];
    for (let a = -1.2; a <= 1.21; a += 0.4) for (let e = -0.6; e <= 1.21; e += 0.3) out.push(T.localToWorld(v3(0.066 * Math.sin(a) * Math.cos(e), 0.072 + 0.07 * Math.sin(e), 0.066 * Math.cos(a) * Math.cos(e))));
    out.push(T.localToWorld(v3(0, 0.145, 0))); return out; }
  function puntiManiAdulto() { const pts = []; for (const n of ['R', 'L']) if (gruppo[n].visible) for (const k in braccio[n].ossa) if (/finger|wrist|metacarpal/.test(k)) { pts.push(braccio[n].testa(k)); pts.push(braccio[n].punta(k)); } return pts; }
  function puntiOccupati() {
    const pts = [];
    for (const n of ['R', 'L']) if (gruppo[n].visible) for (const k in braccio[n].ossa) pts.push(braccio[n].testa(k));
    if (gruppo.R.visible) for (const n of ['R', 'L']) { const w = braccio[n].testa(`wrist.${n}`), e = braccio[n].fineOpaca ? braccio[n].fineOpaca() : w; for (let k = 0; k <= 10; k++) pts.push(w.clone().lerp(e, k / 10)); }
    for (const n of ['Sx', 'Dx']) { const a = mondo(lat.G['spalla' + n]), b = mondo(lat.G['gomito' + n]), c = mondo(lat.G['polso' + n]); for (let k = 0; k <= 6; k++) { pts.push(a.clone().lerp(b, k / 6)); pts.push(b.clone().lerp(c, k / 6)); } }
    lat.PARTI_MH.forEach(p => pts.push(...Object.keys(p.ossa).map(k => p.testa(k))));
    for (let y = -0.04; y <= 0.2; y += 0.02) for (const x of [-0.06, -0.03, 0, 0.03, 0.06]) { const q = lat.sezione(Math.max(-0.04, Math.min(0.19, y))); pts.push(lat.G.bacino.localToWorld(v3(x, y, q.z + q.rz * 0.6))); }
    pts.push(mondo(lat.G.testa));
    return pts.map(proietta).filter(Boolean);
  }
  function disegnaMarcatore(c, prof) {
    const st = proietta(lat.G.bacino.localToWorld(v3(0, 0.128, 0.058))); if (!st) return;
    const occ = puntiOccupati(), Wm = 230, Hm = 150;
    const libero = r => r.x > 70 && r.x + r.w < W - 70 && r.y > 170 && r.y + r.h < (L.zona ? L.zona.basso - 10 : H - 220) &&
      !occ.some(p => p.x > r.x - 12 && p.x < r.x + r.w + 12 && p.y > r.y - 12 && p.y < r.y + r.h + 12) &&
      !pannelli.some(q => r.x < q.x + q.w && r.x + r.w > q.x && r.y < q.y + q.h && r.y + r.h > q.y);
    const CAND = PROVA === 'freccia-coperta' ? [[-Wm / 2, -Hm / 2]] : [[-330, -80], [-330, 40], [-450, -40], [-330, -200], [-450, -200], [-560, -120], [120, 120], [200, 60], [-560, 0], [-330, 160], [-600, -260], [260, 160]];
    let r = null; for (const [dx, dy] of CAND) { const q = { x: st.x + dx, y: st.y + dy, w: Wm, h: Hm }; if (PROVA === 'freccia-coperta' || libero(q)) { r = q; break; } }
    marcatore = r ? Object.assign({ libero: libero(r) }, r) : { libero: false, nessuno: true };
    if (!r) return;
    const x0 = r.x + 34, y0 = r.y + 22, y1 = r.y + Hm - 22;
    c.save();
    pannello(c, r.x, r.y, r.w, r.h, 'rgba(252,235,12,.85)');
    c.strokeStyle = KIT.giallo; c.fillStyle = KIT.giallo; c.lineWidth = 6; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x0 - 16, y0); c.lineTo(x0 + 16, y0); c.stroke();                          // pelle a riposo
    c.beginPath(); c.moveTo(x0, y0); c.lineTo(x0, y1 - 16); c.stroke();
    c.beginPath(); c.moveTo(x0, y1 + 4); c.lineTo(x0 - 15, y1 - 20); c.lineTo(x0 + 15, y1 - 20); c.closePath(); c.fill();
    c.beginPath(); c.arc(x0, y0 + (y1 - y0) * clamp(prof), 9, 0, 7); c.fillStyle = '#FFFFFF'; c.fill();   // segno che scende con la compressione
    testo(c, 'giù di', x0 + 32, r.y + 66, 32, 700, '#FFFFFF'); testo(c, '1/3', x0 + 32, r.y + 112, 44, 900, KIT.giallo);
    c.restore();
  }
  /* ============================================================ render(t) */
  function render(tempo) {
    const t = clamp(tempo, 0, TOTAL);
    problemi = [];
    nascondiTutto();
    let inq;
    posaCorrente = t < T_PRONO ? 'aria' : t < T_GIN ? 'prono' : t < T_TAV ? 'ginocchia' : 'tavolo';
    for (const n of ['R', 'L']) braccio[n].aspetto(posaCorrente === 'ginocchia' || posaCorrente === 'tavolo' ? 'nudo' : 'manica');   // avambracci nudi solo nei due pollici
    if (t < T_PRONO) inq = posaAria(t);
    else if (t < T_GIN) inq = posaProno(t);
    else if (t < T_TAV) inq = posaGinocchia(t);
    else inq = posaTavolo(t);
    scena.updateMatrixWorld(true);
    // telecamera, con lo spostamento dell'inquadratura per lasciare posto alle schede (a destra o in basso)
    if (VERT) inq.pos = inq.c.clone().add(inq.pos.clone().sub(inq.c).multiplyScalar(1.3));
    const dist = inq.pos.distanceTo(inq.c);
    cam.position.copy(inq.pos); cam.up.set(0, 1, 0); cam.lookAt(inq.c);
    const fov = cam.fov, tg = Math.tan(fov * Math.PI / 360);
    const dx = v3(1, 0, 0).applyQuaternion(cam.quaternion), dy = v3(0, 1, 0).applyQuaternion(cam.quaternion);
    const off = VERT ? dy.multiplyScalar(0) : dx.multiplyScalar(2 * (inq.sh || 0) * dist * tg * W / H);
    cam.position.add(off); cam.near = dist * 0.03; cam.far = dist * 10 + 2; cam.updateProjectionMatrix();
    luce.position.copy(cam.position).add(v3(0.6 * dist, 1.2 * dist, 0.4 * dist)); luce.target.position.copy(inq.c);
    r.render(scena, cam);

    // dissolvenze nei tagli fra le pose
    const taglio = Math.max(...[T_PRONO, T_GIN, T_TAV].map(tc => 1 - clamp(Math.abs(t - tc) / 0.35)));
    s2.clearRect(0, 0, W, H); fondoPasso = 0; pannelli = []; marcatore = null;
    if (mani2D && mani2D.alfa > 0.01) disegnaMani2D(s2, mani2D);

    if (taglio > 0) { s2.fillStyle = `rgba(6,22,51,${taglio.toFixed(3)})`; s2.fillRect(0, 0, W, H); }

    avviso(s2, ['Non piange forte, non tossisce bene:', 'l\'aria non passa'], fin(t, S[2] + 0.2, E[2] + 1.2, 0.3, 0.3), '#ff8a80');
    passo(s2, fin(t, S[3] - 0.2, E[3] + 0.9, 0.3, 0.3), 1, 'Tossisce con forza o piange?', 'lascialo tossire e tienilo d\'occhio', '#7CFFB2');
    passo(s2, fin(t, S[4] - 0.2, E[4] + 0.9, 0.3, 0.3), 2, 'La tosse non basta?', ['chiama subito il 112', 'o fallo chiamare, in vivavoce']);
    passo(s2, fin(t, S[5] - 0.2, E[6] + DOPO[6] - 0.2, 0.3, 0.3), 3, 'Fino a 5 pacche tra le scapole', ['a pancia in giù sul tuo avambraccio,', 'appoggiato alla gamba; testa più in basso', 'mano aperta, a metà della schiena']);
    contatore(s2, fin(t, PACCHE[0] - 0.5, E[6] + DOPO[6] - 0.2, 0.3, 0.3), contati(t, PACCHE), 'pacche');
    passo(s2, fin(t, S[7] - 0.2, E[8] + DOPO[8] - 0.2, 0.3, 0.3), 4, 'Fino a 5 compressioni sul torace', ['due pollici sulla metà inferiore dello sterno', 'compressioni forti e ben staccate']);
    contatore(s2, fin(t, COMPR_G[0] - 0.5, E[8] + DOPO[8] - 0.2, 0.3, 0.3), contati(t, COMPR_G), 'compressioni');
    passo(s2, fin(t, S[9] - 0.2, E[9] + DOPO[9] - 0.2, 0.3, 0.3), 5, 'Alterna 5 pacche e 5 compressioni', 'finché piange, tossisce o respira');
    passo(s2, fin(t, S[10] - 0.2, E[10] + DOPO[10], 0.3, 0.3), 6, 'Non risponde più?', ['rianimazione subito, con 5 soffi', 'su un piano rigido, se c\'è'], '#ff8a80');
    passo(s2, fin(t, S[11] - 0.2, E[11] + DOPO[11] - 0.2, 0.3, 0.3), 7, '5 soffi', ['testa dritta, bocca su bocca e naso', 'un secondo, finché il torace si alza']);
    contatore(s2, fin(t, SOFFI[0] - 0.5, E[11] + DOPO[11] - 0.2, 0.3, 0.3), contati(t, SOFFI), 'soffi');
    passo(s2, fin(t, S[12] - 0.2, E[13] + DOPO[13] - 0.2, 0.3, 0.3), 8, 'Compressioni', ['metà inferiore dello sterno, un terzo del torace', '100-120 al minuto, lascialo risalire']);
    passo(s2, fin(t, S[14] - 0.2, E[14] + DOPO[14] - 0.2, 0.3, 0.3), 9, '30 compressioni e 2 soffi', '15 e 2 se hai fatto un corso pediatrico');
    schema302(s2, fin(t, S[14] + 0.3, E[14] + DOPO[14] - 0.2, 0.3, 0.3));
    passo(s2, fin(t, S[15] + 1.15, E[15] + DOPO[15] - 0.2, 0.3, 0.3), 10,   /* dopo il movimento della telecamera */ 'Defibrillatore anche nel lattante', ['se sei solo, prima chiama e rianima', 'modalità pediatrica, se c\'è']);
    avviso(s2, ['Niente dita in bocca alla cieca', 'togli il pezzetto solo se lo vedi bene'], fin(t, S[16] + 0.1, E[16] + DOPO[16], 0.3, 0.3), '#ff8a80');
    avviso(s2, ['Anche quando si risolve', 'subito dal medico'], fin(t, S[17] + 0.1, E[17] + DOPO[17] - 0.2, 0.3, 0.3), '#FCEB0C');
    chiusura(s2, t);
    testata(s2, SCENE[sceneA(t)].nome);
    if (freccia) disegnaMarcatore(s2, freccia.prof);

    const kS = sceneA(t), sc = SCENE[kS];
    IMP.aggiorna(stato, t, { passoHUD: kS + (kS === 0 ? 1 : clamp((t - sc.inizio) / 0.4)), notaVisibile: true, hud: sc.nome });
    IMP.sottotitoli(stato, t, FRASI, { modo: 'parole' });
    // parole non ancora dette: opacità almeno 0,74 (contrasto di almeno 4,5:1 sulla fascia, revisione del 21/11/2026)
    if (stato.sub && stato.sub.parole) stato.sub.parole.forEach(sp => { const o = +sp.style.opacity || 1; if (o < 0.995) { const n = (0.74 + 0.26 * (o - 0.5) / 0.5).toFixed(3); if (sp.style.opacity !== n) sp.style.opacity = n; } });
    // schede con la linea di richiamo
    const seg = inq.segni || {};
    const SCH = [
      { id: 'trachea', titolo: 'Vie dell\'aria', sotto: 'il pezzetto le chiude', punto: t < T_PRONO && pezzetto.visible ? pezzetto.position : null, verso: { dx: TARA('ltx', 420), dy: TARA('lty', 120) }, versoV: { dx: 230, dy: 120 }, inizio: S[1] + dur(1) * 0.6, fine: E[2] + 0.6 },

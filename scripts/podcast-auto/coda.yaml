# Coda delle puntate del podcast automatico della Misericordia di Ariccia (dal 18/11/2026).
# Due uscite a settimana (mercoledì e sabato). Si prende la prima voce con stato
# «da-fare». Le fonti sono SOLO pagine del sito già pubblicate e verificate: la
# puntata non può dire niente che queste pagine non dicano. Niente fonti esterne.
# tema: primo-soccorso | dossier | kit-prevenzione | chi-siamo (decisione di Alessandro
# del 18/11/2026); le puntate «primo-soccorso» ricevono le regole in più sulle manovre
# (prepara-fonte.py). Ordine: i quattro temi si alternano.
# «parole»: parole che, nel titolo di un'altra pagina pubblicata, la aggiungono alle fonti.
# «escludi»: pezzi di percorso da non usare come fonte (fuori tema o non ancora usciti).
# Stati: da-fare | scartata (con motivo) | programmata (con file e data di uscita).
# Schede del primo soccorso non ancora in coda (escono nel dossier più avanti):
# avvelenamento, incidente stradale, soffocamento del lattante, rianimazione nel bambino,
# fratture e le successive. Si aggiungono quando la loro news è uscita.

puntate:
- id: ictus-infarto
  tema: primo-soccorso
  titolo: 'Ictus e infarto: riconoscerli e chiamare subito il 112'
  fonti:
  - content/news/2026-10-06-primo-soccorso-ictus.md
  - content/news/2026-10-09-primo-soccorso-infarto.md
  parole:
  - ictus
  - infarto
  stato: scartata
  motivo: '19/11/2026, seconda generazione: aggiunge una motivazione che le schede
    non contengono («l''istinto spinge a dare qualcosa da bere per far riprendere
    la persona»). La prima aveva commenti sulle istruzioni («dichiarazione obbligatoria»)
    e conclusioni non nelle fonti.'
- id: chi-siamo
  tema: chi-siamo
  titolo: 'Chi siamo: la Confraternita di Misericordia di Ariccia'
  fonti:
  - content/chi-siamo.md
  - content/storia-e-tradizione.md
  parole: []
  stato: scartata
  motivo: '19/11/2026: la prima generazione legge le regole ad alta voce («il 112,
    che si pronuncia…») e fa nascere le Misericordie con Pietro da Verona; la seconda
    dice «leggevo dalle fonti», «assolutamente», «avvertenza obbligatoria», «esclusivamente»
    e trae una conclusione che le pagine non contengono.'
- id: kit-emergenze
  tema: kit-prevenzione
  titolo: 'I kit per le emergenze: prepararsi prima, con calma'
  fonti:
  - content/kit/_index.md
  - content/kit/fragilita-vulnerabilita/_index.md
  parole: []
  stato: scartata
  motivo: '19/11/2026, seconda generazione: «la Misericordia di Ariccia fa solo trasporti
    programmati e servizi sociali» (falso e non nelle pagine: fa anche corsi e assistenza
    agli eventi) e «si chiama solo il 112» (la pagina: «in caso di pericolo immediato
    chiama il 112»). La prima rafforzava le cautele («rigorosamente», «in alcun modo»).'

# Coda delle puntate del podcast automatico della Misericordia di Ariccia (dal 18/11/2026).
# Due uscite a settimana (mercoledì e sabato). Si prende la prima voce con stato
# «da-fare». Le fonti sono SOLO pagine del sito già pubblicate e verificate: la
# puntata non può dire niente che queste pagine non dicano. Niente fonti esterne.
# tema: primo-soccorso | dossier | kit-prevenzione | chi-siamo (decisione di Alessandro
# del 18/11/2026); le puntate «primo-soccorso» ricevono le regole in più sulle manovre
# (prepara-fonte.py). Ordine: i quattro temi si alternano.
# «parole»: parole che, nel titolo di un'altra pagina pubblicata, la aggiungono alle fonti.
# «escludi»: pezzi di percorso da non usare come fonte (fuori tema o non ancora usciti).
# Stati: da-fare | scartata (con motivo) | programmata (con file e data di uscita).
# Schede del primo soccorso non ancora in coda (escono nel dossier più avanti):
# avvelenamento, incidente stradale, soffocamento del lattante, rianimazione nel bambino,
# fratture e le successive. Si aggiungono quando la loro news è uscita.

puntate:
  - id: ictus-infarto
    tema: primo-soccorso
    titolo: "Ictus e infarto: riconoscerli e chiamare subito il 112"
    fonti:

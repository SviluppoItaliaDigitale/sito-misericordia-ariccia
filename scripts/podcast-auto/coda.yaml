    programmati e servizi sociali» (falso e non nelle pagine: fa anche corsi e assistenza
    agli eventi) e «si chiama solo il 112» (la pagina: «in caso di pericolo immediato
    chiama il 112»). La prima rafforzava le cautele («rigorosamente», «in alcun modo»).'

    rigorose», «non si toglie mai la prima» garza e l''esempio «tipo un ginocchio»,
    che le schede non contengono. La prima diceva «le fonti», «assolutamente», «cautela
    obbligatoria», «fa davvero la differenza» e attribuiva istinti alle persone.'
